name: Ningún secreto en el repositorio

# El sitio es público y estático: lo que entra aquí queda publicado y, además,
# en el historial de git para siempre. Esta comprobación corre antes de que eso
# pase. Ver scripts/revisar_secretos.py para el porqué.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Buscar URLs firmadas, claves y datos en claro
        run: python3 scripts/revisar_secretos.py

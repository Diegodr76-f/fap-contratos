<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centro de mando diario</title>
<meta name="description" content="Centro de operaciones personal: un solo lugar para lo que tienes que hacer, alimentado automáticamente por Microsoft To Do, Planner, los correos marcados de Outlook y el calendario.">
<meta name="theme-color" content="#F6F6F4">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Centro">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png" sizes="512x512" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #F6F6F4;
    --card:    #FFFFFF;
    --ink:     #1C1C1E;
    --ink2:    #3A3A3C;
    --gris:    #6E6E73;
    --gris2:   #8A8A8E;
    --gris3:   #A1A1A6;
    --gris4:   #C7C7CC;
    --linea:   rgba(0,0,0,.05);
    --linea2:  rgba(0,0,0,.09);
    --suave:   #F7F7F5;

    --acento:  #0A84FF;
    --rojo:    #D1453B;
    --verde:   #30A46C;
    --violeta: #A459D1;

    --ease: cubic-bezier(.32,.72,0,1);
    --sombra: 0 1px 2px rgba(0,0,0,.035), 0 18px 40px -30px rgba(0,0,0,.3);
    --sombra-alta: 0 1px 2px rgba(0,0,0,.04), 0 10px 30px -18px rgba(0,0,0,.28);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { font-family: Figtree, system-ui, -apple-system, sans-serif; color: var(--ink);
         -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button, input, textarea { font-family: inherit; }
  textarea::placeholder, input::placeholder { color: #B0B0B6; }
  a { color: var(--acento); text-decoration: none; }
  a:hover { color: #0060DF; }

  @keyframes hz-pop { 0% { transform: scale(1); } 40% { transform: scale(.82); } 100% { transform: scale(1); } }
  @keyframes hz-ring { 0% { transform: scale(.7); opacity: .55; } 100% { transform: scale(2.1); opacity: 0; } }
  @keyframes hz-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes hz-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

  #app { min-height: 100vh; background: var(--bg); padding-bottom: calc(72px + var(--safe-b)); }

  /* ---------- cabecera ---------- */
  header.top { position: sticky; top: 0; z-index: 20;
    backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px);
    background: rgba(246,246,244,.78); border-bottom: 1px solid rgba(0,0,0,.06); }
  .top-in { max-width: 1120px; margin: 0 auto; padding: 26px 28px 22px; display: flex;
            flex-wrap: wrap; gap: 24px 32px; align-items: flex-end; justify-content: space-between; }
  .fecha { font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--gris2); }
  h1.saludo { margin: 8px 0 0; font-size: clamp(34px, 5.4vw, 52px); font-weight: 700;
              letter-spacing: -.028em; line-height: 1.02; }

  .presion { display: flex; align-items: center; gap: 16px; padding: 12px 20px 12px 16px;
             border-radius: 18px; background: var(--card); border: 1px solid var(--linea);
             box-shadow: var(--sombra-alta); }
  .presion .num { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 14px;
                  font-size: 21px; font-weight: 700; letter-spacing: -.02em;
                  font-variant-numeric: tabular-nums; flex: none; }
  .presion .num.alerta { animation: hz-breathe 2.6s ease-in-out infinite; }
  .presion .p-t { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .presion .p-d { font-size: 13px; font-weight: 500; color: var(--gris2); margin-top: 2px; line-height: 1.35; }
  .presion .p-w { max-width: 230px; }

  /* ---------- barra de secciones ---------- */
  .barra { max-width: 1120px; margin: 0 auto; padding: 18px 28px 0; display: flex;
           align-items: center; gap: 14px; flex-wrap: wrap; }
  .seg { display: flex; gap: 3px; padding: 3px; border-radius: 13px; background: rgba(0,0,0,.045);
         overflow-x: auto; max-width: 100%; scrollbar-width: none; }
  .seg::-webkit-scrollbar { display: none; }
  .seg button { border: 0; background: transparent; cursor: pointer; white-space: nowrap;
                font-size: 13.5px; font-weight: 600; letter-spacing: -.006em; color: var(--gris);
                padding: 7px 14px; border-radius: 10px; transition: all .22s var(--ease);
                display: flex; align-items: center; gap: 7px; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .seg .pip { display: inline-grid; place-items: center; min-width: 17px; height: 17px; padding: 0 5px;
              border-radius: 9px; background: var(--rojo); color: #fff; font-size: 11px; font-weight: 700; }

  .sincro { margin-left: auto; display: flex; align-items: center; gap: 8px; border: 0;
            background: transparent; cursor: pointer; font-size: 12.5px; font-weight: 600;
            color: var(--gris3); padding: 6px 4px; border-radius: 9px; transition: color .22s var(--ease); }
  .sincro:hover { color: var(--ink); }
  .punto { width: 7px; height: 7px; border-radius: 50%; background: var(--gris4); flex: none; }
  .punto.viva { background: var(--verde); }
  .punto.mala { background: var(--rojo); }
  .punto.trab { background: var(--acento); animation: hz-breathe 1.4s ease-in-out infinite; }

  main.wrap { max-width: 1120px; margin: 0 auto; padding: 30px 28px 0; }
  @media (max-width: 620px) {
    .top-in { padding: 20px 18px 16px; gap: 16px; }
    .barra { padding: 14px 18px 0; }
    main.wrap { padding: 22px 18px 0; }
    .presion { padding: 10px 16px 10px 12px; gap: 12px; }
    .presion .num { width: 40px; height: 40px; font-size: 19px; }
  }

  /* ---------- horizontes ---------- */
  nav.horizontes { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
                   gap: 10px; margin-bottom: 30px; }
  .hz { text-align: left; cursor: pointer; padding: 14px 16px 15px; border-radius: 16px;
        transition: all .28s var(--ease); background: rgba(255,255,255,.45);
        border: 1px solid rgba(0,0,0,.04); color: var(--gris); }
  .hz:hover { background: var(--card); color: var(--ink); }
  .hz.on { background: var(--card); border-color: rgba(0,0,0,.06); color: var(--ink);
           box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 12px 26px -20px rgba(0,0,0,.45); }
  .hz-t { display: flex; align-items: center; gap: 8px; }
  .hz-t span.lbl { font-size: 13.5px; font-weight: 600; letter-spacing: -.005em; }
  .hz-p { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--gris4); }
  .hz-n { display: flex; align-items: baseline; gap: 7px; margin-top: 14px; }
  .hz-n b { font-size: 25px; font-weight: 700; letter-spacing: -.03em;
            font-variant-numeric: tabular-nums; line-height: 1; color: var(--gris); }
  .hz.on .hz-n b { color: var(--ink); }
  .hz-n b.alerta { color: var(--rojo); }
  .hz-n small { font-size: 12.5px; font-weight: 500; color: var(--gris3); }

  /* ---------- rejilla ---------- */
  .rejilla { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
  .col-a { flex: 1 1 440px; min-width: 0; }
  .col-b { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }

  .tarjeta { background: var(--card); border: 1px solid var(--linea); border-radius: 22px;
             box-shadow: var(--sombra); }
  .lista-card { padding: 8px 8px 12px; }
  .lista-h { display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
             padding: 18px 18px 14px; }
  .lista-h h2 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -.022em; }
  .lista-h .sub { font-size: 13.5px; font-weight: 500; color: var(--gris2); margin-top: 3px; }
  .lista-h .cuenta { font-size: 13px; font-weight: 600; color: var(--gris3);
                     font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* ---------- tarea ---------- */
  .tarea { display: flex; align-items: flex-start; gap: 13px; padding: 13px 12px 13px 14px;
           border-radius: 14px; transition: background .22s var(--ease); animation: hz-in .3s var(--ease); }
  .tarea:hover { background: var(--suave); }
  .tarea:hover .borrar { opacity: 1; }
  .tarea.hecha { opacity: .62; }

  .caja { position: relative; flex: none; width: 21px; height: 21px; margin-top: 1px;
          border-radius: 7px; cursor: pointer; display: grid; place-items: center; padding: 0;
          border: 1.7px solid var(--gris4); background: transparent;
          transition: background .25s var(--ease), border-color .25s var(--ease); }
  .caja.pop { animation: hz-pop .45s var(--ease); }
  .caja .aro { position: absolute; inset: -3px; border-radius: 10px; border: 2px solid currentColor;
               animation: hz-ring .6s var(--ease) forwards; pointer-events: none; }
  .caja svg { width: 13px; height: 13px; opacity: 0; transform: scale(.5);
              transition: opacity .2s var(--ease), transform .3s cubic-bezier(.2,1.5,.4,1); }
  .tarea.hecha .caja svg { opacity: 1; transform: scale(1); }
  .caja:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }

  .t-cuerpo { flex: 1; min-width: 0; }
  .t-txt { font-size: 15.5px; font-weight: 500; letter-spacing: -.011em; line-height: 1.4;
           word-break: break-word; color: var(--ink); cursor: text; }
  .tarea.hecha .t-txt { color: var(--gris3); text-decoration: line-through;
                        text-decoration-color: rgba(0,0,0,.2); }
  .t-txt input { width: 100%; background: var(--suave); border: 1px solid var(--linea2);
                 border-radius: 9px; padding: 6px 9px; font-size: 15.5px; font-weight: 500;
                 outline: 0; color: var(--ink); }
  .t-meta { display: flex; align-items: center; gap: 10px; margin-top: 5px; flex-wrap: wrap; }
  .t-origen { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
              font-weight: 500; color: var(--gris2); text-decoration: none; }
  a.t-origen:hover { color: var(--ink); }
  .t-origen .pt { width: 6px; height: 6px; border-radius: 50%; opacity: .85; }
  .tarea.hecha .t-origen .pt { opacity: .4; }
  .t-fecha { font-size: 12.5px; font-weight: 600; letter-spacing: -.005em; padding: 2px 8px;
             border-radius: 8px; color: var(--gris2); background: rgba(0,0,0,.04); }
  .t-fecha.tarde { color: var(--rojo); background: rgba(209,69,59,.08); }
  .t-fecha.hoy { color: var(--acento); background: rgba(10,132,255,.08); }
  .t-marca { font-size: 12.5px; font-weight: 600; color: var(--gris3); }

  .borrar { flex: none; width: 30px; height: 30px; border: 0; border-radius: 10px;
            background: transparent; color: var(--gris4); cursor: pointer; display: grid;
            place-items: center; opacity: 0;
            transition: color .2s var(--ease), background .2s var(--ease), opacity .2s var(--ease); }
  .borrar:hover { color: var(--rojo); background: rgba(209,69,59,.08); }
  .borrar:focus-visible { opacity: 1; outline: 1px solid var(--gris4); }
  @media (hover: none) { .borrar { opacity: .55; } }

  .vacio-b { padding: 34px 20px 40px; text-align: center; }
  .vacio-b .ico { width: 42px; height: 42px; margin: 0 auto 14px; border-radius: 14px;
                  background: #F2F2F0; border: 1px solid rgba(0,0,0,.04); }
  .vacio-b .t { font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .vacio-b .s { font-size: 13.5px; font-weight: 500; color: var(--gris2); margin-top: 5px;
                line-height: 1.5; max-width: 300px; margin-left: auto; margin-right: auto; }

  /* ---------- añadir ---------- */
  .agregar { margin: 14px 8px 4px; padding: 12px 12px 12px 14px; border-radius: 16px;
             background: var(--suave); border: 1px solid rgba(0,0,0,.045);
             transition: border-color .22s var(--ease); }
  .agregar.foco { border-color: rgba(10,132,255,.35); }
  .ag-fila { display: flex; align-items: center; gap: 10px; }
  .ag-marca { flex: none; width: 19px; height: 19px; border-radius: 7px; border: 1.6px dashed var(--gris4); }
  .agregar input.texto { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0;
                         font-size: 15.5px; font-weight: 500; letter-spacing: -.01em;
                         color: var(--ink); padding: 4px 0; }
  .ag-crear { flex: none; border: 0; border-radius: 11px; padding: 7px 15px; font-size: 13.5px;
              font-weight: 600; letter-spacing: -.006em; color: #fff; background: var(--acento);
              cursor: pointer; transition: all .22s var(--ease);
              box-shadow: 0 6px 16px -8px var(--acento); }
  .ag-crear:disabled { opacity: .32; cursor: default; box-shadow: none; }
  .lectura { font-size: 12.5px; font-weight: 600; color: var(--acento); padding: 8px 0 0 29px;
             letter-spacing: -.005em; }
  .ag-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
  .chip { border: 1px solid var(--linea2); background: var(--card); color: var(--gris);
          font-size: 12.5px; font-weight: 600; letter-spacing: -.005em; padding: 6px 12px;
          border-radius: 11px; cursor: pointer; transition: all .22s var(--ease); }
  .chip:hover { color: var(--ink); }
  .chip.on { border-color: transparent; color: #fff; }
  .divisor { width: 1px; height: 18px; background: var(--linea2); margin: 0 4px; }
  input[type=date], input[type=time] { background: var(--card); border: 1px solid rgba(0,0,0,.08);
    border-radius: 11px; padding: 5px 10px; font-size: 12.5px; font-weight: 500;
    color: var(--gris); outline: 0; }
  .ag-fecha { margin-left: auto; }

  .completadas { display: flex; align-items: center; justify-content: space-between; gap: 12px;
                 padding: 12px 18px 6px; }
  .completadas span { font-size: 12.5px; font-weight: 500; color: var(--gris3); }
  .completadas button { border: 0; background: transparent; font-size: 12.5px; font-weight: 600;
                        color: var(--gris2); cursor: pointer; padding: 4px 6px; border-radius: 8px;
                        transition: color .2s var(--ease); }
  .completadas button:hover { color: var(--ink); }

  /* ---------- aside ---------- */
  .panel { padding: 20px 20px 16px; }
  .panel-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
             margin-bottom: 12px; }
  .panel-h h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.018em; }
  .guardado { font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--gris3);
              transition: opacity .3s var(--ease); opacity: 0; }
  .guardado.ver { opacity: 1; }
  .notas { width: 100%; min-height: 190px; resize: vertical; border: 0; outline: 0;
           background: transparent; font-size: 14.5px; font-weight: 450; line-height: 1.65;
           color: var(--ink2); letter-spacing: -.005em; padding: 0; }

  .metodo { padding: 18px 20px; border-radius: 20px; background: rgba(255,255,255,.55);
            border: 1px solid var(--linea); backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px); }
  .metodo .k { font-size: 12.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
               color: var(--gris3); }
  .metodo p { margin: 10px 0 0; font-size: 14px; font-weight: 500; line-height: 1.6;
              color: var(--gris); text-wrap: pretty; }
  .metodo strong { color: var(--ink); font-weight: 600; }

  /* ---------- agenda ---------- */
  .dia { margin-bottom: 26px; }
  .dia-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .dia-h .d { font-size: 21px; font-weight: 700; letter-spacing: -.022em; }
  .dia-h .s { font-size: 13px; font-weight: 500; color: var(--gris2); }
  .ev { display: flex; gap: 14px; padding: 13px 16px; border-radius: 14px; background: var(--card);
        border: 1px solid var(--linea); margin-bottom: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  .ev .h { font-size: 13px; font-weight: 600; color: var(--gris2); flex: none; width: 50px;
           font-variant-numeric: tabular-nums; line-height: 1.45; }
  .ev .t { font-size: 15px; font-weight: 500; letter-spacing: -.01em; line-height: 1.35; }
  .ev .l { font-size: 12.5px; font-weight: 500; color: var(--gris3); margin-top: 3px; }
  .ev .barr { width: 3px; border-radius: 3px; flex: none; }

  /* ---------- revisión ---------- */
  .rev { padding: 20px 20px 18px; margin-bottom: 12px; }
  .rev .q { font-size: 18px; font-weight: 600; letter-spacing: -.015em; line-height: 1.35; }
  .rev .m { font-size: 13px; font-weight: 500; color: var(--gris2); margin-top: 6px; margin-bottom: 16px; }
  .rev .opts { display: flex; gap: 7px; flex-wrap: wrap; }
  .rev .opts button { border: 1px solid var(--linea2); background: var(--card); color: var(--gris);
                      border-radius: 11px; padding: 8px 14px; font-size: 13px; font-weight: 600;
                      cursor: pointer; transition: all .22s var(--ease); }
  .rev .opts button:hover { color: var(--ink); background: var(--suave); }
  .rev .opts button.si { border-color: transparent; background: var(--verde); color: #fff; }
  .rev .opts button.no { color: var(--rojo); }
  .paso { font-size: 12.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
          color: var(--gris3); margin-bottom: 14px; }
  .fin { text-align: center; padding: 54px 24px; }
  .fin .ico { width: 54px; height: 54px; margin: 0 auto 18px; border-radius: 18px;
              background: rgba(48,164,108,.1); border: 1px solid rgba(48,164,108,.2);
              display: grid; place-items: center; }
  .fin .g { font-size: 24px; font-weight: 700; letter-spacing: -.022em; margin-bottom: 8px; }
  .fin .p { color: var(--gris2); font-size: 14.5px; font-weight: 500; line-height: 1.55;
            max-width: 360px; margin: 0 auto 20px; }

  /* ---------- ajustes ---------- */
  .campo { margin-bottom: 18px; }
  .campo label { display: block; font-size: 13.5px; font-weight: 600; margin-bottom: 7px; }
  .campo input[type=text], .campo input[type=url] { width: 100%; background: var(--suave);
    border: 1px solid var(--linea2); border-radius: 12px; padding: 11px 13px; font-size: 13px;
    outline: 0; color: var(--ink); font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .campo input:focus { border-color: var(--acento); background: var(--card); }
  .ayuda { font-size: 12.5px; font-weight: 500; color: var(--gris2); margin-top: 7px; line-height: 1.55; }
  .switch { display: flex; align-items: flex-start; gap: 12px; padding: 13px 0;
            border-bottom: 1px solid var(--linea); cursor: pointer; }
  .switch:last-of-type { border-bottom: 0; }
  .switch input { margin-top: 2px; accent-color: var(--acento); width: 17px; height: 17px; flex: none; }
  .switch .s-t { font-size: 14px; font-weight: 600; letter-spacing: -.008em; }
  .switch .s-d { font-size: 12.5px; font-weight: 500; color: var(--gris2); margin-top: 3px; line-height: 1.5; }
  .btn { border: 0; border-radius: 12px; padding: 10px 17px; font-size: 13.5px; font-weight: 600;
         letter-spacing: -.006em; color: #fff; background: var(--acento); cursor: pointer;
         transition: all .22s var(--ease); box-shadow: 0 6px 16px -8px var(--acento); }
  .btn:hover { filter: brightness(1.05); }
  .btn.linea { background: var(--card); border: 1px solid var(--linea2); color: var(--ink); box-shadow: none; }
  .btn.linea:hover { background: var(--suave); filter: none; }
  .btn:disabled { opacity: .4; cursor: default; box-shadow: none; }
  .fila-btn { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
  .info { font-size: 13px; font-weight: 500; color: var(--gris); line-height: 1.6; }
  .info b { color: var(--ink); font-weight: 600; }
  .info code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
               background: rgba(0,0,0,.045); padding: 2px 6px; border-radius: 6px; color: var(--ink2); }

  .toast { position: fixed; left: 50%; transform: translateX(-50%);
           bottom: calc(28px + var(--safe-b)); background: var(--ink); color: #fff;
           font-size: 13.5px; font-weight: 500; padding: 12px 20px; border-radius: 14px;
           z-index: 90; opacity: 0; transition: opacity .25s var(--ease), transform .25s var(--ease);
           pointer-events: none; box-shadow: 0 12px 40px -12px rgba(0,0,0,.5); max-width: 90vw;
           text-align: center; }
  .toast.ver { opacity: 1; transform: translateX(-50%) translateY(-6px); }

  .cargando { color: var(--gris3); font-size: 13.5px; font-weight: 500; padding: 80px 0;
              text-align: center; }

  /* ---------- acceso ---------- */
  .candado { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center;
             justify-content: center; padding: 24px; background: var(--bg);

  .candado .tarjeta { max-width: 380px; width: 100%; padding: 30px 28px 26px; border-radius: 24px;
                      box-shadow: var(--sombra); }
  .candado .ico { width: 46px; height: 46px; border-radius: 15px; background: rgba(10,132,255,.1);
                  border: 1px solid rgba(10,132,255,.2); display: grid; place-items: center;
                  margin-bottom: 16px; }
  .candado h1 { font-size: 23px; font-weight: 700; letter-spacing: -.024em; margin-bottom: 8px; }
  .candado p { color: var(--gris2); font-size: 14px; font-weight: 500; line-height: 1.55;
               margin-bottom: 18px; }
  .candado input[type=password] { width: 100%; background: var(--suave); border: 1px solid var(--linea2);
        border-radius: 12px; padding: 12px 14px; color: var(--ink); font-size: 15px;
        font-weight: 500; outline: 0; transition: border-color .22s var(--ease); }
  .candado input[type=password]:focus { border-color: var(--acento); background: var(--card); }
  .candado input + input { margin-top: 9px; }
  .candado .err { background: rgba(209,69,59,.08); color: var(--rojo); border-radius: 11px;
                  padding: 10px 13px; font-size: 13px; font-weight: 500; margin-bottom: 14px;
                  line-height: 1.4; }
  .candado button.entrar { display: block; width: 100%; margin-top: 14px; padding: 13px;
        background: var(--acento); color: #fff; border: 0; border-radius: 12px; font-weight: 600;
        font-size: 15px; cursor: pointer; box-shadow: 0 8px 20px -10px var(--acento); }
  .candado .olvide { display: block; text-align: center; margin: 16px auto 0; background: 0;
                     border: 0; color: var(--gris3); font-size: 12.5px; font-weight: 500;
                     cursor: pointer; padding: 4px; }
  .candado .olvide:hover { color: var(--gris); }

<body>
<div id="app"><div class="cargando">Cargando…</div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   CENTRO DE MANDO DIARIO
   ---------------------------------------------------------------------
   Una sola página, sin servidor propio y sin librerías externas.
   - Lo que escribes vive en este navegador (localStorage).
   - Lo del trabajo (To Do, Planner, correos marcados, calendario) entra
     por un flujo de Power Automate tuyo: el navegador le habla directo.
     La URL del flujo se guarda SOLO aquí, nunca en el repositorio, así
     que nada personal se publica en GitHub Pages.
   - Lo que creas aquí puede devolverse a Microsoft To Do, para que la
     notificación suene donde ya suena (celular, Outlook, reloj).
   ===================================================================== */
(function () {
  "use strict";

  var LS      = "centro:estado:v1";
  var VERSION = 1;

  var HZ = [
    { k: "hoy",     titulo: "Hoy",           sub: "ahora",       vacioT: "Nada para hoy",
      vacioS: "Disfrútalo. Si aparece algo urgente, añádelo aquí abajo." },
    { k: "corto",   titulo: "Corto plazo",   sub: "esta semana", vacioT: "Esta semana está libre",
      vacioS: "Guarda aquí lo que tiene que pasar en los próximos días." },
    { k: "mediano", titulo: "Mediano plazo", sub: "este mes",    vacioT: "Nada este mes",
      vacioS: "Lo que no es de esta semana pero sí de este mes va aquí." },
    { k: "largo",   titulo: "Largo plazo",   sub: "algún día",   vacioT: "Sin ideas guardadas",
      vacioS: "Un lugar para lo que quieres hacer algún día, sin fecha." }
  ];
  var ORDEN_H = ["hoy", "corto", "mediano", "largo"];
  function hzDe(k) { return HZ.find(function (h) { return h.k === k; }) || HZ[0]; }

  /* Las tres primeras las escribes tú; las otras llegan solas del trabajo. */
  var FUENTES = {
    trabajo:  { label: "Trabajo",  color: "#0A84FF", mia: true },
    personal: { label: "Personal", color: "#30A46C", mia: true },
    curso:    { label: "Curso",    color: "#A459D1", mia: true },
    todo:     { label: "To Do",    color: "#5E5CE6" },
    planner:  { label: "Planner",  color: "#0E9AA7" },
    correo:   { label: "Correo",   color: "#FF7A5C" },
    agenda:   { label: "Agenda",   color: "#8A8A8E" }
  };
  function fuenteDe(k) { return FUENTES[k] || { label: k || "—", color: "#8A8A8E" }; }

  var ACENTO = "#0A84FF", ROJO = "#D1453B", VERDE = "#30A46C";

  var E = null;
  var vista = "hoy";       // hoy | agenda | revision | ajustes
  var filtro = "hoy";
  var nuevo = { h: "hoy", f: "trabajo", fecha: "", hora: "" };
  var editando = null;
  var celebrando = null;
  var revIdx = 0;
  var sync = { estado: "idle", msg: "" };
  var tNotas = null, tToast = null, tSync = null, tCel = null;

  var app = document.getElementById("app");
  var elToast = document.getElementById("toast");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }

  /* ============ pantalla de acceso ============
     El repositorio es público (GitHub Pages gratis no permite sitios
     privados), pero tus tareas nunca viajan ahí: viven solo en este
     localStorage. Esta pantalla es una cortina contra quien encuentre el
     link por casualidad, no una caja fuerte — cada dispositivo elige su
     propia frase la primera vez y la recuerda después. */
  var LS_LLAVE = "centro:llave";
  var LS_ABIERTO = "centro:desbloqueado";

  async function sha256(texto) {
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texto));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }
  function candado(modo, mensaje) {
    return new Promise(function (resolve) {
      var primera = modo === "crear";
      var wrap = document.createElement("div");
      wrap.className = "candado";
      wrap.innerHTML =
        '<div class="tarjeta">' +
          '<div class="ico"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="#0A84FF" ' +
            'stroke-width="1.8" stroke-linecap="round"><rect x="4" y="8.5" width="12" height="8" rx="2.5"/>' +
            '<path d="M6.8 8.5V6.2a3.2 3.2 0 0 1 6.4 0v2.3"/></svg></div>' +
          '<h1>' + (primera ? "Crea tu frase de acceso" : "Acceso protegido") + '</h1>' +
          '<p>' + (primera
            ? "Este centro es tuyo. Elige una frase que puedas recordar: te la pedirá cada vez que entres desde un dispositivo nuevo."
            : "Ingresa tu frase de acceso para entrar.") + '</p>' +
          (mensaje ? '<div class="err">' + esc(mensaje) + '</div>' : "") +
          '<form>' +
            '<input type="password" id="frase" autocomplete="current-password" placeholder="Frase de acceso">' +
            (primera ? '<input type="password" id="frase2" autocomplete="new-password" placeholder="Repite la frase">' : "") +
            '<button type="submit" class="entrar">Entrar</button>' +
          '</form>' +
          (!primera ? '<button class="olvide" id="olvide" type="button">¿Olvidaste tu frase de este dispositivo?</button>' : "") +
        '</div>';
      document.body.appendChild(wrap);
      var f1 = wrap.querySelector("#frase");
      f1.focus();
      wrap.querySelector("form").addEventListener("submit", async function (e) {
        e.preventDefault();
        var v = f1.value;
        if (!v.trim()) return;
        if (primera) {
          var v2 = wrap.querySelector("#frase2").value;
          if (v !== v2) { wrap.remove(); resolve(await candado("crear", "Las frases no coinciden. Intenta de nuevo.")); return; }
          localStorage.setItem(LS_LLAVE, await sha256(v));
          localStorage.setItem(LS_ABIERTO, "1");
          wrap.remove(); resolve(true);
        } else if (await sha256(v) === localStorage.getItem(LS_LLAVE)) {
          localStorage.setItem(LS_ABIERTO, "1");
          wrap.remove(); resolve(true);
        } else {
          wrap.remove(); resolve(await candado("entrar", "Frase incorrecta. Inténtalo de nuevo."));
        }
      });
      var olv = wrap.querySelector("#olvide");
      if (olv) olv.addEventListener("click", async function () {
        if (confirm("Esto borra lo guardado en este dispositivo (tareas y notas) y te deja crear una frase nueva. ¿Continuar?")) {
          localStorage.removeItem(LS); localStorage.removeItem(LS_LLAVE); localStorage.removeItem(LS_ABIERTO);
          wrap.remove(); resolve(await candado("crear"));
        }
      });
    });
  }
  function candadoRevisar() {
    if (localStorage.getItem(LS_ABIERTO) === "1" && localStorage.getItem(LS_LLAVE)) return Promise.resolve(true);
    return candado(localStorage.getItem(LS_LLAVE) ? "entrar" : "crear");
  }

  /* ============ utilidades ============ */
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function isoDe(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function hoyISO() { return isoDe(new Date()); }
  function mas(iso, n) { var d = new Date((iso || hoyISO()) + "T00:00:00"); d.setDate(d.getDate() + n); return isoDe(d); }
  function dias(iso) {
    if (!iso) return null;
    return Math.round((new Date(iso + "T00:00:00") - new Date(hoyISO() + "T00:00:00")) / 864e5);
  }
  function toast(msg) {
    elToast.textContent = msg;
    elToast.classList.add("ver");
    clearTimeout(tToast);
    tToast = setTimeout(function () { elToast.classList.remove("ver"); }, 2800);
  }
  var DIAS_L = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];

  function fechaTexto(iso, hora) {
    if (!iso) return null;
    var d = dias(iso), txt;
    if (d < 0)        txt = d === -1 ? "Venció ayer" : "Venció hace " + (-d) + " días";
    else if (d === 0) txt = "Hoy";
    else if (d === 1) txt = "Mañana";
    else if (d < 8)   txt = "En " + d + " días";
    else txt = new Date(iso + "T00:00:00").toLocaleDateString("es-ES", { day: "numeric", month: "long" });
    return { txt: txt + (hora ? " · " + hora : ""), tarde: d < 0, hoy: d === 0 };
  }
  function diaLargo(iso) {
    return new Date(iso + "T00:00:00").toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
  }

  /* El horizonte que le toca a una fecha. Es la regla que hace que nada
     se quede escondido: si la fecha se acerca, la tarea se acerca. */
  function horizonteDe(iso) {
    var d = dias(iso);
    if (d === null) return null;
    if (d <= 0) return "hoy";
    if (d <= 7) return "corto";
    if (d <= 31) return "mediano";
    return "largo";
  }

  /* ============ persistencia ============ */
  function vacio() {
    return {
      v: VERSION, tareas: [], eventos: [], notas: "",
      cfg: { flow: "", auto: true, devolver: true, lista: "", revisionHecha: null },
      meta: { ultimaSync: null, ultimoDia: hoyISO() }
    };
  }
  function cargar() {
    try {
      var crudo = localStorage.getItem(LS);
      E = crudo ? JSON.parse(crudo) : vacio();
    } catch (e) { E = vacio(); }
    var base = vacio();
    if (!E || typeof E !== "object") E = base;
    if (!Array.isArray(E.tareas)) E.tareas = [];
    if (!Array.isArray(E.eventos)) E.eventos = [];
    if (typeof E.notas !== "string") E.notas = "";
    E.cfg = Object.assign(base.cfg, E.cfg || {});
    E.meta = Object.assign(base.meta, E.meta || {});
  }
  function guardar() {
    try { localStorage.setItem(LS, JSON.stringify(E)); }
    catch (e) { toast("No se pudo guardar en este navegador."); }
  }

  /* ============ lectura de lenguaje natural ============ */
  /* "llamar a Ana mañana 9am" → texto + fecha + hora, sin formularios. */
  var DIA_NUM = { domingo:0, lunes:1, martes:2, "miercoles":3, "miércoles":3, jueves:4, viernes:5, "sabado":6, "sábado":6 };
  var MES_NUM = { ene:0, enero:0, feb:1, febrero:1, mar:2, marzo:2, abr:3, abril:3, may:4, mayo:4,
                  jun:5, junio:5, jul:6, julio:6, ago:7, agosto:7, sep:8, sept:8, septiembre:8,
                  oct:9, octubre:9, nov:10, noviembre:10, dic:11, diciembre:11 };

  function leer(entrada) {
    var t = " " + entrada + " ";
    var r = { texto: entrada, fecha: null, hora: null, repetir: null, fuente: null, importante: false };
    function quita(re) {
      var m = t.match(re);
      if (m) t = t.replace(m[0], " ");
      return m;
    }
    var m;

    /* repetición */
    m = quita(/\bcada\s+(d[ií]a|semana|mes|a[nñ]o|lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)\b/i);
    if (m) {
      var p = m[1].toLowerCase();
      if (/^d/.test(p)) r.repetir = "dia";
      else if (/^s/.test(p) && /semana/.test(p)) r.repetir = "semana";
      else if (/^m/.test(p) && /mes/.test(p)) r.repetir = "mes";
      else if (/^a/.test(p)) r.repetir = "anio";
      else { r.repetir = "semana"; r.fecha = proximoDia(DIA_NUM[p.normalize("NFC")]); }
    }

    /* fuente por etiqueta:  #trabajo  #personal  #curso */
    m = quita(/#(personal|trabajo|curso)\b/i);
    if (m) r.fuente = m[1].toLowerCase();

    /* importante */
    m = quita(/(^|\s)!(\s|$)/);
    if (m) r.importante = true;

    /* fechas relativas */
    if (!r.fecha) {
      if (quita(/\bpasado\s+ma[nñ]ana\b/i)) r.fecha = mas(hoyISO(), 2);
      else if (quita(/\bma[nñ]ana\b/i)) r.fecha = mas(hoyISO(), 1);
      else if (quita(/\bhoy\b/i)) r.fecha = hoyISO();
      else if ((m = quita(/\ben\s+(\d{1,3})\s*(d[ií]as?|semanas?|meses?)\b/i))) {
        var n = parseInt(m[1], 10), u = m[2].toLowerCase();
        r.fecha = /^s/.test(u) ? mas(hoyISO(), n * 7) : /^m/.test(u) ? mas(hoyISO(), n * 30) : mas(hoyISO(), n);
      }
      else if ((m = quita(/\b(?:el\s+|este\s+|pr[oó]ximo\s+|la\s+pr[oó]xima\s+)?(lunes|martes|mi[eé]rcoles|miercoles|jueves|viernes|s[aá]bado|sabado|domingo)\b/i))) {
        r.fecha = proximoDia(DIA_NUM[m[1].toLowerCase()]);
      }
      else if ((m = quita(/\b(?:el\s+)?(\d{1,2})\s*(?:de\s+)?(ene|enero|feb|febrero|mar|marzo|abr|abril|may|mayo|jun|junio|jul|julio|ago|agosto|sep|sept|septiembre|oct|octubre|nov|noviembre|dic|diciembre)\b/i))) {
        r.fecha = enMes(parseInt(m[1], 10), MES_NUM[m[2].toLowerCase()]);
      }
      else if ((m = quita(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/))) {
        var anio = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : null;
        r.fecha = anio ? anio + "-" + pad(+m[2]) + "-" + pad(+m[1]) : enMes(+m[1], +m[2] - 1);
      }
      else if (quita(/\bfin\s+de\s+semana\b/i)) r.fecha = proximoDia(6);
    }

    /* hora: "9am", "14:30", "a las 9" */
    m = quita(/\b(?:a\s+las\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm|h)\b/i);
    if (!m) m = quita(/\b(?:a\s+las\s+)(\d{1,2})(?::(\d{2}))?\b/i);
    if (!m) m = quita(/\b(\d{1,2}):(\d{2})\b/);
    if (m) {
      var h = parseInt(m[1], 10), mi = m[2] ? parseInt(m[2], 10) : 0, suf = (m[3] || "").toLowerCase();
      if (suf === "pm" && h < 12) h += 12;
      if (suf === "am" && h === 12) h = 0;
      if (h >= 0 && h <= 23 && mi >= 0 && mi <= 59) r.hora = pad(h) + ":" + pad(mi);
    }

    r.texto = t.replace(/\s{2,}/g, " ").trim();
    if (!r.texto) r.texto = entrada.trim();   // no dejar la tarea sin nombre
    return r;
  }
  function proximoDia(dow) {
    var hoy = new Date(hoyISO() + "T00:00:00"), delta = (dow - hoy.getDay() + 7) % 7;
    return mas(hoyISO(), delta === 0 ? 7 : delta);
  }
  function enMes(d, mes) {
    var hoy = new Date(), anio = hoy.getFullYear();
    var iso = anio + "-" + pad(mes + 1) + "-" + pad(d);
    if (dias(iso) < 0) iso = (anio + 1) + "-" + pad(mes + 1) + "-" + pad(d);
    return iso;
  }
  function resumenLectura(r) {
    var p = [];
    if (r.fecha) p.push(fechaTexto(r.fecha, r.hora).txt);
    else if (r.hora) p.push(r.hora);
    if (r.repetir) p.push("cada " + { dia: "día", semana: "semana", mes: "mes", anio: "año" }[r.repetir]);
    if (r.fuente) p.push(fuenteDe(r.fuente).label);
    if (r.importante) p.push("importante");
    return p.length ? p.join(" · ") : "";
  }

  /* ============ el motor: nada se queda escondido ============ */
  function reubicar() {
    var cambios = 0;
    E.tareas.forEach(function (t) {
      if (t.hecha || !t.fecha) return;
      var h = horizonteDe(t.fecha);
      if (h && ORDEN_H.indexOf(h) < ORDEN_H.indexOf(t.horizonte)) { t.horizonte = h; cambios++; }
    });
    if (E.meta.ultimoDia !== hoyISO()) { E.meta.ultimoDia = hoyISO(); cambios++; }
    if (cambios) guardar();
  }
  function vencidas() {
    return E.tareas.filter(function (t) { return !t.hecha && t.fecha && dias(t.fecha) < 0; });
  }
  function pendientes(h) {
    return E.tareas.filter(function (t) { return !t.hecha && (!h || t.horizonte === h); });
  }
  function necesitaRevision() {
    return vencidas().length > 0 || (E.cfg.revisionHecha !== hoyISO() && pendientes("hoy").length > 0);
  }

  /* ============ acciones ============ */
  function crear(entrada) {
    var r = leer(entrada);
    var fecha = nuevo.fecha || r.fecha;
    var t = {
      id: uid(), texto: r.texto, fuente: r.fuente || nuevo.f,
      horizonte: fecha ? (horizonteDe(fecha) || nuevo.h) : nuevo.h,
      fecha: fecha || null, hora: nuevo.hora || r.hora || null,
      repetir: r.repetir || null, importante: r.importante,
      hecha: false, creada: new Date().toISOString(), ext: null, pend: null
    };
    if (E.cfg.devolver && E.cfg.flow) t.pend = "crear";
    E.tareas.unshift(t);
    nuevo.fecha = ""; nuevo.hora = "";
    filtro = t.horizonte;   // te lleva a donde aterrizó, pero el chip se queda donde lo pusiste
    guardar(); pintar();
    var i = document.getElementById("txt"); if (i) i.focus();
    if (t.pend) empujar();
  }
  function alternar(id) {
    var t = buscar(id);
    if (!t) return;
    t.hecha = !t.hecha;
    t.hechaEn = t.hecha ? new Date().toISOString() : null;
    if (t.hecha) {
      celebrando = id;
      clearTimeout(tCel);
      tCel = setTimeout(function () { celebrando = null; pintar(); }, 620);
    } else celebrando = null;
    if (t.hecha && t.repetir) reprogramar(t);
    if (t.ext || E.cfg.devolver) t.pend = t.pend === "crear" ? "crear" : "estado";
    guardar(); pintar();
    if (t.pend && E.cfg.flow) empujar();
  }
  function reprogramar(t) {
    /* una tarea repetida no se "termina": nace la siguiente */
    var base = t.fecha || hoyISO(), sig;
    if (t.repetir === "dia") sig = mas(base, 1);
    else if (t.repetir === "semana") sig = mas(base, 7);
    else if (t.repetir === "mes") { var d = new Date(base + "T00:00:00"); d.setMonth(d.getMonth() + 1); sig = isoDe(d); }
    else { var a = new Date(base + "T00:00:00"); a.setFullYear(a.getFullYear() + 1); sig = isoDe(a); }
    while (dias(sig) < 0) sig = t.repetir === "dia" ? mas(sig, 1) : mas(sig, 7);
    E.tareas.unshift({
      id: uid(), texto: t.texto, fuente: t.fuente, horizonte: horizonteDe(sig),
      fecha: sig, hora: t.hora, repetir: t.repetir, importante: t.importante,
      hecha: false, creada: new Date().toISOString(), ext: null,
      pend: (E.cfg.devolver && E.cfg.flow) ? "crear" : null
    });
  }
  function mover(id, destino) {
    var t = buscar(id); if (!t) return;
    if (destino === "hoy" || destino === "manana" || destino === "semana") {
      t.fecha = destino === "hoy" ? hoyISO() : destino === "manana" ? mas(hoyISO(), 1) : proximoDia(1);
      t.horizonte = horizonteDe(t.fecha);
      if (t.ext) t.pend = "fecha";
    } else {
      t.horizonte = destino;
      if (destino !== "hoy" && t.fecha && dias(t.fecha) <= 0) t.fecha = null;
    }
    guardar();
  }
  function borrar(id) {
    var t = buscar(id);
    E.tareas = E.tareas.filter(function (x) { return x.id !== id; });
    guardar(); pintar();
    if (t && t.ext) toast("Borrada de aquí. En " + fuenteDe(t.fuente).label + " sigue existiendo.");
  }
  function limpiarCompletadas() {
    E.tareas = E.tareas.filter(function (t) { return !(t.hecha && t.horizonte === filtro); });
    guardar(); pintar();
  }
  function buscar(id) { return E.tareas.find(function (t) { return t.id === id; }); }

  /* ============ puente con Microsoft (Power Automate) ============ */
  function cambiosPendientes() {
    return E.tareas.filter(function (t) { return t.pend; }).map(function (t) {
      return {
        accion: t.pend === "crear" ? "crear" : t.pend === "fecha" ? "mover" : "completar",
        local: t.id, sys: t.ext ? t.ext.sys : null, id: t.ext ? t.ext.id : null,
        texto: t.texto, fecha: t.fecha, hora: t.hora, hecha: !!t.hecha,
        lista: E.cfg.lista || null
      };
    });
  }
  function empujar() { if (!tSync) tSync = setTimeout(function () { tSync = null; sincronizar(false); }, 1200); }

  function sincronizar(manual) {
    if (!E.cfg.flow) {
      if (manual) toast("Falta la URL del flujo. Ve a Ajustes.");
      return Promise.resolve(false);
    }
    if (sync.estado === "sync") return Promise.resolve(false);
    sync.estado = "sync"; pintarSync();
    var cuerpo = {
      op: "sync", cliente: "centro", version: VERSION, hoy: hoyISO(),
      agendaDesde: hoyISO(), agendaHasta: mas(hoyISO(), 8),
      cambios: cambiosPendientes()
    };
    return fetch(E.cfg.flow, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(cuerpo)
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (d) {
      fusionar(d);
      sync.estado = "ok"; sync.msg = "";
      E.meta.ultimaSync = new Date().toISOString();
      guardar(); pintar();
      if (manual) toast("Al día con Microsoft.");
      return true;
    }).catch(function (e) {
      sync.estado = "error";
      sync.msg = (e && e.message) || "error";
      pintarSync();
      if (manual) toast("No se pudo sincronizar (" + sync.msg + "). Lo tuyo sigue guardado aquí.");
      return false;
    });
  }

  function fusionar(d) {
    if (!d || typeof d !== "object") return;

    /* 1. confirmaciones de lo que empujamos */
    (d.creadas || []).forEach(function (c) {
      var t = buscar(c.local);
      if (t) { t.ext = { sys: c.sys || "todo", id: c.id, url: c.url || null, lista: c.lista || null }; t.pend = null; }
    });
    (d.aplicados || []).forEach(function (id) {
      var t = buscar(id); if (t) t.pend = null;
    });
    if (!d.aplicados) E.tareas.forEach(function (t) { if (t.pend && t.pend !== "crear") t.pend = null; });

    /* 2. tareas que llegan de Microsoft */
    var remotas = Array.isArray(d.tareas) ? d.tareas : [];
    var sistemas = {};
    remotas.forEach(function (t) { sistemas[t.sys || "todo"] = true; });
    var indice = {};
    E.tareas.forEach(function (t) { if (t.ext) indice[t.ext.sys + ":" + t.ext.id] = t; });
    var vistos = {};

    remotas.forEach(function (rt) {
      var sys = rt.sys || "todo";
      var clave = sys + ":" + rt.id;
      vistos[clave] = true;
      var local = indice[clave];
      var fuente = FUENTES[sys] ? sys : "trabajo";
      if (!local) {
        var h = horizonteDe(rt.fecha) || "corto";   // sin fecha → esta semana, no invade el Hoy
        E.tareas.push({
          id: uid(), texto: rt.texto || "(sin título)", fuente: fuente,
          horizonte: h, fecha: rt.fecha || null, hora: rt.hora || null,
          repetir: null, importante: !!rt.importante, hecha: !!rt.hecha,
          creada: rt.creada || new Date().toISOString(),
          ext: { sys: sys, id: rt.id, url: rt.url || null, lista: rt.lista || null },
          pend: null
        });
      } else if (!local.pend) {
        /* la fuente manda en el texto, la fecha y el estado; el horizonte es tuyo */
        local.texto = rt.texto || local.texto;
        local.importante = !!rt.importante;
        if (local.ext) { local.ext.url = rt.url || local.ext.url; local.ext.lista = rt.lista || local.ext.lista; }
        if ((rt.fecha || null) !== local.fecha) {
          local.fecha = rt.fecha || null;
          var nh = horizonteDe(local.fecha);
          if (nh && ORDEN_H.indexOf(nh) < ORDEN_H.indexOf(local.horizonte)) local.horizonte = nh;
        }
        if (!!rt.hecha !== !!local.hecha) {
          local.hecha = !!rt.hecha;
          local.hechaEn = local.hecha ? new Date().toISOString() : null;
        }
      }
    });

    /* 3. lo que desapareció en el origen (borrado allá) se va de aquí */
    E.tareas = E.tareas.filter(function (t) {
      if (!t.ext || t.pend) return true;
      if (!sistemas[t.ext.sys]) return true;              // esa fuente no vino en esta sync
      return !!vistos[t.ext.sys + ":" + t.ext.id];
    });

    /* 4. agenda (solo lectura, se reemplaza entera) */
    if (Array.isArray(d.eventos)) {
      E.eventos = d.eventos.map(function (ev) {
        return {
          id: ev.id || uid(), titulo: ev.titulo || "(sin título)",
          inicio: ev.inicio || null, fin: ev.fin || null,
          lugar: ev.lugar || "", url: ev.url || null, todoElDia: !!ev.todoElDia
        };
      }).filter(function (ev) { return ev.inicio; })
        .sort(function (a, b) { return a.inicio < b.inicio ? -1 : 1; });
    }
    reubicar();
  }

  /* ============ exportar ============ */
  function bajar(nombre, contenido, tipo) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([contenido], { type: tipo || "text/plain;charset=utf-8" }));
    a.download = nombre;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }
  function ics() {
    var L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Centro de mando//ES", "CALSCALE:GREGORIAN"];
    var sello = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
    pendientes().filter(function (t) { return t.fecha; }).forEach(function (t) {
      var f = t.fecha.replace(/-/g, "");
      L.push("BEGIN:VTODO", "UID:" + t.id + "@centro", "DTSTAMP:" + sello,
             "SUMMARY:" + String(t.texto).replace(/[\r\n,;]/g, " "),
             t.hora ? "DUE:" + f + "T" + t.hora.replace(":", "") + "00" : "DUE;VALUE=DATE:" + f,
             "CATEGORIES:" + fuenteDe(t.fuente).label, "END:VTODO");
    });
    L.push("END:VCALENDAR");
    bajar("centro-de-mando.ics", L.join("\r\n"), "text/calendar;charset=utf-8");
  }

  /* ============ pintar ============ */
  function pintar() {
    reubicar();
    var vs = vencidas();
    var deHoy = pendientes("hoy");
    var focoIds = {};
    vs.concat(deHoy).forEach(function (t) { focoIds[t.id] = 1; });
    var foco = Object.keys(focoIds).length;

    var estado = vs.length ? "alerta" : (foco === 0 ? "calma" : "activo");
    var color = estado === "alerta" ? ROJO : estado === "calma" ? VERDE : ACENTO;
    var pTitulo = estado === "alerta" ? "Hay algo vencido"
                : estado === "calma" ? "Estás al día"
                : (foco === 1 ? "1 cosa para hoy" : foco + " cosas para hoy");
    var pDetalle = estado === "alerta"
      ? (vs.length === 1 ? "1 tarea pasó de fecha" : vs.length + " tareas pasaron de fecha") +
        (deHoy.length ? " · " + deHoy.length + " para hoy" : "")
      : estado === "calma" ? "Nada urgente en Hoy. Lo demás puede esperar."
      : "Solo esto. El resto está guardado.";

    var saludo = vista === "agenda" ? "Agenda"
               : vista === "revision" ? "Revisión"
               : vista === "ajustes" ? "Ajustes"
               : hzDe(filtro).titulo;

    app.innerHTML =
      '<header class="top"><div class="top-in">' +
        '<div>' +
          '<div class="fecha">' + esc(diaLargo(hoyISO())) + '</div>' +
          '<h1 class="saludo">' + esc(saludo) + '</h1>' +
        '</div>' +
        '<div class="presion">' +
          '<div class="num ' + (estado === "alerta" ? "alerta" : "") + '" style="color:' + color +
            ';background:' + color + '14;border:1px solid ' + color + '26">' + foco + '</div>' +
          '<div class="p-w"><div class="p-t">' + esc(pTitulo) + '</div>' +
          '<div class="p-d">' + esc(pDetalle) + '</div></div>' +
        '</div>' +
      '</div></header>' +
      barraHTML() +
      '<main class="wrap">' +
        (vista === "agenda"   ? vAgenda() :
         vista === "revision" ? vRevision() :
         vista === "ajustes"  ? vAjustes() : vTareas()) +
      '</main>';

    conectar();
  }

  function barraHTML() {
    var tabs = [["hoy", "Tareas"], ["agenda", "Agenda"], ["revision", "Revisión"], ["ajustes", "Ajustes"]];
    var vs = vencidas().length;
    return '<div class="barra"><div class="seg">' + tabs.map(function (x) {
      var pip = (x[0] === "revision" && necesitaRevision()) ? '<span class="pip">' + (vs || "!") + '</span>' : "";
      return '<button data-tab="' + x[0] + '" class="' + (vista === x[0] ? "on" : "") + '">' +
             esc(x[1]) + pip + '</button>';
    }).join("") + '</div>' +
    '<button class="sincro" id="sync-btn">' + syncHTML() + '</button></div>';
  }
  function syncHTML() {
    var cls = !E.cfg.flow ? "" : sync.estado === "error" ? "mala" : sync.estado === "sync" ? "trab" : "viva";
    var txt = !E.cfg.flow ? "Sin conectar"
            : sync.estado === "sync" ? "Sincronizando…"
            : sync.estado === "error" ? "Sin conexión"
            : E.meta.ultimaSync ? "Al día · " + new Date(E.meta.ultimaSync).toLocaleTimeString("es", { hour: "2-digit", minute: "2-digit" })
            : "Conectado";
    var n = E.tareas.filter(function (t) { return t.pend; }).length;
    return '<span class="punto ' + cls + '"></span>' + esc(txt) + (n ? " · " + n + " por enviar" : "");
  }
  function pintarSync() {
    var b = document.getElementById("sync-btn");
    if (b) b.innerHTML = syncHTML();
  }

  /* ---------- vista: tareas ---------- */
  function vTareas() {
    var hoy = hoyISO();
    var pend = pendientes();
    var cuenta = function (k) { return pend.filter(function (t) { return t.horizonte === k; }).length; };
    var vencePorH = function (k) {
      return pend.filter(function (t) { return t.horizonte === k && t.fecha && t.fecha < hoy; }).length;
    };

    var nav = '<nav class="horizontes">' + HZ.map(function (h) {
      var on = filtro === h.k, alerta = vencePorH(h.k) > 0;
      var c = h.k === "hoy" ? ACENTO : alerta ? ROJO : "#D6D6D8";
      return '<button class="hz ' + (on ? "on" : "") + '" data-zona="' + h.k + '">' +
        '<div class="hz-t"><span class="hz-p" style="background:' + ((h.k === "hoy" || alerta) ? c : "#D6D6D8") + '"></span>' +
        '<span class="lbl">' + h.titulo + '</span></div>' +
        '<div class="hz-n"><b class="' + (alerta ? "alerta" : "") + '">' + cuenta(h.k) + '</b>' +
        '<small>' + h.sub + '</small></div></button>';
    }).join("") + '</nav>';

    var hz = hzDe(filtro);
    var enFiltro = E.tareas.filter(function (t) { return t.horizonte === filtro; });
    var completadas = enFiltro.filter(function (t) { return t.hecha; }).length;
    var lista = enFiltro.slice().sort(function (a, b) {
      if (a.hecha !== b.hecha) return a.hecha ? 1 : -1;
      if (!!a.importante !== !!b.importante) return a.importante ? -1 : 1;
      return (a.fecha || "9999-99") > (b.fecha || "9999-99") ? 1 : -1;
    });
    var pendFiltro = enFiltro.filter(function (t) { return !t.hecha; }).length;

    var aviso = "";
    if (vencidas().length) {
      aviso = '<div class="tarjeta" style="padding:16px 18px;margin-bottom:18px;display:flex;gap:14px;' +
        'align-items:center;flex-wrap:wrap;border-color:rgba(209,69,59,.2);background:rgba(209,69,59,.04)">' +
        '<div style="flex:1;min-width:190px;font-size:14px;font-weight:500;line-height:1.45">Se te pasaron ' +
        '<b style="font-weight:700;color:' + ROJO + '">' + vencidas().length + '</b> ' +
        (vencidas().length === 1 ? "cosa" : "cosas") + '. Decide qué hacer en un minuto.</div>' +
        '<button class="btn" data-tab="revision">Revisar ahora</button></div>';
    }

    return aviso + nav +
      '<div class="rejilla"><div class="col-a">' +
        '<section class="tarjeta lista-card">' +
          '<div class="lista-h"><div><h2>' + hz.titulo + '</h2>' +
            '<div class="sub">' + hz.sub + '</div></div>' +
            '<div class="cuenta">' + (pendFiltro === 0 ? "Sin pendientes" : pendFiltro === 1 ? "1 pendiente" : pendFiltro + " pendientes") + '</div>' +
          '</div>' +

          (lista.length
            ? '<div>' + lista.map(tareaHTML).join("") + '</div>'
            : '<div class="vacio-b"><div class="ico"></div>' +
              '<div class="t">' + hz.vacioT + '</div>' +
              '<div class="s">' + hz.vacioS + '</div></div>') +

          agregarHTML() +

          (completadas ? '<div class="completadas"><span>' +
            (completadas === 1 ? "1 completada" : completadas + " completadas") + " en " + hz.titulo.toLowerCase() +
            '</span><button id="limpiar">Limpiar completadas</button></div>' : "") +
        '</section>' +
      '</div>' +

      '<aside class="col-b">' +
        (E.cfg.flow ? agendaLateralHTML() : "") +
        '<section class="tarjeta panel">' +
          '<div class="panel-h"><h2>Notas</h2><span class="guardado" id="est"></span></div>' +
          '<textarea class="notas" id="notas" placeholder="Ideas sueltas, pendientes sin forma, lo que sea…">' + esc(E.notas) + '</textarea>' +
        '</section>' +
        '<section class="metodo">' +
          '<div class="k">El método</div>' +
          '<p>Mira solo <strong>Hoy</strong>. Lo demás está guardado a propósito: existe para que puedas olvidarlo hasta que toque.</p>' +
          '<p>Lo que tiene fecha <strong>sube solo</strong> cuando se acerca. Nada se queda escondido en «algún día».</p>' +
          (E.cfg.flow
            ? '<p>Planner, tus correos marcados y To Do entran solos. Lo que creas aquí vuelve a <strong>To Do</strong>, para que la alarma suene en tu celular.</p>'
            : '<p>Conecta tu <strong>Power Automate</strong> en Ajustes y Planner, los correos marcados y el calendario aparecerán aquí sin que los copies.</p>') +
        '</section>' +
      '</aside></div>';
  }

  function tareaHTML(t) {
    var f = fechaTexto(t.fecha, t.hora);
    var fu = fuenteDe(t.fuente);
    var cCaja = t.hecha ? (f && f.tarde ? "#A1A1A6" : ACENTO) : "#C7C7CC";
    var cel = celebrando === t.id;
    var editar = editando === t.id;
    return '<div class="tarea ' + (t.hecha ? "hecha" : "") + '">' +
      '<button class="caja ' + (cel ? "pop" : "") + '" data-alt="' + t.id + '" aria-label="Marcar como completada" ' +
        'style="border-color:' + cCaja + ';background:' + (t.hecha ? cCaja : "transparent") + ';color:' + cCaja + '">' +
        (cel ? '<span class="aro"></span>' : "") +
        '<svg viewBox="0 0 14 14" fill="none"><path d="M2.6 7.4 5.5 10.2 11.4 3.9" stroke="#fff" ' +
        'stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></button>' +
      '<div class="t-cuerpo">' +
        '<div class="t-txt" data-edit="' + t.id + '">' +
          (editar ? '<input type="text" id="ed" value="' + esc(t.texto) + '">'
                  : (t.importante ? '<span style="color:' + ACENTO + '">! </span>' : "") + esc(t.texto)) +
        '</div>' +
        '<div class="t-meta">' +
          (t.ext && t.ext.url
            ? '<a class="t-origen" href="' + esc(t.ext.url) + '" target="_blank" rel="noopener">' +
              '<span class="pt" style="background:' + fu.color + '"></span>' + esc(fu.label) +
              (t.ext.lista ? " · " + esc(t.ext.lista) : "") + '</a>'
            : '<span class="t-origen"><span class="pt" style="background:' + fu.color + '"></span>' + esc(fu.label) + '</span>') +
          (f ? '<span class="t-fecha ' + (!t.hecha && f.tarde ? "tarde" : !t.hecha && f.hoy ? "hoy" : "") + '">' + esc(f.txt) + '</span>' : "") +
          (t.repetir ? '<span class="t-marca" title="Se repite">↻</span>' : "") +
          (t.pend ? '<span class="t-marca" title="Pendiente de enviar">↑</span>' : "") +
        '</div>' +
      '</div>' +
      '<button class="borrar" data-del="' + t.id + '" aria-label="Eliminar tarea">' +
        '<svg viewBox="0 0 14 14" fill="none" style="width:13px;height:13px"><path d="M3.4 3.4l7.2 7.2M10.6 3.4l-7.2 7.2" ' +
        'stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>' +
      '</div>';
  }

  function agregarHTML() {
    return '<div class="agregar" id="caja-agregar">' +
      '<div class="ag-fila">' +
        '<span class="ag-marca"></span>' +
        '<input type="text" class="texto" id="txt" placeholder="Añadir una tarea…" autocomplete="off" enterkeyhint="done">' +
        '<button class="ag-crear" id="add" disabled>Añadir</button>' +
      '</div>' +
      '<div class="lectura" id="lectura"></div>' +
      '<div class="ag-chips">' +
        HZ.map(function (h) {
          var on = nuevo.h === h.k, c = h.k === "hoy" ? ACENTO : "#48484A";
          return '<button class="chip ' + (on ? "on" : "") + '" data-h="' + h.k + '"' +
                 (on ? ' style="background:' + c + ';box-shadow:0 4px 12px -6px ' + c + '"' : "") + '>' + h.titulo + '</button>';
        }).join("") +
        '<span class="divisor"></span>' +
        Object.keys(FUENTES).filter(function (k) { return FUENTES[k].mia; }).map(function (k) {
          var on = nuevo.f === k, c = FUENTES[k].color;
          return '<button class="chip ' + (on ? "on" : "") + '" data-f="' + k + '"' +
                 (on ? ' style="background:' + c + ';box-shadow:0 4px 12px -6px ' + c + '"' : "") + '>' + FUENTES[k].label + '</button>';
        }).join("") +
        '<input type="date" class="ag-fecha" id="fch" value="' + nuevo.fecha + '" aria-label="Fecha de cumplimiento">' +
      '</div></div>';
  }

  function eventosDe(iso) {
    return E.eventos.filter(function (ev) { return String(ev.inicio).slice(0, 10) === iso; });
  }
  function horaDe(s) { return s && s.length > 11 ? s.slice(11, 16) : "—"; }
  function agendaLateralHTML() {
    var hoy = eventosDe(hoyISO());
    return '<section class="tarjeta panel">' +
      '<div class="panel-h"><h2>Hoy en la agenda</h2>' +
      '<span style="font-size:13px;font-weight:600;color:var(--gris3)">' + hoy.length + '</span></div>' +
      (hoy.length
        ? hoy.slice(0, 5).map(function (ev) {
            return '<div style="display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--linea)">' +
              '<div style="font-size:13px;font-weight:600;color:var(--gris2);flex:none;width:44px;' +
              'font-variant-numeric:tabular-nums">' + (ev.todoElDia ? "Todo" : esc(horaDe(ev.inicio))) + '</div>' +
              '<div style="min-width:0"><div style="font-size:14.5px;font-weight:500;letter-spacing:-.008em;line-height:1.35">' +
              (ev.url ? '<a href="' + esc(ev.url) + '" target="_blank" rel="noopener" style="color:inherit">' + esc(ev.titulo) + '</a>' : esc(ev.titulo)) +
              '</div>' + (ev.lugar ? '<div style="font-size:12.5px;font-weight:500;color:var(--gris3);margin-top:2px">' + esc(ev.lugar) + '</div>' : "") +
              '</div></div>';
          }).join("")
        : '<div style="font-size:13.5px;font-weight:500;color:var(--gris2);line-height:1.5">Sin reuniones. El día es tuyo.</div>') +
      '</section>';
  }

  /* ---------- vista: agenda ---------- */
  function vAgenda() {
    if (!E.cfg.flow) {
      return '<div class="tarjeta panel" style="max-width:560px">' +
        '<div class="info">La agenda se llena con tu calendario de Outlook. Conecta el flujo en ' +
        '<b>Ajustes</b> y verás aquí los próximos ocho días, junto con lo que tienes que hacer cada día.</div>' +
        '<div style="margin-top:16px"><button class="btn" data-tab="ajustes">Ir a Ajustes</button></div></div>';
    }
    var out = "";
    for (var i = 0; i < 8; i++) {
      var iso = mas(hoyISO(), i);
      var evs = eventosDe(iso);
      var trs = E.tareas.filter(function (t) { return !t.hecha && t.fecha === iso; });
      if (i > 2 && !evs.length && !trs.length) continue;
      out += '<div class="dia"><div class="dia-h"><div class="d">' +
        (i === 0 ? "Hoy" : i === 1 ? "Mañana" : esc(DIAS_L[new Date(iso + "T00:00:00").getDay()])) +
        '</div><div class="s">' + esc(diaLargo(iso)) + '</div></div>' +
        (evs.length || trs.length
          ? trs.map(function (t) {
              var fu = fuenteDe(t.fuente);
              return '<div class="ev"><div class="barr" style="background:' + fu.color + '"></div>' +
                '<div class="h">' + (t.hora ? esc(t.hora) : "—") + '</div>' +
                '<div><div class="t">' + esc(t.texto) + '</div>' +
                '<div class="l">' + esc(fu.label) + '</div></div></div>';
            }).join("") +
            evs.map(function (ev) {
              return '<div class="ev"><div class="barr" style="background:#C7C7CC"></div>' +
                '<div class="h">' + (ev.todoElDia ? "Todo<br>el día" : esc(horaDe(ev.inicio)) + "<br>" + esc(horaDe(ev.fin))) + '</div>' +
                '<div><div class="t">' + (ev.url ? '<a href="' + esc(ev.url) + '" target="_blank" rel="noopener" style="color:inherit">' + esc(ev.titulo) + '</a>' : esc(ev.titulo)) + '</div>' +
                (ev.lugar ? '<div class="l">' + esc(ev.lugar) + '</div>' : "") + '</div></div>';
            }).join("")
          : '<div style="font-size:13.5px;font-weight:500;color:var(--gris3);padding:4px 2px">Libre.</div>') +
        '</div>';
    }
    return out;
  }

  /* ---------- vista: revisión ---------- */
  function colaRevision() {
    var v = vencidas();
    var hoyP = pendientes("hoy").filter(function (t) { return !t.fecha || dias(t.fecha) >= 0; });
    var proximas = E.tareas.filter(function (t) {
      return !t.hecha && t.horizonte !== "hoy" && t.fecha && dias(t.fecha) >= 0 && dias(t.fecha) <= 1;
    });
    return v.concat(proximas, hoyP);
  }
  function vRevision() {
    var cola = colaRevision();
    if (!cola.length) {
      E.cfg.revisionHecha = hoyISO(); guardar();
      return '<div class="tarjeta fin" style="max-width:560px">' +
        '<div class="ico"><svg width="26" height="26" viewBox="0 0 20 20" fill="none" stroke="' + VERDE + '" ' +
        'stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 7.5 14.5 16.5 5"/></svg></div>' +
        '<div class="g">Todo revisado</div>' +
        '<div class="p">No queda nada vencido ni sin decidir. Si algo aparece durante el día, lo verás en <b>Hoy</b>.</div>' +
        '<button class="btn linea" data-tab="hoy">Volver a las tareas</button></div>';
    }
    if (revIdx >= cola.length) revIdx = 0;
    var t = cola[revIdx];
    var f = fechaTexto(t.fecha, t.hora);
    var fu = fuenteDe(t.fuente);
    return '<div style="max-width:600px">' +
      '<div class="paso">Revisión del día · ' + (revIdx + 1) + ' de ' + cola.length + '</div>' +
      '<div class="tarjeta rev">' +
        '<div class="q">' + esc(t.texto) + '</div>' +
        '<div class="m">' + esc(fu.label + (f ? " · " + f.txt : " · sin fecha")) + '</div>' +
        '<div class="opts">' +
          '<button class="si" data-rev="hecha">Ya está</button>' +
          '<button data-rev="hoy">Hoy</button>' +
          '<button data-rev="manana">Mañana</button>' +
          '<button data-rev="semana">Esta semana</button>' +
          '<button data-rev="mediano">Este mes</button>' +
          '<button data-rev="largo">Algún día</button>' +
          '<button class="no" data-rev="borrar">Ya no aplica</button>' +
          '<button data-rev="saltar">Dejar así</button>' +
        '</div>' +
      '</div>' +
      '<div class="info" style="margin-top:16px">Esta es la parte que Recordatorios y To Do no hacen: obligarte a ' +
      '<b>decidir</b> qué pasa con lo que se te pasó, en vez de dejarlo en rojo para siempre.</div></div>';
  }

  /* ---------- vista: ajustes ---------- */
  function vAjustes() {
    var n = E.tareas.filter(function (t) { return t.pend; }).length;
    return '<div class="rejilla"><div class="col-a">' +
      '<section class="tarjeta panel">' +
        '<div class="panel-h"><h2>Conexión con tu trabajo</h2></div>' +
        '<div class="campo">' +
          '<label>URL del flujo de Power Automate</label>' +
          '<input type="url" id="cfg-flow" placeholder="https://…/triggers/manual/paths/invoke?…&amp;sig=…" value="' + esc(E.cfg.flow) + '">' +
          '<div class="ayuda">Es la dirección que te da el disparador <b>«Cuando se recibe una solicitud HTTP»</b>. ' +
          'Se guarda solo en este dispositivo: no viaja al repositorio ni la ve nadie más. ' +
          'El paso a paso está en <code>centro/CONECTAR.md</code>.</div>' +
        '</div>' +
        '<div class="campo">' +
          '<label>Lista de To Do donde se crean tus tareas</label>' +
          '<input type="text" id="cfg-lista" placeholder="Tareas" value="' + esc(E.cfg.lista || "") + '">' +
          '<div class="ayuda">Déjalo vacío para usar la lista predeterminada.</div>' +
        '</div>' +
        '<label class="switch"><input type="checkbox" id="cfg-auto" ' + (E.cfg.auto ? "checked" : "") + '>' +
          '<span><div class="s-t">Sincronizar sola</div><div class="s-d">Al abrir la app, al volver a ella y cada 10 minutos.</div></span></label>' +
        '<label class="switch"><input type="checkbox" id="cfg-dev" ' + (E.cfg.devolver ? "checked" : "") + '>' +
          '<span><div class="s-t">Devolver a Microsoft To Do</div>' +
          '<div class="s-d">Lo que escribes aquí se crea también en To Do, y ahí sí te suena la alarma en el celular ' +
          'y aparece en Outlook. Al completarlo aquí, se completa allá.</div></span></label>' +
        '<div class="fila-btn" style="margin-top:18px">' +
          '<button class="btn" id="probar">Probar y sincronizar</button>' +
          (n ? '<span style="font-size:12.5px;font-weight:600;color:var(--gris3)">' + n + ' cambio(s) por enviar</span>' : "") +
        '</div>' +
      '</section>' +

      '<section class="tarjeta panel" style="margin-top:22px">' +
        '<div class="panel-h"><h2>Tus datos</h2></div>' +
        '<div class="fila-btn">' +
          '<button class="btn linea" id="exp-ics">Exportar a Recordatorios (.ics)</button>' +
          '<button class="btn linea" id="exp-json">Copia de seguridad</button>' +
          '<button class="btn linea" id="imp-json">Restaurar</button>' +
          '<input type="file" id="file" accept="application/json" style="display:none">' +
        '</div>' +
        '<div class="ayuda">Lo que escribes vive en este navegador. La copia de seguridad es un archivo tuyo; ' +
        'restaurar reemplaza todo lo que hay aquí.</div>' +
      '</section>' +

      '<section class="tarjeta panel" style="margin-top:22px">' +
        '<div class="panel-h"><h2>Acceso</h2></div>' +
        '<div class="fila-btn">' +
          '<button class="btn linea" id="cambiar-frase">Cambiar frase de este dispositivo</button>' +
          '<button class="btn linea" id="cerrar-sesion">Pedirla de nuevo la próxima vez</button>' +
        '</div>' +
        '<div class="ayuda">Cada dispositivo tiene su propia frase — no hace falta que sea igual en el celular y en la compu.</div>' +
      '</section>' +
      '</div>' +

      '<aside class="col-b">' +
        '<section class="tarjeta panel"><div class="panel-h"><h2>Qué entra y qué no</h2></div>' +
        '<div class="info"><b>Entran solas:</b> tus listas de <b>To Do</b>, las tareas de <b>Planner</b> asignadas a ti, ' +
        'los <b>correos marcados</b> de Outlook y las reuniones del <b>calendario</b>.<br><br>' +
        'Ojo: To Do te <i>muestra</i> Planner en «Asignadas a mí», pero no lo entrega por API — por eso el flujo lee ' +
        'Planner aparte. El calendario nunca está en To Do.<br><br>' +
        '<b>No entra nada de contratos.</b> Este centro es personal y no toca la base del CRM ni el CLM.</div></section>' +

        '<section class="tarjeta panel"><div class="panel-h"><h2>Privacidad</h2></div>' +
        '<div class="info">La página es pública, <b>tus tareas no</b>. Nunca se publican en GitHub: viven en este ' +
        'navegador y viajan directo entre tu dispositivo y tu flujo de Power Automate.</div></section>' +

        '<section class="tarjeta panel"><div class="panel-h"><h2>Instalar</h2></div>' +
        '<div class="info">En el celular: <b>Compartir → Añadir a pantalla de inicio</b>. En el escritorio: el icono de ' +
        'instalar de la barra de direcciones. Queda como una app y funciona sin internet.</div></section>' +
      '</aside></div>';
  }

  /* ============ eventos ============ */
  function conectar() {
    app.querySelectorAll("[data-tab]").forEach(function (b) {
      b.addEventListener("click", function () {
        vista = b.dataset.tab; revIdx = 0; pintar();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
    var sb = document.getElementById("sync-btn");
    if (sb) sb.addEventListener("click", function () {
      if (!E.cfg.flow) { vista = "ajustes"; pintar(); } else sincronizar(true);
    });

    if (vista === "hoy") conectarTareas();
    if (vista === "revision") conectarRevision();
    if (vista === "ajustes") conectarAjustes();
  }

  function conectarTareas() {
    var txt = document.getElementById("txt");
    var fch = document.getElementById("fch");
    var add = document.getElementById("add");
    var lec = document.getElementById("lectura");
    var caja = document.getElementById("caja-agregar");

    function revisar() {
      var v = txt.value.trim();
      add.disabled = !v;
      lec.textContent = v ? resumenLectura(leer(v)) : "";
    }
    txt.addEventListener("input", revisar);
    txt.addEventListener("focus", function () { caja.classList.add("foco"); });
    txt.addEventListener("blur", function () { caja.classList.remove("foco"); });
    txt.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && txt.value.trim()) crear(txt.value);
    });
    add.addEventListener("click", function () { if (txt.value.trim()) crear(txt.value); });
    fch.addEventListener("change", function (e) { nuevo.fecha = e.target.value; });

    app.querySelectorAll("[data-zona]").forEach(function (b) {
      b.addEventListener("click", function () { filtro = b.dataset.zona; nuevo.h = b.dataset.zona; pintar(); });
    });
    app.querySelectorAll("[data-h]").forEach(function (b) {
      b.addEventListener("click", function () { nuevo.h = b.dataset.h; pintar(); document.getElementById("txt").focus(); });
    });
    app.querySelectorAll("[data-f]").forEach(function (b) {
      b.addEventListener("click", function () { nuevo.f = b.dataset.f; pintar(); document.getElementById("txt").focus(); });
    });
    app.querySelectorAll("[data-alt]").forEach(function (b) {
      b.addEventListener("click", function () { alternar(b.dataset.alt); });
    });
    app.querySelectorAll("[data-del]").forEach(function (b) {
      b.addEventListener("click", function () { borrar(b.dataset.del); });
    });
    var lim = document.getElementById("limpiar");
    if (lim) lim.addEventListener("click", limpiarCompletadas);

    /* edición en línea del texto */
    app.querySelectorAll("[data-edit]").forEach(function (d) {
      d.addEventListener("click", function () {
        if (editando === d.dataset.edit) return;
        editando = d.dataset.edit; pintar();
        var i = document.getElementById("ed");
        if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
      });
    });
    var ed = document.getElementById("ed");
    if (ed) {
      var cerrar = function (guardarlo) {
        var t = buscar(editando);
        if (t && guardarlo && ed.value.trim() && ed.value.trim() !== t.texto) {
          t.texto = ed.value.trim();
          if (t.ext) t.pend = "edit";
          guardar();
          if (E.cfg.flow) empujar();
        }
        editando = null; pintar();
      };
      ed.addEventListener("blur", function () { cerrar(true); });
      ed.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); cerrar(true); }
        if (e.key === "Escape") { e.preventDefault(); cerrar(false); }
      });
    }

    var notas = document.getElementById("notas");
    var est = document.getElementById("est");
    if (notas) notas.addEventListener("input", function () {
      E.notas = notas.value;
      est.textContent = "Escribiendo…"; est.classList.add("ver");
      clearTimeout(tNotas);
      tNotas = setTimeout(function () {
        guardar(); est.textContent = "Guardado";
        setTimeout(function () { est.classList.remove("ver"); }, 1800);
      }, 600);
    });
  }

  function conectarRevision() {
    var cola = colaRevision();
    var t = cola[revIdx];
    app.querySelectorAll("[data-rev]").forEach(function (b) {
      b.addEventListener("click", function () {
        var a = b.dataset.rev;
        if (!t) return;
        if (a === "hecha") alternar(t.id);
        else if (a === "borrar") borrar(t.id);
        else if (a === "saltar") revIdx++;
        else { mover(t.id, a === "semana" ? "semana" : a); if (E.cfg.flow) empujar(); }
        if (a === "saltar") { pintar(); return; }
        guardar();
        if (!colaRevision().length) { E.cfg.revisionHecha = hoyISO(); guardar(); }
        pintar();
      });
    });
  }

  function conectarAjustes() {
    var flow = document.getElementById("cfg-flow");
    var lista = document.getElementById("cfg-lista");
    flow.addEventListener("change", function () { E.cfg.flow = flow.value.trim(); guardar(); pintarSync(); });
    lista.addEventListener("change", function () { E.cfg.lista = lista.value.trim(); guardar(); });
    document.getElementById("cfg-auto").addEventListener("change", function (e) { E.cfg.auto = e.target.checked; guardar(); });
    document.getElementById("cfg-dev").addEventListener("change", function (e) { E.cfg.devolver = e.target.checked; guardar(); });
    document.getElementById("probar").addEventListener("click", function () {
      E.cfg.flow = flow.value.trim(); E.cfg.lista = lista.value.trim(); guardar();
      sincronizar(true);
    });
    document.getElementById("cambiar-frase").addEventListener("click", async function () {
      await candado("crear");
      toast("Frase actualizada en este dispositivo.");
    });
    document.getElementById("cerrar-sesion").addEventListener("click", function () {
      localStorage.removeItem(LS_ABIERTO);
      toast("Lista. La próxima vez que abras el centro aquí, te la pedirá.");
    });
    document.getElementById("exp-ics").addEventListener("click", ics);
    document.getElementById("exp-json").addEventListener("click", function () {
      bajar("centro-" + hoyISO() + ".json", JSON.stringify(E, null, 2), "application/json");
    });
    var file = document.getElementById("file");
    document.getElementById("imp-json").addEventListener("click", function () { file.click(); });
    file.addEventListener("change", function () {
      var f = file.files && file.files[0];
      if (!f) return;
      var lector = new FileReader();
      lector.onload = function () {
        try {
          var d = JSON.parse(lector.result);
          if (!d || !Array.isArray(d.tareas)) throw new Error("formato");
          E = d; normalizar(); guardar(); pintar();
          toast("Restaurado: " + E.tareas.length + " tareas.");
        } catch (e) { toast("Ese archivo no es una copia válida."); }
      };
      lector.readAsText(f);
    });
  }
  function normalizar() {
    var base = vacio();
    E.cfg = Object.assign(base.cfg, E.cfg || {});
    E.meta = Object.assign(base.meta, E.meta || {});
    if (!Array.isArray(E.eventos)) E.eventos = [];
    if (typeof E.notas !== "string") E.notas = "";
  }

  /* ============ atajos de teclado (escritorio) ============ */
  document.addEventListener("keydown", function (e) {
    var enCampo = /^(INPUT|TEXTAREA)$/.test((e.target.tagName || "").toUpperCase());
    if (e.key === "/" && !enCampo) {
      e.preventDefault();
      vista = "hoy"; pintar();
      var i = document.getElementById("txt"); if (i) i.focus();
    }
    if (!enCampo && ["1", "2", "3", "4"].indexOf(e.key) >= 0 && vista === "hoy") {
      filtro = ORDEN_H[+e.key - 1]; nuevo.h = filtro; pintar();
    }
    if (!enCampo && e.key.toLowerCase() === "r") { vista = "revision"; revIdx = 0; pintar(); }
  });

  /* ============ arranque ============ */
  (async function arrancar() {
    await candadoRevisar();

    cargar();
    reubicar();
    /* accesos directos del icono instalado: #revision, #agenda */
    var atajo = (location.hash || "").replace("#", "");
    if (["agenda", "revision", "ajustes"].indexOf(atajo) >= 0) vista = atajo;
    pintar();

    if (E.cfg.flow && E.cfg.auto) {
      sincronizar(false);
      setInterval(function () { if (E.cfg.auto && E.cfg.flow) sincronizar(false); }, 10 * 60 * 1000);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState !== "visible" || !E.cfg.auto || !E.cfg.flow) return;
        var ultima = E.meta.ultimaSync ? Date.parse(E.meta.ultimaSync) : 0;
        if (Date.now() - ultima > 2 * 60 * 1000) sincronizar(false);
        else if (E.meta.ultimoDia !== hoyISO()) pintar();   // cambió el día: recolocar
      });
    }
    window.addEventListener("online", function () {
      if (E.cfg.flow && E.tareas.some(function (t) { return t.pend; })) sincronizar(false);
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () { /* sin conexión: da igual */ });
      });
    }
  })();
})();
</script>
</body>

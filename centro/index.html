<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horizonte · Centro de operaciones</title>
<meta name="description" content="Centro de operaciones personal: un solo horizonte para lo que tienes que hacer, alimentado automáticamente por Microsoft To Do, Planner, los correos marcados de Outlook y el calendario.">
<meta name="theme-color" content="#0F0E17">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Horizonte">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png" sizes="512x512" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink:      #0F0E17;
    --surf:     #1A1826;
    --surf2:    #232030;
    --line:     #2E2A3D;
    --text:     #EDEAF5;
    --muted:    #8B85A3;
    --faint:    #5A5470;

    /* perspectiva atmosférica: cerca = cálido, lejos = frío */
    --h-hoy:     #FFAE3B;
    --h-corto:   #7C9EFF;
    --h-mediano: #4FBFA8;
    --h-largo:   #6C7391;
    --vencido:   #FF6B5B;
    --ok:        #4FBFA8;

    --display: 'Bricolage Grotesque', system-ui, sans-serif;
    --body:    'Instrument Sans', system-ui, sans-serif;
    --mono:    'JetBrains Mono', ui-monospace, monospace;

    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  html, body { background: var(--ink); }
  body { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }

  #app {
    background: radial-gradient(120% 90% at 15% -10%, #1D1A2E 0%, var(--ink) 55%);
    color: var(--text);
    font-family: var(--body);
    min-height: 100vh;
    padding: 26px 26px calc(40px + var(--safe-b));
    max-width: 1180px;
    margin: 0 auto;
  }
  @media (max-width: 700px) {
    #app { padding: 18px 15px calc(96px + var(--safe-b)); }
  }

  button, input, textarea, select { font-family: inherit; color: inherit; }

  /* ---------- cabecera ---------- */
  .top { display: flex; justify-content: space-between; align-items: flex-start;
         gap: 20px; flex-wrap: wrap; margin-bottom: 20px; }
  .fecha { font-family: var(--mono); font-size: 11px; letter-spacing: .16em;
           text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .titulo { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 7vw, 56px);
            line-height: .92; letter-spacing: -.03em; }
  .titulo em { font-style: normal; color: var(--h-hoy); }

  .presion { text-align: right; border-left: 2px solid var(--line); padding-left: 16px;
             min-width: 150px; }
  .presion .n { font-family: var(--display); font-size: 40px; font-weight: 800;
                line-height: 1; letter-spacing: -.03em; }
  .presion .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
  .presion.alerta .n { color: var(--vencido); }
  .presion.calma .n  { color: var(--ok); }

  /* ---------- navegación ---------- */
  .nav { display: flex; gap: 4px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
  .nav button { background: 0; border: 0; cursor: pointer; color: var(--muted);
                font-size: 13px; font-weight: 500; padding: 9px 13px; border-radius: 8px 8px 0 0;
                border-bottom: 2px solid transparent; margin-bottom: -1px;
                display: flex; align-items: center; gap: 7px; }
  .nav button:hover { color: var(--text); background: var(--surf); }
  .nav button.on { color: var(--text); border-bottom-color: var(--h-hoy); }
  .nav .pip { font-family: var(--mono); font-size: 9.5px; background: var(--vencido);
              color: var(--ink); border-radius: 20px; padding: 1px 6px; font-weight: 500; }
  .nav .sync { margin-left: auto; font-family: var(--mono); font-size: 10px;
               letter-spacing: .06em; color: var(--faint); padding: 9px 4px 9px 13px;
               display: flex; align-items: center; gap: 7px; border: 0; background: 0;
               cursor: pointer; }
  .nav .sync:hover { color: var(--muted); background: 0; }
  .punto { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
  .punto.viva { background: var(--ok); }
  .punto.mala { background: var(--vencido); }
  .punto.trab { background: var(--h-hoy); }

  @media (max-width: 560px) {
    .top { gap: 12px; margin-bottom: 16px; }
    .presion { border-left: 0; border-top: 1px solid var(--line); padding: 10px 0 0;
               text-align: left; min-width: 0; width: 100%;
               display: flex; align-items: baseline; gap: 10px; }
    .presion .n { font-size: 30px; }
    .presion .lbl { margin-top: 0; }
  }
  @media (max-width: 700px) {
    .nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; margin: 0;
           background: rgba(20,18,32,.94); backdrop-filter: blur(14px);
           border-top: 1px solid var(--line); border-bottom: 0;
           padding: 6px 4px calc(6px + var(--safe-b)); justify-content: space-around; }
    .nav button { flex-direction: column; gap: 3px; font-size: 10.5px; padding: 7px 6px;
                  border-radius: 10px; border-bottom: 0; margin: 0; flex: 1; }
    .nav button.on { background: var(--surf2); color: var(--h-hoy); }
    .nav .sync { display: none; }
    .nav svg { width: 19px; height: 19px; }
  }
  .nav svg { width: 15px; height: 15px; flex: none; }

  /* ---------- banda de horizonte ---------- */
  .banda { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px;
           margin-bottom: 22px; border-radius: 10px; overflow: hidden; }
  .zona { background: var(--surf); border: 0; border-top: 3px solid var(--z);
          padding: 13px 12px 15px; text-align: left; cursor: pointer;
          color: var(--muted); transition: background .18s ease, color .18s ease; }
  .zona:hover { background: var(--surf2); }
  .zona:focus-visible { outline: 2px solid var(--h-hoy); outline-offset: -2px; }
  .zona.on { background: var(--surf2); color: var(--text); }
  .zona .z-n { font-family: var(--mono); font-size: 21px; color: var(--z); line-height: 1; }
  .zona .z-t { font-size: 10.5px; letter-spacing: .13em; text-transform: uppercase; margin-top: 7px; }
  .zona .z-s { font-size: 10px; color: var(--faint); margin-top: 2px; }
  @media (max-width: 480px) {
    .zona { padding: 10px 9px 12px; }
    .zona .z-n { font-size: 18px; }
    .zona .z-t { font-size: 9.5px; letter-spacing: .08em; }
    .zona .z-s { display: none; }
  }

  /* ---------- rejilla ---------- */
  .rejilla { display: grid; grid-template-columns: 1.5fr 1fr; gap: 26px; align-items: start; }
  @media (max-width: 860px) { .rejilla { grid-template-columns: 1fr; gap: 22px; } }

  .rotulo { font-family: var(--mono); font-size: 10px; letter-spacing: .18em;
            text-transform: uppercase; color: var(--faint);
            border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 14px;
            display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .rotulo b { color: var(--muted); font-weight: 500; }

  /* ---------- tareas ---------- */
  .tarea { display: flex; align-items: flex-start; gap: 12px; padding: 11px 12px;
           border-radius: 9px; margin-bottom: 3px; transition: background .15s ease; }
  .tarea:hover { background: var(--surf); }
  .tarea:hover .acc { opacity: 1; }
  .tarea.vence { background: color-mix(in srgb, var(--vencido) 7%, transparent); }

  .caja { flex: none; width: 19px; height: 19px; margin-top: 1px; border-radius: 6px;
          border: 1.5px solid var(--c); background: transparent; cursor: pointer;
          display: grid; place-items: center; transition: all .16s ease; padding: 0; }
  .caja:hover { background: color-mix(in srgb, var(--c) 22%, transparent); }
  .caja:focus-visible { outline: 2px solid var(--h-hoy); outline-offset: 2px; }
  .caja svg { width: 11px; height: 11px; opacity: 0; transform: scale(.4);
              transition: all .2s cubic-bezier(.3,1.6,.5,1); }
  .hecha .caja { background: var(--c); border-color: var(--c); }
  .hecha .caja svg { opacity: 1; transform: scale(1); }

  .cuerpo { flex: 1; min-width: 0; }
  .txt { font-size: 14.5px; line-height: 1.4; word-break: break-word; cursor: text; }
  .hecha .txt { color: var(--faint); text-decoration: line-through; text-decoration-color: var(--line); }
  .txt input { width: 100%; background: var(--surf2); border: 1px solid var(--line);
               border-radius: 7px; padding: 6px 8px; font-size: 14.5px; outline: 0; }
  .meta { display: flex; gap: 8px; align-items: center; margin-top: 5px; flex-wrap: wrap; }
  .etq { font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em;
         text-transform: uppercase; color: var(--muted);
         border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px;
         display: inline-flex; align-items: center; gap: 5px; text-decoration: none; }
  a.etq:hover { border-color: var(--muted); color: var(--text); }
  .etq .pt { width: 5px; height: 5px; border-radius: 50%; background: var(--f); }
  .cuando { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .cuando.tarde { color: var(--vencido); }
  .rep { font-family: var(--mono); font-size: 10px; color: var(--faint); }

  .acc { flex: none; display: flex; gap: 2px; opacity: 0; transition: opacity .15s ease; }
  @media (hover: none) { .acc { opacity: .55; } }
  .acc button { background: 0; border: 0; color: var(--faint); cursor: pointer;
                font-size: 15px; line-height: 1; padding: 4px 5px; border-radius: 6px; }
  .acc button:hover { color: var(--text); background: var(--surf2); }
  .acc button.del:hover { color: var(--vencido); }
  .acc button:focus-visible { opacity: 1; outline: 1px solid var(--muted); }

  .vacio { color: var(--faint); font-size: 13.5px; padding: 18px 12px; line-height: 1.55; }

  /* ---------- agregar ---------- */
  .agregar { margin-top: 14px; background: var(--surf); border: 1px solid var(--line);
             border-radius: 11px; padding: 12px; }
  .agregar.foco { border-color: var(--h-hoy); }
  .agregar input[type=text] { width: 100%; background: 0; border: 0; color: var(--text);
             font-size: 15px; padding: 4px 2px 8px; }
  .agregar input::placeholder { color: var(--faint); }
  .agregar input:focus { outline: 0; }
  .lectura { font-family: var(--mono); font-size: 10.5px; color: var(--h-hoy);
             padding: 0 2px 8px; min-height: 0; }
  .fila { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  .chip { font-family: var(--mono); font-size: 10px; letter-spacing: .08em;
          text-transform: uppercase; background: 0; color: var(--muted);
          border: 1px solid var(--line); border-radius: 20px; padding: 5px 11px;
          cursor: pointer; transition: all .15s ease; }
  .chip:hover { border-color: var(--muted); color: var(--text); }
  .chip.on { background: var(--c); border-color: var(--c); color: var(--ink); font-weight: 500; }
  .chip:focus-visible { outline: 2px solid var(--h-hoy); outline-offset: 1px; }

  .enviar { margin-left: auto; background: var(--text); color: var(--ink); border: 0;
            border-radius: 20px; padding: 7px 18px; font-size: 12.5px; font-weight: 600;
            cursor: pointer; }
  .enviar:disabled { opacity: .28; cursor: default; }

  input[type=date], input[type=time] { background: 0; border: 1px solid var(--line);
    border-radius: 20px; color: var(--muted); font-family: var(--mono); font-size: 10.5px;
    padding: 5px 9px; }

  /* ---------- avisos ---------- */
  .aviso { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
           background: color-mix(in srgb, var(--vencido) 11%, var(--surf));
           border: 1px solid color-mix(in srgb, var(--vencido) 34%, transparent);
           border-radius: 11px; padding: 12px 14px; margin-bottom: 18px; }
  .aviso.suave { background: var(--surf); border-color: var(--line); }
  .aviso .a-t { font-size: 13.5px; flex: 1; min-width: 180px; line-height: 1.4; }
  .aviso b { color: var(--vencido); }
  .aviso.suave b { color: var(--h-corto); }
  .btn { background: var(--text); color: var(--ink); border: 0; border-radius: 20px;
         padding: 7px 15px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .btn:hover { filter: brightness(1.08); }
  .btn.linea { background: 0; border: 1px solid var(--line); color: var(--muted); }
  .btn.linea:hover { color: var(--text); border-color: var(--muted); filter: none; }
  .btn:disabled { opacity: .4; cursor: default; }

  /* ---------- agenda ---------- */
  .dia { margin-bottom: 26px; }
  .dia-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .dia-h .d { font-family: var(--display); font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .dia-h .s { font-family: var(--mono); font-size: 10.5px; color: var(--faint);
              text-transform: uppercase; letter-spacing: .12em; }
  .ev { display: flex; gap: 14px; padding: 10px 12px; border-radius: 9px;
        border-left: 2px solid var(--c); background: var(--surf); margin-bottom: 3px; }
  .ev .h { font-family: var(--mono); font-size: 11.5px; color: var(--muted); flex: none;
           width: 52px; line-height: 1.5; }
  .ev .t { font-size: 14px; line-height: 1.4; }
  .ev .l { font-size: 11.5px; color: var(--faint); margin-top: 3px; }
  .ahora { height: 1px; background: var(--h-hoy); position: relative; margin: 6px 0; }
  .ahora::after { content: "ahora"; position: absolute; right: 0; top: -14px;
                  font-family: var(--mono); font-size: 9px; color: var(--h-hoy);
                  letter-spacing: .1em; text-transform: uppercase; }

  /* ---------- revisión ---------- */
  .rev { background: var(--surf); border: 1px solid var(--line); border-radius: 13px;
         padding: 16px 16px 14px; margin-bottom: 10px; }
  .rev .q { font-size: 15px; line-height: 1.4; margin-bottom: 4px; }
  .rev .m { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-bottom: 12px; }
  .rev .opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .rev .opts button { background: 0; border: 1px solid var(--line); color: var(--muted);
                      border-radius: 20px; padding: 7px 13px; font-size: 12px; cursor: pointer; }
  .rev .opts button:hover { border-color: var(--c, var(--muted)); color: var(--text);
                            background: var(--surf2); }
  .paso { font-family: var(--mono); font-size: 10px; color: var(--faint);
          letter-spacing: .14em; text-transform: uppercase; margin-bottom: 12px; }
  .fin { text-align: center; padding: 46px 20px; }
  .fin .g { font-family: var(--display); font-size: 30px; font-weight: 800;
            letter-spacing: -.03em; margin-bottom: 8px; }
  .fin .p { color: var(--muted); font-size: 14px; line-height: 1.55; max-width: 380px;
            margin: 0 auto; }

  /* ---------- notas / ajustes ---------- */
  .notas { width: 100%; min-height: 130px; background: var(--surf);
           border: 1px solid var(--line); border-radius: 11px; padding: 14px;
           color: var(--text); font-size: 13.5px; line-height: 1.62; resize: vertical; }
  .notas:focus { outline: 0; border-color: var(--h-corto); }
  .notas::placeholder { color: var(--faint); }
  .guardado { font-family: var(--mono); font-size: 9.5px; color: var(--faint);
              text-transform: uppercase; letter-spacing: .1em; }
  .bloque { margin-top: 28px; }

  .campo { margin-bottom: 16px; }
  .campo label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .campo input[type=text], .campo input[type=url], .campo textarea {
    width: 100%; background: var(--surf); border: 1px solid var(--line); border-radius: 9px;
    padding: 10px 12px; font-size: 13px; font-family: var(--mono); }
  .campo input:focus, .campo textarea:focus { outline: 0; border-color: var(--h-corto); }
  .campo .ayuda { font-size: 11.5px; color: var(--faint); margin-top: 6px; line-height: 1.5; }
  .switch { display: flex; align-items: flex-start; gap: 11px; padding: 11px 0;
            border-bottom: 1px solid var(--line); cursor: pointer; }
  .switch:last-child { border-bottom: 0; }
  .switch input { margin-top: 3px; accent-color: var(--h-hoy); width: 16px; height: 16px; flex: none; }
  .switch .s-t { font-size: 13.5px; }
  .switch .s-d { font-size: 11.5px; color: var(--faint); margin-top: 2px; line-height: 1.5; }
  .caja-info { background: var(--surf); border: 1px solid var(--line); border-radius: 11px;
               padding: 14px 16px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .caja-info code { font-family: var(--mono); font-size: 11.5px; color: var(--h-corto);
                    background: var(--ink); padding: 1px 5px; border-radius: 4px; }
  .caja-info b { color: var(--text); font-weight: 600; }
  .prosa { font-size: 13px; color: var(--muted); line-height: 1.65; }
  .prosa b { color: var(--text); font-weight: 600; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%);
           bottom: calc(24px + var(--safe-b)); background: var(--surf2);
           border: 1px solid var(--line); color: var(--text); font-size: 13px;
           padding: 11px 18px; border-radius: 26px; z-index: 90; opacity: 0;
           transition: opacity .2s ease, transform .2s ease; pointer-events: none;
           box-shadow: 0 10px 40px rgba(0,0,0,.5); max-width: 90vw; text-align: center; }
  .toast.ver { opacity: 1; transform: translateX(-50%) translateY(-6px); }
  @media (max-width: 700px) { .toast { bottom: calc(84px + var(--safe-b)); } }

  .cargando { color: var(--faint); font-family: var(--mono); font-size: 12px; padding: 60px 0;
              text-align: center; letter-spacing: .1em; }

  /* ---------- pantalla de acceso ---------- */
  .candado { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center;
             justify-content: center; padding: 24px; color: var(--text); font-family: var(--body);
             background: radial-gradient(120% 90% at 15% -10%, #1D1A2E 0%, var(--ink) 55%); }
  .candado .tarjeta { background: var(--surf); border: 1px solid var(--line); border-radius: 16px;
                   padding: 30px 28px 26px; max-width: 380px; width: 100%;
                   box-shadow: 0 24px 70px rgba(0,0,0,.55); }
  .candado .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--h-hoy);
                  color: var(--ink); display: flex; align-items: center; justify-content: center;
                  font-size: 19px; margin-bottom: 14px; }
  .candado h1 { font-family: var(--display); font-weight: 800; font-size: 21px;
                letter-spacing: -.02em; margin-bottom: 7px; }
  .candado p { color: var(--muted); font-size: 13px; line-height: 1.55; margin-bottom: 16px; }
  .candado input[type=password] { width: 100%; box-sizing: border-box; background: var(--ink);
        border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 13px;
        color: var(--text); font-size: 15px; outline: 0; }
  .candado input[type=password]:focus { border-color: var(--h-hoy); }
  .candado input + input { margin-top: 9px; }
  .candado .err { background: color-mix(in srgb, var(--vencido) 16%, var(--surf));
                  color: var(--vencido); border-radius: 9px; padding: 8px 11px;
                  font-size: 12.5px; margin-bottom: 12px; line-height: 1.4; }
  .candado button.entrar { all: unset; box-sizing: border-box; cursor: pointer; display: block;
        text-align: center; width: 100%; margin-top: 14px; padding: 12px;
        background: var(--text); color: var(--ink); border-radius: 10px;
        font-weight: 600; font-size: 14.5px; }
  .candado .olvide { display: block; text-align: center; margin: 14px auto 0; background: 0;
                     border: 0; color: var(--faint); font-size: 11.5px; text-decoration: underline;
                     cursor: pointer; padding: 4px; }
  .candado .olvide:hover { color: var(--muted); }

  @keyframes pulso { 0%,100% { opacity: 1; } 50% { opacity: .42; } }
  .pulsa { animation: pulso 2.4s ease-in-out infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }
  .gira { animation: gira 1s linear infinite; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"><div class="cargando">cargando…</div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   HORIZONTE · Centro de operaciones personal
   ---------------------------------------------------------------------
   Una sola página, sin servidor propio y sin librerías externas.
   - Lo que escribes vive en este navegador (localStorage).
   - Lo del trabajo (To Do, Planner, correos marcados, calendario) entra
     por un flujo de Power Automate tuyo: el navegador le habla directo.
     La URL del flujo se guarda SOLO aquí, nunca en el repositorio, así
     que nada personal se publica en GitHub Pages.
   - Lo que creas aquí puede devolverse a Microsoft To Do, para que la
     notificación suene donde ya suena (celular, Outlook, reloj).
   ===================================================================== */
(function () {
  "use strict";

  var LS      = "centro:estado:v1";
  var VERSION = 1;

  var HORIZONTES = {
    hoy:     { t: "Hoy",     s: "ahora mismo", c: "var(--h-hoy)",     max: 0 },
    corto:   { t: "Corto",   s: "esta semana", c: "var(--h-corto)",   max: 7 },
    mediano: { t: "Mediano", s: "este mes",    c: "var(--h-mediano)", max: 31 },
    largo:   { t: "Largo",   s: "algún día",   c: "var(--h-largo)",   max: Infinity }
  };
  var ORDEN_H = ["hoy", "corto", "mediano", "largo"];

  /* Fuentes: las tres primeras las escribes tú; las otras llegan solas. */
  var FUENTES = {
    personal: { t: "personal", c: "#B79CFF", mia: true },
    trabajo:  { t: "trabajo",  c: "#FFAE3B", mia: true },
    curso:    { t: "curso",    c: "#4FBFA8", mia: true },
    todo:     { t: "to do",    c: "#7C9EFF" },
    planner:  { t: "planner",  c: "#4FBFA8" },
    correo:   { t: "correo",   c: "#FF8FA3" },
    agenda:   { t: "agenda",   c: "#C0A0FF" }
  };

  var E = null;          // estado
  var vista = "horizonte";
  var filtro = "hoy";
  var nuevo = { h: "hoy", f: "personal", fecha: "", hora: "" };
  var editando = null;   // id de la tarea en edición
  var revIdx = 0;        // paso de la revisión
  var sync = { estado: "idle", msg: "", ts: null };
  var tNotas = null, tToast = null, tSync = null;

  var app = document.getElementById("app");
  var elToast = document.getElementById("toast");

  /* ============ pantalla de acceso ============
     El repositorio es público (GitHub Pages gratis no permite sitios
     privados), pero tus tareas nunca viajan ahí: viven solo en este
     localStorage. Esta pantalla es una cortina contra quien encuentre el
     link por casualidad, no una caja fuerte — cada dispositivo elige su
     propia frase la primera vez y la recuerda después. */
  var LS_LLAVE = "centro:llave";
  var LS_ABIERTO = "centro:desbloqueado";

  async function sha256(texto) {
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texto));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }

  function candado(modo, mensaje) {
    return new Promise(function (resolve) {
      var primera = modo === "crear";
      var wrap = document.createElement("div");
      wrap.className = "candado";
      wrap.innerHTML =
        '<div class="tarjeta">' +
          '<div class="ico">🔒</div>' +
          '<h1>' + (primera ? "Crea tu frase de acceso" : "Acceso protegido") + '</h1>' +
          '<p>' + (primera
            ? "Esta app es tuya. Elige una frase que puedas recordar: te la pedirá cada vez que entres desde un dispositivo nuevo."
            : "Ingresa tu frase de acceso para entrar.") + '</p>' +
          (mensaje ? '<div class="err">' + esc(mensaje) + '</div>' : "") +
          '<form>' +
            '<input type="password" id="frase" autocomplete="current-password" placeholder="Frase de acceso">' +
            (primera ? '<input type="password" id="frase2" autocomplete="new-password" placeholder="Repite la frase">' : "") +
            '<button type="submit" class="entrar">Entrar</button>' +
          '</form>' +
          (!primera ? '<button class="olvide" id="olvide" type="button">¿Olvidaste tu frase de este dispositivo?</button>' : "") +
        '</div>';
      document.body.appendChild(wrap);
      var form = wrap.querySelector("form");
      var f1 = wrap.querySelector("#frase");
      f1.focus();
      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        var v = f1.value;
        if (!v.trim()) return;
        if (primera) {
          var v2 = wrap.querySelector("#frase2").value;
          if (v !== v2) { wrap.remove(); resolve(await candado("crear", "Las frases no coinciden. Intenta de nuevo.")); return; }
          localStorage.setItem(LS_LLAVE, await sha256(v));
          localStorage.setItem(LS_ABIERTO, "1");
          wrap.remove(); resolve(true);
        } else {
          if (await sha256(v) === localStorage.getItem(LS_LLAVE)) {
            localStorage.setItem(LS_ABIERTO, "1");
            wrap.remove(); resolve(true);
          } else {
            wrap.remove(); resolve(await candado("entrar", "Frase incorrecta. Inténtalo de nuevo."));
          }
        }
      });
      var olv = wrap.querySelector("#olvide");
      if (olv) olv.addEventListener("click", async function () {
        if (confirm("Esto borra lo guardado en este dispositivo (tareas y notas) y te deja crear una frase nueva. ¿Continuar?")) {
          localStorage.removeItem(LS); localStorage.removeItem(LS_LLAVE); localStorage.removeItem(LS_ABIERTO);
          wrap.remove(); resolve(await candado("crear"));
        }
      });
    });
  }

  function candadoRevisar() {
    if (localStorage.getItem(LS_ABIERTO) === "1" && localStorage.getItem(LS_LLAVE)) return Promise.resolve(true);
    return candado(localStorage.getItem(LS_LLAVE) ? "entrar" : "crear");
  }

  /* ============ utilidades ============ */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function pad(n) { return String(n).padStart(2, "0"); }
  function isoDe(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function hoyISO() { return isoDe(new Date()); }
  function mas(iso, n) { var d = new Date((iso || hoyISO()) + "T00:00:00"); d.setDate(d.getDate() + n); return isoDe(d); }
  function dias(iso) {
    if (!iso) return null;
    return Math.round((new Date(iso + "T00:00:00") - new Date(hoyISO() + "T00:00:00")) / 864e5);
  }
  function toast(msg) {
    elToast.textContent = msg;
    elToast.classList.add("ver");
    clearTimeout(tToast);
    tToast = setTimeout(function () { elToast.classList.remove("ver"); }, 2600);
  }
  var MESES_L = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  var MESES_C = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  var DIAS_L  = ["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];

  function fechaTexto(iso, hora) {
    if (!iso) return null;
    var d = dias(iso), txt;
    if (d < 0)       txt = d === -1 ? "ayer" : "hace " + (-d) + " días";
    else if (d === 0) txt = "hoy";
    else if (d === 1) txt = "mañana";
    else if (d < 7)   txt = DIAS_L[new Date(iso + "T00:00:00").getDay()];
    else if (d < 32)  txt = "en " + d + " días";
    else {
      var f = new Date(iso + "T00:00:00");
      txt = f.getDate() + " " + MESES_C[f.getMonth()];
    }
    return { txt: txt + (hora ? " · " + hora : ""), tarde: d < 0 };
  }
  function diaLargo(iso) {
    var f = new Date(iso + "T00:00:00");
    return DIAS_L[f.getDay()] + " " + f.getDate() + " de " + MESES_L[f.getMonth()];
  }

  /* El horizonte que le toca a una fecha. Es la regla que hace que nada
     se quede escondido: si la fecha se acerca, la tarea se acerca. */
  function horizonteDe(iso) {
    var d = dias(iso);
    if (d === null) return null;
    if (d <= 0) return "hoy";
    if (d <= 7) return "corto";
    if (d <= 31) return "mediano";
    return "largo";
  }

  /* ============ persistencia ============ */
  function vacio() {
    return {
      v: VERSION, tareas: [], eventos: [], notas: "",
      cfg: { flow: "", auto: true, devolver: true, lista: "", revisionHecha: null },
      meta: { ultimaSync: null, ultimoDia: hoyISO() }
    };
  }
  function cargar() {
    try {
      var crudo = localStorage.getItem(LS);
      E = crudo ? JSON.parse(crudo) : vacio();
    } catch (e) { E = vacio(); }
    var base = vacio();
    if (!E || typeof E !== "object") E = base;
    if (!Array.isArray(E.tareas)) E.tareas = [];
    if (!Array.isArray(E.eventos)) E.eventos = [];
    if (typeof E.notas !== "string") E.notas = "";
    E.cfg = Object.assign(base.cfg, E.cfg || {});
    E.meta = Object.assign(base.meta, E.meta || {});
  }
  function guardar() {
    try { localStorage.setItem(LS, JSON.stringify(E)); }
    catch (e) { toast("No se pudo guardar en este navegador."); }
  }

  /* ============ lectura de lenguaje natural ============ */
  /* "llamar a Ana mañana 9am" → texto + fecha + hora, sin formularios. */
  var DIA_NUM = { domingo:0, lunes:1, martes:2, "miercoles":3, "miércoles":3, jueves:4, viernes:5, "sabado":6, "sábado":6 };
  var MES_NUM = { ene:0, enero:0, feb:1, febrero:1, mar:2, marzo:2, abr:3, abril:3, may:4, mayo:4,
                  jun:5, junio:5, jul:6, julio:6, ago:7, agosto:7, sep:8, sept:8, septiembre:8,
                  oct:9, octubre:9, nov:10, noviembre:10, dic:11, diciembre:11 };

  function leer(entrada) {
    var t = " " + entrada + " ";
    var r = { texto: entrada, fecha: null, hora: null, repetir: null, fuente: null, importante: false };
    function quita(re) {
      var m = t.match(re);
      if (m) t = t.replace(m[0], " ");
      return m;
    }
    var m;

    /* repetición */
    m = quita(/\bcada\s+(d[ií]a|semana|mes|a[nñ]o|lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)\b/i);
    if (m) {
      var p = m[1].toLowerCase();
      if (/^d/.test(p)) r.repetir = "dia";
      else if (/^s/.test(p) && /semana/.test(p)) r.repetir = "semana";
      else if (/^m/.test(p) && /mes/.test(p)) r.repetir = "mes";
      else if (/^a/.test(p)) r.repetir = "anio";
      else { r.repetir = "semana"; r.fecha = proximoDia(DIA_NUM[p.normalize("NFC")]); }
    }

    /* fuente por etiqueta:  #trabajo  #personal  #curso */
    m = quita(/#(personal|trabajo|curso)\b/i);
    if (m) r.fuente = m[1].toLowerCase();

    /* importante */
    m = quita(/(^|\s)!(\s|$)/);
    if (m) r.importante = true;

    /* fechas relativas */
    if (!r.fecha) {
      if (quita(/\bpasado\s+ma[nñ]ana\b/i)) r.fecha = mas(hoyISO(), 2);
      else if (quita(/\bma[nñ]ana\b/i)) r.fecha = mas(hoyISO(), 1);
      else if (quita(/\bhoy\b/i)) r.fecha = hoyISO();
      else if ((m = quita(/\ben\s+(\d{1,3})\s*(d[ií]as?|semanas?|meses?)\b/i))) {
        var n = parseInt(m[1], 10), u = m[2].toLowerCase();
        r.fecha = /^s/.test(u) ? mas(hoyISO(), n * 7) : /^m/.test(u) ? mas(hoyISO(), n * 30) : mas(hoyISO(), n);
      }
      else if ((m = quita(/\b(?:el\s+|este\s+|pr[oó]ximo\s+|la\s+pr[oó]xima\s+)?(lunes|martes|mi[eé]rcoles|miercoles|jueves|viernes|s[aá]bado|sabado|domingo)\b/i))) {
        r.fecha = proximoDia(DIA_NUM[m[1].toLowerCase()]);
      }
      else if ((m = quita(/\b(?:el\s+)?(\d{1,2})\s*(?:de\s+)?(ene|enero|feb|febrero|mar|marzo|abr|abril|may|mayo|jun|junio|jul|julio|ago|agosto|sep|sept|septiembre|oct|octubre|nov|noviembre|dic|diciembre)\b/i))) {
        r.fecha = enMes(parseInt(m[1], 10), MES_NUM[m[2].toLowerCase()]);
      }
      else if ((m = quita(/\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/))) {
        var anio = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : null;
        r.fecha = anio ? anio + "-" + pad(+m[2]) + "-" + pad(+m[1]) : enMes(+m[1], +m[2] - 1);
      }
      else if (quita(/\bfin\s+de\s+semana\b/i)) r.fecha = proximoDia(6);
    }

    /* hora: "9am", "14:30", "a las 9" */
    m = quita(/\b(?:a\s+las\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm|h)\b/i);
    if (!m) m = quita(/\b(?:a\s+las\s+)(\d{1,2})(?::(\d{2}))?\b/i);
    if (!m) m = quita(/\b(\d{1,2}):(\d{2})\b/);
    if (m) {
      var h = parseInt(m[1], 10), mi = m[2] ? parseInt(m[2], 10) : 0, suf = (m[3] || "").toLowerCase();
      if (suf === "pm" && h < 12) h += 12;
      if (suf === "am" && h === 12) h = 0;
      if (h >= 0 && h <= 23 && mi >= 0 && mi <= 59) r.hora = pad(h) + ":" + pad(mi);
    }

    r.texto = t.replace(/\s{2,}/g, " ").trim();
    if (!r.texto) r.texto = entrada.trim();   // no dejar la tarea sin nombre
    return r;
  }
  function proximoDia(dow) {
    var hoy = new Date(hoyISO() + "T00:00:00"), delta = (dow - hoy.getDay() + 7) % 7;
    return mas(hoyISO(), delta === 0 ? 7 : delta);
  }
  function enMes(d, mes) {
    var hoy = new Date(), anio = hoy.getFullYear();
    var iso = anio + "-" + pad(mes + 1) + "-" + pad(d);
    if (dias(iso) < 0) iso = (anio + 1) + "-" + pad(mes + 1) + "-" + pad(d);
    return iso;
  }
  function resumenLectura(r) {
    var p = [];
    if (r.fecha) p.push(fechaTexto(r.fecha, r.hora).txt);
    else if (r.hora) p.push(r.hora);
    if (r.repetir) p.push("cada " + { dia: "día", semana: "semana", mes: "mes", anio: "año" }[r.repetir]);
    if (r.fuente) p.push("#" + r.fuente);
    if (r.importante) p.push("importante");
    return p.length ? "→ " + p.join(" · ") : "";
  }

  /* ============ el motor: nada se queda escondido ============ */
  /* Cada vez que abres la app (y al cambiar de día) las tareas con fecha
     se mueven al horizonte que les toca. Una tarea con fecha de hoy no
     puede seguir durmiendo en "algún día". */
  function reubicar() {
    var cambios = 0;
    E.tareas.forEach(function (t) {
      if (t.hecha || !t.fecha) return;
      var h = horizonteDe(t.fecha);
      if (h && ORDEN_H.indexOf(h) < ORDEN_H.indexOf(t.horizonte)) { t.horizonte = h; cambios++; }
    });
    if (E.meta.ultimoDia !== hoyISO()) { E.meta.ultimoDia = hoyISO(); cambios++; }
    if (cambios) guardar();
  }
  function vencidas() {
    return E.tareas.filter(function (t) { return !t.hecha && t.fecha && dias(t.fecha) < 0; });
  }
  function pendientes(h) {
    return E.tareas.filter(function (t) { return !t.hecha && (!h || t.horizonte === h); });
  }
  function necesitaRevision() {
    return vencidas().length > 0 || (E.cfg.revisionHecha !== hoyISO() && pendientes("hoy").length > 0);
  }

  /* ============ acciones sobre tareas ============ */
  function crear(entrada) {
    var r = leer(entrada);
    var fecha = nuevo.fecha || r.fecha;
    var t = {
      id: uid(),
      texto: r.texto,
      fuente: r.fuente || nuevo.f,
      horizonte: fecha ? (horizonteDe(fecha) || nuevo.h) : nuevo.h,
      fecha: fecha || null,
      hora: nuevo.hora || r.hora || null,
      repetir: r.repetir || null,
      importante: r.importante,
      hecha: false,
      creada: new Date().toISOString(),
      ext: null,
      pend: null
    };
    if (E.cfg.devolver && E.cfg.flow) t.pend = "crear";   // se enviará a To Do
    E.tareas.unshift(t);
    nuevo.fecha = ""; nuevo.hora = "";
    filtro = t.horizonte;
    guardar();
    pintar();
    var i = document.getElementById("txt"); if (i) i.focus();
    if (t.pend) empujar();
  }
  function alternar(id) {
    var t = buscar(id);
    if (!t) return;
    t.hecha = !t.hecha;
    t.hechaEn = t.hecha ? new Date().toISOString() : null;
    if (t.hecha && t.repetir) reprogramar(t);
    if (t.ext || E.cfg.devolver) t.pend = t.pend === "crear" ? "crear" : "estado";
    guardar(); pintar();
    if (t.pend && E.cfg.flow) empujar();
  }
  function reprogramar(t) {
    /* una tarea repetida no se "termina": nace la siguiente */
    var base = t.fecha || hoyISO(), sig;
    if (t.repetir === "dia") sig = mas(base, 1);
    else if (t.repetir === "semana") sig = mas(base, 7);
    else if (t.repetir === "mes") { var d = new Date(base + "T00:00:00"); d.setMonth(d.getMonth() + 1); sig = isoDe(d); }
    else { var a = new Date(base + "T00:00:00"); a.setFullYear(a.getFullYear() + 1); sig = isoDe(a); }
    while (dias(sig) < 0) sig = t.repetir === "dia" ? mas(sig, 1) : mas(sig, 7);
    E.tareas.unshift({
      id: uid(), texto: t.texto, fuente: t.fuente, horizonte: horizonteDe(sig),
      fecha: sig, hora: t.hora, repetir: t.repetir, importante: t.importante,
      hecha: false, creada: new Date().toISOString(), ext: null,
      pend: (E.cfg.devolver && E.cfg.flow) ? "crear" : null
    });
  }
  function mover(id, destino) {
    var t = buscar(id); if (!t) return;
    if (destino === "hoy" || destino === "manana" || destino === "semana") {
      t.fecha = destino === "hoy" ? hoyISO() : destino === "manana" ? mas(hoyISO(), 1) : proximoDia(1);
      t.horizonte = horizonteDe(t.fecha);
      if (t.ext) t.pend = "fecha";
    } else {
      t.horizonte = destino;
      if (destino !== "hoy" && t.fecha && dias(t.fecha) <= 0) t.fecha = null;
    }
    guardar();
  }
  function borrar(id) {
    var t = buscar(id);
    E.tareas = E.tareas.filter(function (x) { return x.id !== id; });
    guardar(); pintar();
    if (t && t.ext) toast("Borrada de aquí. En " + (FUENTES[t.fuente] || {}).t + " sigue existiendo.");
  }
  function buscar(id) { return E.tareas.find(function (t) { return t.id === id; }); }

  /* ============ puente con Microsoft (Power Automate) ============ */
  /* Un solo flujo con disparador "Cuando se recibe una solicitud HTTP".
     Lee To Do + Planner + correos marcados + calendario y, de paso,
     aplica lo que hiciste aquí. El contrato está en CONECTAR.md. */
  function cambiosPendientes() {
    return E.tareas.filter(function (t) { return t.pend; }).map(function (t) {
      return {
        accion: t.pend === "crear" ? "crear" : t.pend === "fecha" ? "mover" : "completar",
        local: t.id,
        sys: t.ext ? t.ext.sys : null,
        id: t.ext ? t.ext.id : null,
        texto: t.texto,
        fecha: t.fecha,
        hora: t.hora,
        hecha: !!t.hecha,
        lista: E.cfg.lista || null
      };
    });
  }
  function empujar() { if (!tSync) tSync = setTimeout(function () { tSync = null; sincronizar(false); }, 1200); }

  function sincronizar(manual) {
    if (!E.cfg.flow) {
      if (manual) toast("Falta la URL del flujo. Ve a Ajustes.");
      return Promise.resolve(false);
    }
    if (sync.estado === "sync") return Promise.resolve(false);
    sync.estado = "sync"; pintarSync();
    var cuerpo = {
      op: "sync",
      cliente: "horizonte",
      version: VERSION,
      hoy: hoyISO(),
      agendaDesde: hoyISO(),
      agendaHasta: mas(hoyISO(), 8),
      cambios: cambiosPendientes()
    };
    return fetch(E.cfg.flow, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cuerpo)
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (d) {
      fusionar(d);
      sync.estado = "ok"; sync.ts = Date.now(); sync.msg = "";
      E.meta.ultimaSync = new Date().toISOString();
      guardar(); pintar();
      if (manual) toast("Al día con Microsoft.");
      return true;
    }).catch(function (e) {
      sync.estado = "error";
      sync.msg = (e && e.message) || "error";
      pintarSync();
      if (manual) toast("No se pudo sincronizar (" + sync.msg + "). Lo tuyo sigue guardado aquí.");
      return false;
    });
  }

  function fusionar(d) {
    if (!d || typeof d !== "object") return;

    /* 1. confirmaciones de lo que empujamos */
    (d.creadas || []).forEach(function (c) {
      var t = buscar(c.local);
      if (t) { t.ext = { sys: c.sys || "todo", id: c.id, url: c.url || null, lista: c.lista || null }; t.pend = null; }
    });
    (d.aplicados || []).forEach(function (id) {
      var t = buscar(id); if (t) t.pend = null;
    });
    /* si el flujo no devuelve "aplicados", damos por buenos los cambios enviados */
    if (!d.aplicados) E.tareas.forEach(function (t) { if (t.pend && t.pend !== "crear") t.pend = null; });

    /* 2. tareas que llegan de Microsoft */
    var remotas = Array.isArray(d.tareas) ? d.tareas : [];
    var sistemas = {};
    remotas.forEach(function (t) { sistemas[t.sys || "todo"] = true; });
    var indice = {};
    E.tareas.forEach(function (t) { if (t.ext) indice[t.ext.sys + ":" + t.ext.id] = t; });
    var vistos = {};

    remotas.forEach(function (rt) {
      var sys = rt.sys || "todo";
      var clave = sys + ":" + rt.id;
      vistos[clave] = true;
      var local = indice[clave];
      var fuente = FUENTES[sys] ? sys : "trabajo";
      if (!local) {
        var h = horizonteDe(rt.fecha) || "corto";   // sin fecha → esta semana, no invade el Hoy
        E.tareas.push({
          id: uid(), texto: rt.texto || "(sin título)", fuente: fuente,
          horizonte: h, fecha: rt.fecha || null, hora: rt.hora || null,
          repetir: null, importante: !!rt.importante, hecha: !!rt.hecha,
          creada: rt.creada || new Date().toISOString(),
          ext: { sys: sys, id: rt.id, url: rt.url || null, lista: rt.lista || null },
          pend: null
        });
      } else if (!local.pend) {
        /* la fuente manda en el texto, la fecha y el estado; el horizonte es tuyo */
        local.texto = rt.texto || local.texto;
        local.importante = !!rt.importante;
        if (local.ext) { local.ext.url = rt.url || local.ext.url; local.ext.lista = rt.lista || local.ext.lista; }
        if ((rt.fecha || null) !== local.fecha) {
          local.fecha = rt.fecha || null;
          var nh = horizonteDe(local.fecha);
          if (nh && ORDEN_H.indexOf(nh) < ORDEN_H.indexOf(local.horizonte)) local.horizonte = nh;
        }
        if (!!rt.hecha !== !!local.hecha) {
          local.hecha = !!rt.hecha;
          local.hechaEn = local.hecha ? new Date().toISOString() : null;
        }
      }
    });

    /* 3. lo que desapareció en el origen (borrado allá) se va de aquí */
    E.tareas = E.tareas.filter(function (t) {
      if (!t.ext || t.pend) return true;
      if (!sistemas[t.ext.sys]) return true;              // esa fuente no vino en esta sync
      return !!vistos[t.ext.sys + ":" + t.ext.id];
    });

    /* 4. agenda (solo lectura, se reemplaza entera) */
    if (Array.isArray(d.eventos)) {
      E.eventos = d.eventos.map(function (ev) {
        return {
          id: ev.id || uid(), titulo: ev.titulo || "(sin título)",
          inicio: ev.inicio || null, fin: ev.fin || null,
          lugar: ev.lugar || "", url: ev.url || null, todoElDia: !!ev.todoElDia
        };
      }).filter(function (ev) { return ev.inicio; })
        .sort(function (a, b) { return a.inicio < b.inicio ? -1 : 1; });
    }
    reubicar();
  }

  /* ============ exportar ============ */
  function bajar(nombre, contenido, tipo) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([contenido], { type: tipo || "text/plain;charset=utf-8" }));
    a.download = nombre;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }
  function ics() {
    /* para llevarte los pendientes con fecha a Recordatorios o al calendario */
    var L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Horizonte//Centro de operaciones//ES", "CALSCALE:GREGORIAN"];
    var sello = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
    pendientes().filter(function (t) { return t.fecha; }).forEach(function (t) {
      var f = t.fecha.replace(/-/g, "");
      L.push("BEGIN:VTODO", "UID:" + t.id + "@horizonte", "DTSTAMP:" + sello,
             "SUMMARY:" + String(t.texto).replace(/[\r\n,;]/g, " "),
             t.hora ? "DUE:" + f + "T" + t.hora.replace(":", "") + "00" : "DUE;VALUE=DATE:" + f,
             "CATEGORIES:" + (FUENTES[t.fuente] || {}).t, "END:VTODO");
    });
    L.push("END:VCALENDAR");
    bajar("horizonte.ics", L.join("\r\n"), "text/calendar;charset=utf-8");
  }

        '<button class="btn linea" id="cerrar-sesion">Pedirla de nuevo la próxima vez</button>' +
      '</div>' +
      '<div class="ayuda" style="font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.5">' +
      'Cada dispositivo tiene su propia frase — no hace falta que sea igual en el celular y en la compu.</div></div>' +
      '</section>' +

      '<aside>' +
        '<div class="rotulo"><span>Qué entra y qué no</span></div>' +
        '<div class="caja-info">' +
          '<b>Entran solas:</b> tus listas de <b>To Do</b>, las tareas de <b>Planner</b> asignadas a ti, ' +
          'los <b>correos marcados</b> de Outlook y las reuniones del <b>calendario</b>.<br><br>' +
          'Ojo: To Do te <i>muestra</i> Planner en «Asignadas a mí», pero no lo entrega por API — ' +
          'por eso el flujo lee Planner aparte. El calendario nunca está en To Do.<br><br>' +
          '<b>No entra nada de contratos.</b> Este centro es personal y no toca la base del CRM ni el CLM.' +
        '</div>' +
        '<div class="bloque"><div class="rotulo"><span>Privacidad</span></div>' +
        '<div class="caja-info">La página es pública, <b>tus tareas no</b>. Nunca se publican en GitHub: ' +
        'viven en este navegador y viajan directo entre tu dispositivo y tu flujo de Power Automate.<br><br>' +
        'Si usas una computadora compartida, borra los datos con «Restaurar» sobre una copia vacía.</div></div>' +
        '<div class="bloque"><div class="rotulo"><span>Instalar</span></div>' +
        '<div class="caja-info">En el celular: <b>Compartir → Añadir a pantalla de inicio</b>. ' +
        'En el escritorio: el icono de instalar de la barra de direcciones. ' +
        'Queda como una app y funciona sin internet (lo que no se pueda enviar, se envía después).</div></div>' +
      '</aside></div>';
  }

  /* ============ eventos ============ */
  function conectar() {
    /* navegación */
    app.querySelectorAll("[data-tab]").forEach(function (b) {
      b.addEventListener("click", function () {
        vista = b.dataset.tab; revIdx = 0; pintar();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
    var sb = document.getElementById("sync-btn");
    if (sb) sb.addEventListener("click", function () {
      if (!E.cfg.flow) { vista = "ajustes"; pintar(); } else sincronizar(true);
    });

    if (vista === "horizonte") conectarHorizonte();
    if (vista === "revision") conectarRevision();
    if (vista === "ajustes") conectarAjustes();
  }

  function conectarHorizonte() {
    var txt = document.getElementById("txt");
    var fch = document.getElementById("fch");
    var add = document.getElementById("add");
    var lec = document.getElementById("lectura");
    var caja = document.getElementById("caja-agregar");

    function revisar() {
      var v = txt.value.trim();
      add.disabled = !v;
      lec.textContent = v ? resumenLectura(leer(v)) : "";
    }
    txt.addEventListener("input", revisar);
    txt.addEventListener("focus", function () { caja.classList.add("foco"); });
    txt.addEventListener("blur", function () { caja.classList.remove("foco"); });
    txt.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && txt.value.trim()) crear(txt.value);
    });
    add.addEventListener("click", function () { if (txt.value.trim()) crear(txt.value); });
    fch.addEventListener("change", function (e) { nuevo.fecha = e.target.value; });

    app.querySelectorAll("[data-zona]").forEach(function (b) {
      b.addEventListener("click", function () { filtro = b.dataset.zona; pintar(); });
    });
    app.querySelectorAll("[data-h]").forEach(function (b) {
      b.addEventListener("click", function () { nuevo.h = b.dataset.h; pintar(); document.getElementById("txt").focus(); });
    });
    app.querySelectorAll("[data-f]").forEach(function (b) {
      b.addEventListener("click", function () { nuevo.f = b.dataset.f; pintar(); document.getElementById("txt").focus(); });
    });
    app.querySelectorAll("[data-alt]").forEach(function (b) {
      b.addEventListener("click", function () { alternar(b.dataset.alt); });
    });
    app.querySelectorAll("[data-del]").forEach(function (b) {
      b.addEventListener("click", function () { borrar(b.dataset.del); });
    });
    app.querySelectorAll("[data-mov]").forEach(function (b) {
      b.addEventListener("click", function () {
        var p = b.dataset.mov.split("|");
        mover(p[0], p[1]); pintar();
        if (E.cfg.flow) empujar();
      });
    });

    /* edición en línea del texto */
    app.querySelectorAll("[data-edit]").forEach(function (d) {
      d.addEventListener("click", function () {
        if (editando === d.dataset.edit) return;
        editando = d.dataset.edit; pintar();
        var i = document.getElementById("ed");
        if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
      });
    });
    var ed = document.getElementById("ed");
    if (ed) {
      var cerrar = function (guardarlo) {
        var t = buscar(editando);
        if (t && guardarlo && ed.value.trim() && ed.value.trim() !== t.texto) {
          t.texto = ed.value.trim();
          if (t.ext) t.pend = "edit";
          guardar();
          if (E.cfg.flow) empujar();
        }
        editando = null; pintar();
      };
      ed.addEventListener("blur", function () { cerrar(true); });
      ed.addEventListener("keydown", function (e) {
        if (e.key === "Enter") { e.preventDefault(); cerrar(true); }
        if (e.key === "Escape") { e.preventDefault(); cerrar(false); }
      });
    }

    var notas = document.getElementById("notas");
    var est = document.getElementById("est");
    if (notas) notas.addEventListener("input", function () {
      E.notas = notas.value;
      est.textContent = "escribiendo…";
      clearTimeout(tNotas);
      tNotas = setTimeout(function () {
        guardar(); est.textContent = "guardado";
        setTimeout(function () { est.textContent = ""; }, 1600);
      }, 700);
    });
  }

  function conectarRevision() {
    var cola = colaRevision();
    var t = cola[revIdx];
    app.querySelectorAll("[data-rev]").forEach(function (b) {
      b.addEventListener("click", function () {
        var a = b.dataset.rev;
        if (!t) return;
        if (a === "hecha") alternar(t.id);
        else if (a === "borrar") borrar(t.id);
        else if (a === "saltar") revIdx++;
        else { mover(t.id, a === "semana" ? "semana" : a); if (E.cfg.flow) empujar(); }
        if (a === "saltar") { pintar(); return; }
        guardar();
        var quedan = colaRevision();
        if (!quedan.length) { E.cfg.revisionHecha = hoyISO(); guardar(); }
        pintar();
      });
    });
  }

  function conectarAjustes() {
    var flow = document.getElementById("cfg-flow");
    var lista = document.getElementById("cfg-lista");
    flow.addEventListener("change", function () {
      E.cfg.flow = flow.value.trim(); guardar(); pintarSync();
    });
    lista.addEventListener("change", function () { E.cfg.lista = lista.value.trim(); guardar(); });
    document.getElementById("cfg-auto").addEventListener("change", function (e) {
      E.cfg.auto = e.target.checked; guardar();
    });
    document.getElementById("cfg-dev").addEventListener("change", function (e) {
      E.cfg.devolver = e.target.checked; guardar();
    });
    document.getElementById("probar").addEventListener("click", function () {
      E.cfg.flow = flow.value.trim(); E.cfg.lista = lista.value.trim(); guardar();
      sincronizar(true);
    });
    document.getElementById("cambiar-frase").addEventListener("click", async function () {
      await candado("crear");
      toast("Frase actualizada en este dispositivo.");
    });
    document.getElementById("cerrar-sesion").addEventListener("click", function () {
      localStorage.removeItem(LS_ABIERTO);
      toast("Lista. La próxima vez que abras la app aquí, te la pedirá.");
    });
    document.getElementById("exp-ics").addEventListener("click", ics);
    document.getElementById("exp-json").addEventListener("click", function () {
      bajar("horizonte-" + hoyISO() + ".json", JSON.stringify(E, null, 2), "application/json");
    });
    var file = document.getElementById("file");
    document.getElementById("imp-json").addEventListener("click", function () { file.click(); });
    file.addEventListener("change", function () {
      var f = file.files && file.files[0];
      if (!f) return;
      var lector = new FileReader();
      lector.onload = function () {
        try {
          var d = JSON.parse(lector.result);
          if (!d || !Array.isArray(d.tareas)) throw new Error("formato");
          E = d; cargar_normalizar(); guardar(); pintar();
          toast("Restaurado: " + E.tareas.length + " tareas.");
        } catch (e) { toast("Ese archivo no es una copia válida."); }
      };
      lector.readAsText(f);
    });
  }
  function cargar_normalizar() {
    var base = vacio();
    E.cfg = Object.assign(base.cfg, E.cfg || {});
    E.meta = Object.assign(base.meta, E.meta || {});
    if (!Array.isArray(E.eventos)) E.eventos = [];
    if (typeof E.notas !== "string") E.notas = "";
  }

  /* ============ atajos de teclado (escritorio) ============ */
  document.addEventListener("keydown", function (e) {
    var enCampo = /^(INPUT|TEXTAREA)$/.test((e.target.tagName || "").toUpperCase());
    if (e.key === "/" && !enCampo) {
      var i = document.getElementById("txt");
      if (i) { e.preventDefault(); vista = "horizonte"; pintar(); document.getElementById("txt").focus(); }
    }
    if (!enCampo && ["1", "2", "3", "4"].indexOf(e.key) >= 0 && vista === "horizonte") {
      filtro = ORDEN_H[+e.key - 1]; pintar();
    }
    if (!enCampo && e.key.toLowerCase() === "r") { vista = "revision"; revIdx = 0; pintar(); }
  });

  /* ============ arranque ============ */
  (async function arrancar() {
    await candadoRevisar();

    cargar();
    reubicar();
    /* accesos directos del icono instalado: #revision, #agenda */
    var atajo = (location.hash || "").replace("#", "");
    if (["agenda", "revision", "ajustes"].indexOf(atajo) >= 0) vista = atajo;
    else if (!E.cfg.flow && !E.tareas.length) vista = "horizonte";
    pintar();

    if (E.cfg.flow && E.cfg.auto) {
      sincronizar(false);
      setInterval(function () { if (E.cfg.auto && E.cfg.flow) sincronizar(false); }, 10 * 60 * 1000);
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState !== "visible" || !E.cfg.auto || !E.cfg.flow) return;
        var ultima = E.meta.ultimaSync ? Date.parse(E.meta.ultimaSync) : 0;
        if (Date.now() - ultima > 2 * 60 * 1000) sincronizar(false);
        else if (E.meta.ultimoDia !== hoyISO()) pintar();   // cambió el día: recolocar horizontes
      });
    }
    window.addEventListener("online", function () {
      if (E.cfg.flow && E.tareas.some(function (t) { return t.pend; })) sincronizar(false);
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () { /* sin conexión: da igual */ });
      });
    }
  })();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLM FAP · Contract Lifecycle Management · FIAS</title>
<meta name="description" content="Plataforma única de gestión del ciclo de vida de contratos del FAP/FIAS: solicitudes, repositorio, pipeline, obligaciones, modificaciones, terminación, calificación de proveedores, reportes y bitácora.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
<!-- Librerías de generación de Word alojadas en el propio repositorio (no en CDN externos):
     evita el bloqueo de redes corporativas y reduce falsos positivos de antivirus. -->
<script src="vendor/pizzip.min.js"></script>
<script src="vendor/docxtemplater.min.js"></script>
<!-- Login con la cuenta de Microsoft de FIAS: copia canónica de MSAL, compartida
     por CLM, CRM y bienes. -->
<script src="vendor/msal-browser.min.js"></script>
<style>
  :root{
    --navy:#00249C; --navy2:#2547C9; --ink:#0B153F; --bg:#F4F6FB; --card:#fff;
    --line:#E3E6F0; --line2:#EAEDF5; --muted:#6B7180; --muted2:#9AA0B2;
    --green:#1E9E5A; --greenbg:#E7F6EE; --amber:#C98A08; --amberbg:#FCF3DD;
    --red:#D23A3A; --redbg:#FBE7E7; --tint:#EEF1FB; --violet:#6A44C9; --teal:#0E9AA7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{font-family:'Titillium Web',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
  a{color:var(--navy);text-decoration:none}
  button{font-family:inherit}
  input,select,textarea{font-family:inherit;font-size:14px}
  ::placeholder{color:var(--muted2)}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .up{animation:up .25s ease}

  /* ===== shell ===== */
  .shell{display:flex;min-height:100vh}
  aside.side{width:230px;flex:0 0 230px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .side-brand{display:flex;align-items:center;gap:11px;padding:16px 16px 14px;border-bottom:1px solid var(--line2)}
  .logo{width:40px;height:40px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 auto}
  .side-brand .t{font-weight:700;font-size:14px;line-height:1.15}
  .side-brand .s{font-size:11px;color:var(--muted)}
  .navgrp{font-size:10.5px;font-weight:700;letter-spacing:.7px;color:var(--muted2);text-transform:uppercase;padding:16px 18px 6px}
  .navitem{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:9px 14px;margin:1px 8px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);width:calc(100% - 16px)}
  .navitem:hover{background:var(--tint);color:var(--navy)}
  .navitem.on{background:var(--navy);color:#fff}
  .navitem .nbadge{margin-left:auto;font-size:11px;font-weight:700;background:var(--redbg);color:var(--red);padding:1px 8px;border-radius:99px}
  .navitem.on .nbadge{background:rgba(255,255,255,.22);color:#fff}
  .side-foot{margin-top:auto;border-top:1px solid var(--line2);padding:12px 14px;display:flex;align-items:center;gap:10px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--tint);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto}
  .side-foot .n{font-size:12.5px;font-weight:700;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-foot .r{font-size:11px;color:var(--muted)}
  .iconbtn{all:unset;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px;display:flex}
  .iconbtn:hover{background:var(--tint);color:var(--navy)}

  main.main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid var(--line);padding:0 22px;height:58px;position:sticky;top:0;z-index:15}
  .topbar h1{font-size:16.5px;font-weight:700;margin:0}
  .gsearch{margin-left:auto;position:relative;width:min(340px,38vw)}
  .gsearch input{width:100%;padding:9px 12px 9px 34px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
  .gsearch input:focus{outline:none;border-color:var(--navy);background:#fff}
  .gsearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%)}
  .gresults{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 44px rgba(11,21,63,.14);max-height:330px;overflow:auto;z-index:40}
  .gres{display:block;padding:10px 13px;border-bottom:1px solid var(--line2);cursor:pointer}
  .gres:hover{background:var(--tint)}
  .gres .a{font-size:13px;font-weight:700;color:var(--ink)}
  .gres .b{font-size:11.5px;color:var(--muted)}
  .content{padding:22px 24px 70px;max-width:1220px;width:100%;margin:0 auto}
  .content.full{max-width:none;padding:0;display:flex;flex-direction:column;flex:1}

  .srcpill{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--line2);padding:5px 10px;border-radius:99px;white-space:nowrap}
  .srcdot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .srcdot.off{background:var(--amber)}

  @media(max-width:860px){
    .shell{flex-direction:column}
    aside.side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}
    .side-brand{border:0}
    .navgrp{display:none}
    .navitem{width:auto;padding:8px 11px}
    .side-foot{margin-left:auto;border:0}
  }

  /* ===== atoms ===== */
  .btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;font-weight:700;font-size:13.5px;padding:11px 17px;border-radius:10px;transition:filter .15s}
  .btn:hover{filter:brightness(1.1)}
  .btn.line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .btn.line:hover{background:var(--bg);filter:none}
  .btn.danger{background:var(--red)}
  .btn.sm{padding:8px 13px;font-size:12.5px}
  .btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
  .panel{background:#fff;border:1px solid var(--line2);border-radius:15px;padding:20px 22px}
  .ptitle{font-size:14.5px;font-weight:700;margin:0 0 3px}
  .psub{font-size:12px;color:var(--muted);margin:0 0 14px}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .b-g{background:var(--greenbg);color:var(--green)} .b-a{background:var(--amberbg);color:var(--amber)}
  .b-r{background:var(--redbg);color:var(--red)} .b-d{background:#EEF0F5;color:var(--muted)}
  .b-n{background:var(--tint);color:var(--navy)} .b-v{background:#EFE6FA;color:var(--violet)}
  .chip{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 13px;border:1.5px solid var(--line);border-radius:99px;background:#fff}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .catchip{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
  @media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:#fff;border:1px solid var(--line2);border-radius:13px;padding:14px 16px;cursor:pointer;transition:box-shadow .15s}
  .kpi:hover{box-shadow:0 10px 26px rgba(11,21,63,.08)}
  .kpi-n{font-size:24px;font-weight:700;line-height:1}
  .kpi-l{font-size:11.5px;color:var(--muted);margin-top:6px;font-weight:600}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px}
  .search{flex:1;min-width:200px;position:relative}
  .search input{width:100%;padding:10px 12px 10px 36px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
  .search input:focus{outline:none;border-color:var(--navy)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%)}
  .viewtog{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
  .viewtog button{all:unset;cursor:pointer;padding:8px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .viewtog button.on{background:var(--navy);color:#fff}

  /* tables */
  .tablewrap{background:#fff;border:1px solid var(--line2);border-radius:14px;overflow-x:auto}
  table.list{width:100%;border-collapse:collapse;min-width:760px}
  table.list th{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted2);text-align:left;padding:12px 13px;border-bottom:1.5px solid var(--line2);background:#FAFBFE;white-space:nowrap}
  table.list td{font-size:13px;padding:11px 13px;border-bottom:1px solid var(--line2);vertical-align:middle}
  table.list tbody tr{cursor:pointer}
  table.list tbody tr:hover{background:var(--tint)}
  .td-nro{font-weight:700;color:var(--navy);white-space:nowrap}
  .td-obj{font-weight:600;max-width:280px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.r{background:var(--red)}.dot.done{background:var(--muted2)}

  /* cards grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
  .cc{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:16px;cursor:pointer;transition:box-shadow .15s,transform .15s;border-left:5px solid var(--line);position:relative}
  .cc:hover{box-shadow:0 12px 30px rgba(11,21,63,.09);transform:translateY(-2px)}
  .cc.g{border-left-color:var(--green)}.cc.a{border-left-color:var(--amber)}.cc.r{border-left-color:var(--red)}.cc.done{border-left-color:var(--muted2);opacity:.85}
  .cc-nro{font-size:11.5px;font-weight:700;color:var(--navy)}
  .cc-title{font-size:14px;font-weight:700;margin:7px 0 2px;line-height:1.3}
  .cc-area{font-size:12px;color:var(--muted);margin-bottom:10px}
  .cc-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .cc-meta b{color:var(--ink)}

  /* pipeline */
  .kanban{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:13px;overflow-x:auto;align-items:start}
  @media(max-width:1100px){.kanban{grid-template-columns:repeat(5,240px)}}
  .kcol{background:#EDF0F8;border-radius:14px;padding:11px}
  .kcol-h{display:flex;align-items:center;gap:8px;padding:3px 5px 10px}
  .kcol-h .kdot{width:10px;height:10px;border-radius:50%}
  .kcol-h .kt{font-size:12.5px;font-weight:700}
  .kcol-h .kc{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:#fff;padding:2px 8px;border-radius:99px}
  .kcol-sum{font-size:11px;color:var(--muted);padding:0 5px 9px;font-weight:600}
  .kcard{background:#fff;border:1px solid var(--line2);border-radius:11px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:box-shadow .13s}
  .kcard:hover{box-shadow:0 8px 20px rgba(11,21,63,.1)}
  .kcard .a{font-size:11px;font-weight:700;color:var(--navy)}
  .kcard .b{font-size:12.5px;font-weight:700;line-height:1.3;margin:3px 0 4px}
  .kcard .c{font-size:11px;color:var(--muted)}

  /* detail */
  .back{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:14px}
  .back:hover{text-decoration:underline}
  .detail{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
  @media(max-width:920px){.detail{grid-template-columns:1fr}}
  .h-title{font-size:19px;font-weight:700;margin:0 0 2px;line-height:1.3}
  .dl{display:grid;grid-template-columns:1fr 1fr;gap:13px 20px;margin-top:8px}
  .dl .k{font-size:10.5px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
  .dl .v{font-size:14px;font-weight:600}
  .dl .full{grid-column:1/-1}
  .linkbar{display:flex;align-items:center;gap:10px;background:var(--tint);border:1px solid #D7DEF6;border-radius:11px;padding:11px 13px;margin:14px 0 4px}
  .phase{display:flex;align-items:center;margin:16px 0 4px;flex-wrap:wrap;row-gap:8px}
  .step{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;color:var(--muted2)}
  .step .d{width:24px;height:24px;border-radius:7px;background:#EEF0F5;color:var(--muted2);display:flex;align-items:center;justify-content:center;font-size:12px}
  .step.on{color:var(--navy)}.step.on .d{background:var(--navy);color:#fff}
  .step.past{color:var(--green)}.step.past .d{background:var(--greenbg);color:var(--green)}
  .flow-line{flex:1;height:2px;background:var(--line2);margin:0 8px;min-width:14px}
  .act{display:flex;flex-direction:column;gap:9px}
  .actbtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:11px;padding:12px 13px;border:1.5px solid var(--line);border-radius:11px;background:#fff;transition:border-color .14s,background .14s}
  .actbtn:hover{border-color:var(--navy);background:var(--tint)}
  .actbtn:disabled{opacity:.5;cursor:not-allowed}
  .actbtn:disabled:hover{border-color:var(--line);background:#fff}
  .actbtn .ic{width:32px;height:32px;border-radius:8px;background:var(--tint);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .actbtn .at{font-size:13.5px;font-weight:700;display:block}
  .actbtn .ad{font-size:11.5px;color:var(--muted);display:block;margin-top:1px}
  .note{font-size:12px;color:var(--muted);line-height:1.5;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:11px 13px}
  .tl{list-style:none;margin:6px 0 0;padding:0}
  .tl li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line2);margin-left:7px}
  .tl li:last-child{padding-bottom:2px}
  .tl li::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--navy2);border:2px solid #fff}
  .tl .t{font-size:12.5px;font-weight:700}
  .tl .s{font-size:11.5px;color:var(--muted)}

  /* modals */
  .overlay{position:fixed;inset:0;background:rgba(11,21,63,.44);display:flex;align-items:flex-start;justify-content:center;padding:36px 18px;overflow:auto;z-index:60}
  .modal{background:#fff;border-radius:16px;max-width:580px;width:100%;padding:24px 26px 22px;box-shadow:0 30px 80px rgba(11,21,63,.3);animation:up .2s ease}
  .modal h2{font-size:19px;font-weight:700;margin:0 0 3px}
  .modal .sub{font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.5}
  .frow{margin-bottom:13px}
  .frow label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
  .frow input,.frow select,.frow textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
  .frow input:focus,.frow select:focus,.frow textarea:focus{outline:none;border-color:var(--navy)}
  .frow textarea{resize:vertical;min-height:70px}
  .frow2{display:flex;gap:10px}
  .frow2>.frow{flex:1;margin:0}
  .radios{display:flex;flex-direction:column;gap:8px}
  .radio{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;cursor:pointer}
  .radio:hover{border-color:var(--navy)}
  .radio.sel{border-color:var(--navy);background:var(--tint)}
  .radio input{margin-top:2px;accent-color:var(--navy)}
  .radio .rt{font-size:13.5px;font-weight:700;display:block}
  .radio .rd{font-size:11.5px;color:var(--muted);display:block;margin-top:1px}
  .routebox{border-radius:11px;padding:12px 14px;margin:6px 0 4px;font-size:13px;line-height:1.55;border:1.5px solid}
  .route-acta{background:var(--greenbg);border-color:#BCE6CE;color:#15703F}
  .route-adenda{background:var(--amberbg);border-color:#F0DCA6;color:#8A5E06}
  .route-block{background:var(--redbg);border-color:#F3C0C0;color:#A32020}
  .secdiv{font-size:11px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.4px;margin:15px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line2)}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .steps{background:#F4F7FE;border:1px solid #D7DFF5;border-radius:12px;padding:13px 15px;margin-top:12px}
  .steps h3{margin:0 0 7px;font-size:13px;color:var(--navy)}
  .steps ol{margin:0;padding-left:19px;font-size:12.5px;line-height:1.65}
  .crit{margin-bottom:11px}
  .scorebox{background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:13px 15px;margin-top:14px;display:flex;align-items:center;justify-content:space-between}
  .scorebox .big{font-size:28px;font-weight:700;line-height:1}
  .scorebox .lab{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .semaforo{font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:99px}
  .scorebtn.on{background:var(--navy)!important;color:#fff!important;border-color:var(--navy)!important}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:12px 19px;border-radius:11px;box-shadow:0 14px 40px rgba(11,21,63,.3);z-index:90;animation:up .22s ease}
  .empty{text-align:center;padding:50px 20px;color:var(--muted)}

  /* charts */
  .charts{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-bottom:18px}
  @media(max-width:980px){.charts{grid-template-columns:1fr}}
  .chart-svg{width:100%;height:auto;display:block}
  .bar{cursor:pointer}
  .bar:hover{filter:brightness(1.18)}
  .axlbl{font-size:10px;fill:var(--muted2);font-family:'Titillium Web',sans-serif}
  .vallbl{font-size:10.5px;font-weight:700;fill:var(--muted);font-family:'Titillium Web',sans-serif}
  .grid-line{stroke:var(--line2);stroke-width:1}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px}
  .legend .li{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
  .legend .sw{width:11px;height:11px;border-radius:3px}
  #tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:7px 11px;border-radius:8px;z-index:95;display:none;box-shadow:0 10px 26px rgba(11,21,63,.3);max-width:260px;line-height:1.4}

  /* mapa de áreas protegidas */
  .maplayout{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
  @media(max-width:1080px){.maplayout{grid-template-columns:1fr}}
  .mapbox{background:#DDE7F2;border:1px solid var(--line2);border-radius:15px;overflow:hidden;position:relative}
  .map-svg{width:100%;height:auto;display:block}
  .map-ec{fill:#FBFCFE;stroke:#B9C6D8;stroke-width:2;stroke-linejoin:round}
  .map-nb{fill:#E7EDF4;stroke:#CDD8E5;stroke-width:1.5;stroke-linejoin:round}
  .map-pt{cursor:pointer;stroke:#fff;stroke-width:1.6;transition:filter .12s}
  .map-pt:hover{filter:brightness(1.12)}
  .map-pt.dim,.map-sede.dim{opacity:.22}
  .map-sede{cursor:pointer;stroke:#fff;stroke-width:1.6}
  .map-halo{fill:none;stroke:var(--ink);stroke-width:2.5;opacity:.8;pointer-events:none}
  .map-lbl{font-family:'Titillium Web',sans-serif;font-size:15px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:#FBFCFE;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
  .map-note{position:absolute;left:12px;bottom:10px;font-size:11px;font-weight:600;color:var(--muted);background:rgba(255,255,255,.82);border-radius:7px;padding:4px 9px}
  .aplist{max-height:560px;overflow-y:auto;margin:-4px -6px 0;padding:4px 6px}

<body>
<div id="app"></div>
<div id="tip"></div>
<script>
/* =====================================================================
   CLM FAP — Contract Lifecycle Management · FIAS
   Plataforma única que unifica: intake precontractual (reglas de La
   Mágica), repositorio y ejecución (CRM), modificaciones, terminación,
   calificación de proveedores (FO-AD-ABC-017), envío a la Unidad
   Operativa (Power Automate), reportes y bitácora. Las herramientas
   originales quedan embebidas como módulos (misma publicación).
   ===================================================================== */

/* ================= CONFIG ================= */
// Misma URL del flujo de Power Automate que usan La Mágica y el CRM
// (subida de documentos a revisión de la Unidad Operativa).
var FLOW_DOCS_URL = 'https://default5e23e4af237d4d97bf6edca8080157.87.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/08/workflows/d9ab249ef28a41c69d9bb7a5ee32a00e/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=fhmL_aMEe5PETXXKDZuiYMg47xFWoa0RygIxFWFzCwI';
var TPL_PATH = '../crm/plantillas/';

/* ================= SESIÓN (MSAL / Entra ID) =================
   Reemplaza a la frase compartida. Antes, la frase descifraba TODOS los
   contratos en el navegador — el selector "AC / área / Unidad Operativa" de
   la pantalla de entrada era solo una etiqueta que cada quien se ponía sola,
   sin verificación: cualquiera con la frase podía marcarse como "Unidad
   Operativa" y ver todo. Ahora el filtro lo hace el flujo protegido, del
   lado del servidor: el navegador nunca recibe lo que no le toca ver. */
const MSAL_CONFIG = {
  clientId: '',                                    // Application (client) ID de la app registrada
  authority: '',                                    // 'https://login.microsoftonline.com/<tenant-id-o-dominio>'
  redirectUri: window.location.origin + window.location.pathname
};
const MSAL_API_SCOPE = '';        // api://<client-id>/Contratos.Leer — ver bienes/CONECTAR.md, parte de contratos
const API_MIS_CONTRATOS_URL = ''; // flujo protegido "obtener mis contratos" (el mismo que usa el CRM)

let msalApp = null, msalCuenta = null;
function msalListo(){ return !!(MSAL_CONFIG.clientId && MSAL_CONFIG.authority && window.msal); }
async function msalIniciar(){
  if(!msalListo()) return null;
  if(!msalApp){
    msalApp = new msal.PublicClientApplication({
      auth: { clientId: MSAL_CONFIG.clientId, authority: MSAL_CONFIG.authority, redirectUri: MSAL_CONFIG.redirectUri },
      cache: { cacheLocation: 'localStorage' }
    });
    await msalApp.initialize();
  }
  const ctas = msalApp.getAllAccounts();
  msalCuenta = ctas.length ? ctas[0] : null;
  return msalCuenta;
}
async function msalEntrar(){
  await msalIniciar();
  const r = await msalApp.loginPopup({ scopes: ['User.Read'] });
  msalCuenta = r.account;
  return msalCuenta;
}
function msalSalir(){ if(msalApp && msalCuenta) msalApp.logoutRedirect({ account: msalCuenta }); }
async function msalToken(){
  const req = { scopes: [MSAL_API_SCOPE], account: msalCuenta };
  try{ return (await msalApp.acquireTokenSilent(req)).accessToken; }
  catch(e){ return (await msalApp.acquireTokenPopup(req)).accessToken; }
}
async function pedirMisContratos(){
  const token = await msalToken();
  const r = await fetch(API_MIS_CONTRATOS_URL, { headers: { Authorization: 'Bearer '+token } });
  if(r.status===403) throw new Error('Tu cuenta inició sesión, pero no tiene contratos ni acceso registrado. Pídele a quien administra el CLM que lo revise.');
  if(!r.ok) throw new Error('No pude consultar tus contratos (HTTP '+r.status+').');
  return r.json();   // {alcance:'todas'|'area'|'ac', area, contratos:[...]}
}

/* ================= HELPERS (heredados del CRM) ================= */
const $=(s,el=document)=>el.querySelector(s);
function norm(s){return String(s==null?"":s).trim().toLowerCase();}
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>(n==null||n==="")?"—":"$"+Number(n).toLocaleString("es-EC",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>"$"+Math.round(Number(n)||0).toLocaleString("es-EC");
function moneyShort(n){n=Number(n)||0;if(n>=1e6)return "$"+(n/1e6).toFixed(1).replace(".0","")+" M";if(n>=1e3)return "$"+Math.round(n/1e3)+" k";return "$"+Math.round(n);}
function fdate(iso){if(!iso)return "—";const [y,m,d]=String(iso).split("-");const M=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];return `${+d} ${M[+m-1]} ${y}`;}
function longDate(iso){if(!iso)iso=new Date().toISOString().slice(0,10);const [y,m,d]=String(iso).split("-");const M=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];return `${+d} de ${M[+m-1]} de ${y}`;}
function todayISO(){const t=new Date();const p=n=>String(n).padStart(2,"0");return t.getFullYear()+"-"+p(t.getMonth()+1)+"-"+p(t.getDate());}
function diasRestantes(c){if(!c.fin)return null;const t=new Date(todayISO()+"T00:00:00");const f=new Date(c.fin+"T00:00:00");return Math.round((f-t)/86400000);}
function montoDe(c){return (c.montoTotal!=null&&c.montoTotal>0)?c.montoTotal:(c.monto||0);}
function tieneAdenda(c){return norm(c.adenda).startsWith("s");}
function montoAdenda(c){const d=montoDe(c)-(c.monto||0);return d>0.009?d:0;}
function manualDocx(txt){return `«COMPLETAR: ${txt}»`;}
function trunc(s,n){s=String(s==null?"":s);return s.length>n?s.slice(0,n-1).trimEnd()+"…":s;}
function cleanNro(n){return String(n).replace(/[^0-9A-Za-z]+/g,"_").replace(/^_|_$/g,"");}
function isConsultoria(c){const s=(norm(c.cat)+" "+norm(c.tipo)+" "+norm(c.detalle));return /consultor|servicio.*profesional|profesional/.test(s);}
function montoEnLetras(n){
  n=Number(n)||0;
  const ent=Math.floor(n), cent=Math.round((n-ent)*100);
  const U=["","UNO","DOS","TRES","CUATRO","CINCO","SEIS","SIETE","OCHO","NUEVE","DIEZ","ONCE","DOCE","TRECE","CATORCE","QUINCE","DIECISÉIS","DIECISIETE","DIECIOCHO","DIECINUEVE","VEINTE"];
  const D=["","","VEINTE","TREINTA","CUARENTA","CINCUENTA","SESENTA","SETENTA","OCHENTA","NOVENTA"];
  const C=["","CIENTO","DOSCIENTOS","TRESCIENTOS","CUATROCIENTOS","QUINIENTOS","SEISCIENTOS","SETECIENTOS","OCHOCIENTOS","NOVECIENTOS"];
  function tres(x){x=Number(x);if(x===0)return "";if(x===100)return "CIEN";let s="";const c=Math.floor(x/100),r=x%100;
    if(c>0)s+=C[c]+" ";
    if(r<=20)s+=U[r];
    else{const d=Math.floor(r/10),u=r%10;
      if(r<30)s+="VEINTI"+U[u].toLowerCase().replace(/^./,m=>m.toUpperCase());
      else{s+=D[d];if(u>0)s+=" Y "+U[u];}}
    return s.trim();}
  function grupo(x,sing,plur){if(x===0)return "";if(x===1)return sing;return tres(x)+" "+plur;}
  let entero;
  if(ent===0)entero="CERO";
  else{const mill=Math.floor(ent/1000000),rm=ent%1000000;const mil=Math.floor(rm/1000),rc=rm%1000;let partes=[];
    if(mill>0)partes.push(grupo(mill,"UN MILLÓN","MILLONES"));
    if(mil>0)partes.push(mil===1?"MIL":tres(mil)+" MIL");
    if(rc>0)partes.push(tres(rc));
    entero=partes.join(" ").trim();}
  const bruto=`${entero} CON ${String(cent).padStart(2,"0")}/100 DÓLARES DE LOS ESTADOS UNIDOS DE AMÉRICA`;
  let s=bruto.charAt(0)+bruto.slice(1).toLowerCase();
  s=s.replace(/estados unidos de américa/i,"Estados Unidos de América");
  return s;
}
const CAT_COLORS=[
  [/combustible/,{bg:"#FDEBD7",fg:"#9A5B10"}],
  [/mantenimiento/,{bg:"#E3EBFC",fg:"#1D48B8"}],
  [/arrenda|arriendo/,{bg:"#EFE6FA",fg:"#6B34B8"}],
  [/consultor|profesional/,{bg:"#DDF3F0",fg:"#0E7D6F"}],
  [/limpieza/,{bg:"#E2F5E4",fg:"#1F7A34"}],
  [/internet|conectividad/,{bg:"#DDF0F9",fg:"#0B6E96"}],
  [/radio/,{bg:"#FBE3EE",fg:"#B03070"}],
  [/embarcaci|vessel|nav/,{bg:"#E0EFF6",fg:"#255E7E"}]
];
function catColor(cat){const s=norm(cat);for(const [re,c] of CAT_COLORS)if(re.test(s))return c;return {bg:"#ECEEF4",fg:"#5A6072"};}
function catChip(cat,extra){const col=catColor(cat);return `<span class="catchip" style="background:${col.bg};color:${col.fg};${extra||""}">${esc(cat||"—")}</span>`;}

/* ================= DATA + PERSISTENCIA ================= */
let CONTRACTS=[];               // base viva (crm/contratos_export.json)
let dataSource={label:"Cargando…",live:false};
let CLM={overlay:{},solicitudes:[],log:[]};   // estado propio del CLM (localStorage)

function saveCLM(){try{localStorage.setItem("fap_clm_v1",JSON.stringify(CLM));}catch(e){}}
function loadCLM(){try{const r=localStorage.getItem("fap_clm_v1");if(r){const o=JSON.parse(r);CLM={overlay:o.overlay||{},solicitudes:o.solicitudes||[],log:o.log||[]};}}catch(e){}}
function ov(c){return CLM.overlay[c.nro]||(CLM.overlay[c.nro]={});}
function logAdd(icon,txt,ref){CLM.log.unshift({ts:new Date().toISOString(),user:SES?SES.user:"—",icon,txt,ref:ref||null});if(CLM.log.length>400)CLM.log.length=400;saveCLM();}

/* estado vivo del contrato (con overlay del CLM) */
function statusLive(c){
  const o=ov(c);
  if(c.cerrado)return {cls:"done",b:"b-d",label:"Cerrado",key:"cerrado"};
  if(o.terminado)return {cls:"done",b:"b-d",label:"Terminado",key:"terminado"};
  const d=diasRestantes(c);
  if(d==null)return {cls:"g",b:"b-g",label:"Vigente",key:"vigente"};
  if(d<0)return {cls:"r",b:"b-r",label:"Vencido",key:"vencido"};
  if(d<=90)return {cls:"a",b:"b-a",label:`Por vencer · ${d}d`,key:"aviso"};
  return {cls:"g",b:"b-g",label:`Vigente · ${d}d`,key:"vigente"};
}
function vigenciaText(c){
  const o=ov(c);
  if(c.cerrado)return "Contrato cerrado";
  if(o.terminado)return "Contrato terminado";
  const d=diasRestantes(c);
  if(d==null)return "Sin fecha de fin";
  if(d<0)return `Vencido hace ${Math.abs(d)} día${Math.abs(d)==1?"":"s"}`;
  if(d===0)return "Vence hoy";
  if(d<=90)return `Vence en ${d} días (aviso)`;
  const meses=Math.floor(d/30);
  return `${d} días restantes${meses>=2?` · ~${meses} meses`:""}`;
}

/* ================= SESIÓN ================= */
let SES=null; // {rol:'ac'|'area'|'uo', user}
try{const s=sessionStorage.getItem("fap_clm_ses");if(s)SES=JSON.parse(s);}catch(e){}
function setSes(v){SES=v;try{v?sessionStorage.setItem("fap_clm_ses",JSON.stringify(v)):sessionStorage.removeItem("fap_clm_ses");}catch(e){}}
// true cuando CONTRACTS ya viene filtrado por el flujo protegido (login): no
// hay que volver a filtrar por nombre, porque "ac" es texto tecleado en el
// Excel y puede no calzar carácter a carácter con el nombre que da Microsoft.
let YA_FILTRADO=false;
function myContracts(){
  if(!SES)return [];
  if(YA_FILTRADO)return CONTRACTS;
  if(SES.rol==="uo")return CONTRACTS;
  if(SES.rol==="area")return CONTRACTS.filter(c=>c.area===SES.user);
  return CONTRACTS.filter(c=>c.ac===SES.user);
}
function mySolicitudes(){
  if(!SES)return [];
  if(SES.rol==="uo")return CLM.solicitudes;
  return CLM.solicitudes.filter(s=>s.owner===SES.user||s.ac===SES.user);
}

/* ================= ROUTER ================= */
let ST={view:"panel",cur:null,q:"",filter:"all",catFilter:"all",areaFilter:"all",sort:"recientes",viewMode:"table",repQ:""};
const VIEWS={panel:"Panel de control",pipeline:"Pipeline del ciclo de vida",contratos:"Repositorio de contratos",bienes:"Bienes y activos fijos",solicitudes:"Solicitudes precontractuales",alertas:"Alertas y renovaciones",reportes:"Reportes y analítica",mapa:"Mapa de áreas protegidas",actividad:"Bitácora de actividad",calificacion:"Calificador de ofertas · selección",magica:"La Mágica · documentos precontractuales",crmx:"CRM clásico",detalle:"Detalle del contrato"};
function go(view,cur){ST.view=view;if(cur!==undefined)ST.cur=cur;location.hash="#/"+view+(view==="detalle"&&ST.cur!=null?"/"+ST.cur:"");render();window.scrollTo(0,0);}
window.addEventListener("hashchange",()=>{
  const m=location.hash.match(/^#\/([a-z]+)(?:\/(\d+))?/);
  if(m&&VIEWS[m[1]]&&(m[1]!==ST.view||(m[2]!=null&&+m[2]!==ST.cur))){ST.view=m[1];if(m[2]!=null)ST.cur=+m[2];render();}
});

/* ================= APP RENDER ================= */
function render(){
  if(!SES){renderLogin();return;}
  const app=$("#app");
  const nav=(id,label,icon,badge)=>`<button class="navitem ${ST.view===id||(id==='contratos'&&ST.view==='detalle')?"on":""}" data-go="${id}">${icon}<span>${label}</span>${badge?`<span class="nbadge">${badge}</span>`:""}</button>`;

    panel:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',

    sol:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
    bell:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
    chart:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15v-4M12 15V7M17 15v-7"/></svg>',
    clock:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
    map:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3 3 5.5v15L9 18l6 3 6-2.5v-15L15 6z"/><path d="M9 3v15M15 6v15"/></svg>',
    magic:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 21 9-9"/><path d="M15 4V2M15 16v-2M8 9h2M20 9h2M17.8 11.8 19 13M17.8 6.2 19 5M12.2 6.2 11 5"/></svg>',
    grid:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M8 4v16"/></svg>',
    scale:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18M7 21h10M6 7h12l-3 5a3 3 0 0 1-6 0zM6 7 3 12a3 3 0 0 0 6 0zM18 7l3 5a3 3 0 0 1-6 0z"/></svg>',
    box:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>'
  };
  app.innerHTML=`
  <div class="shell">
    <aside class="side">
      <div class="side-brand"><div class="logo">FAP</div><div><div class="t">CLM · FAP</div><div class="s">Ciclo de vida de contratos</div></div></div>
      <div class="navgrp">Gestión</div>
      ${nav("panel","Panel",I.panel)}
      ${nav("pipeline","Pipeline",I.pipe)}

      ${nav("solicitudes","Solicitudes",I.sol)}
      ${nav("alertas","Alertas",I.bell,nAlerts||"")}
      <div class="navgrp">Análisis</div>
      ${nav("reportes","Reportes",I.chart)}
      ${nav("mapa","Mapa de áreas",I.map)}
      ${nav("actividad","Bitácora",I.clock)}
      <div class="navgrp">Herramientas integradas</div>
      ${nav("calificacion","Calificador de ofertas",I.scale)}
      ${nav("magica","La Mágica",I.magic)}
      ${nav("crmx","CRM clásico",I.grid)}
      <div class="side-foot">

function bindGlobalSearch(){
  const inp=$("#gq"),box=$("#gres");
  inp.oninput=()=>{
    const q=norm(inp.value);
    if(q.length<2){box.style.display="none";return;}
    const hits=CONTRACTS.map((c,i)=>({c,i})).filter(({c})=>norm(c.nro+" "+c.detalle+" "+c.proveedor+" "+c.area+" "+c.ac).includes(q)).slice(0,8);
    if(!hits.length){box.innerHTML=`<div class="gres"><span class="b">Sin resultados…</span></div>`;box.style.display="";return;}
    box.innerHTML=hits.map(({c,i})=>`<div class="gres" data-i="${i}"><div class="a">${esc(c.nro)} — ${esc(trunc(c.detalle,70))}</div><div class="b">${esc(c.area||"")} · ${esc(c.proveedor||"")}</div></div>`).join("");
    box.style.display="";
    box.querySelectorAll("[data-i]").forEach(el=>el.onclick=()=>{box.style.display="none";inp.value="";go("detalle",+el.dataset.i);});
  };
  inp.onblur=()=>setTimeout(()=>{box.style.display="none";},200);
}

/* ================= CHARTS (SVG inline) ================= */
function barChartMeses(data){ /* data: [{label,count,monto}] */
  const W=560,H=190,padL=8,padB=22,padT=14;
  const max=Math.max(1,...data.map(d=>d.count));
  const bw=(W-padL*2)/data.length;
  const ticks=[0,Math.ceil(max/2),max];
  let g=ticks.map(t=>{const y=padT+(H-padT-padB)*(1-t/max);return `<line class="grid-line" x1="${padL}" y1="${y}" x2="${W-padL}" y2="${y}"/><text class="axlbl" x="${padL}" y="${y-3}">${t}</text>`;}).join("");
  let bars=data.map((d,i)=>{
    const h=(H-padT-padB)*(d.count/max);
    const x=padL+i*bw+bw*0.18, y=H-padB-h, w=bw*0.64;
    const lbl=d.count>0?`<text class="vallbl" x="${x+w/2}" y="${y-4}" text-anchor="middle">${d.count}</text>`:"";
    return `<rect class="bar" x="${x}" y="${y}" width="${w}" height="${Math.max(h,1)}" rx="3" fill="var(--navy2)" data-tip="<b>${esc(d.label)}</b><br>${d.count} contrato(s) vencen<br>${money0(d.monto)} en juego"/>${lbl}
      <text class="axlbl" x="${x+w/2}" y="${H-7}" text-anchor="middle">${esc(d.label)}</text>`;
  }).join("");
  return `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Vencimientos por mes">${g}${bars}</svg>`;
}
function barChartH(data,fmt){ /* data: [{label,value,tip}] una serie navy */
  const max=Math.max(1,...data.map(d=>d.value));
  return data.map(d=>{
    const pct=Math.max(1.5,d.value/max*100);
    return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px" data-tip="${esc(d.tip||"")}">
      <div style="flex:0 0 128px;font-size:12px;font-weight:600;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(d.label)}</div>
      <div style="flex:1;background:var(--bg);border-radius:6px;height:20px;position:relative">
        <div class="bar" style="width:${pct}%;height:100%;background:var(--navy2);border-radius:6px"></div>
      </div>
      <div style="flex:0 0 74px;font-size:12px;font-weight:700">${fmt(d.value)}</div>
    </div>`;
  }).join("");
}
function stackEstado(segs){ /* status: colores reservados + etiqueta visible + leyenda con conteos */
  const total=segs.reduce((a,s)=>a+s.n,0)||1;
  const bar=segs.filter(s=>s.n>0).map(s=>{
    const pct=s.n/total*100;
    return `<div style="flex:${s.n};background:${s.col}" data-tip="<b>${esc(s.label)}</b>: ${s.n} (${pct.toFixed(0)}%)">${pct>=9?s.n:""}</div>`;
  }).join("");
  const leg=segs.map(s=>`<span class="li"><span class="sw" style="background:${s.col}"></span>${esc(s.label)} · <b style="color:var(--ink)">${s.n}</b></span>`).join("");
  return `<div class="stackbar">${bar}</div><div class="legend">${leg}</div>`;
}

/* ================= VISTA: CONTRATOS (repositorio) ================= */
/* clave de "novedad": año*1e6 + secuencia del número de contrato (FIAS-FAP - 2026 - 158 → 2026000158) */
function nroKey(c){
  const s=String(c.nro||"");
  const m=s.match(/(\d{4})\D+(\d+)\s*$/);
  if(m)return (+m[1])*1000000+(+m[2]);
  const m2=s.match(/(\d+)\s*$/);
  return m2?+m2[1]:0;
}
function countLabel(n,total){
  if(n===total)return `${total} contrato${total===1?"":"s"}`;
  return `Mostrando <b style="color:var(--ink)">${n}</b> de ${total}`;
}
function filteredContracts(){
  const list=myContracts().filter(c=>{
    if(ST.filter!=="all"){
      const k=statusLive(c).key;
      if(ST.filter==="vig"&&k!=="vigente")return false;
      if(ST.filter==="avi"&&k!=="aviso")return false;
      if(ST.filter==="ven"&&k!=="vencido")return false;
      if(ST.filter==="ter"&&!(k==="terminado"||k==="cerrado"))return false;
    }
    if(ST.catFilter!=="all"&&(c.cat||"—")!==ST.catFilter)return false;
    if(ST.areaFilter!=="all"&&(c.area||"—")!==ST.areaFilter)return false;
    if(ST.q){const hay=norm(c.detalle+" "+c.nro+" "+c.area+" "+c.proveedor+" "+c.cat);if(!hay.includes(norm(ST.q)))return false;}
    return true;
  });
  const dias=c=>{const d=diasRestantes(c);return d==null?1e9:d;};
  const S={
    recientes:(a,b)=>nroKey(b)-nroKey(a),
    antiguos:(a,b)=>nroKey(a)-nroKey(b),
    vence:(a,b)=>dias(a)-dias(b),
    monto:(a,b)=>montoDe(b)-montoDe(a),
    area:(a,b)=>String(a.area||"").localeCompare(String(b.area||""))||nroKey(b)-nroKey(a)
  };
  list.sort(S[ST.sort]||S.recientes);   // list es copia (filter), no muta CONTRACTS
  return list;
}
function vContratos(){
  const mine=myContracts(),list=filteredContracts();

function contractTimeline(c){
  const o=ov(c),ev=[];
  if(c.firma)ev.push({d:c.firma,t:"✍️ Contrato firmado",s:longDate(c.firma)});
  if(c.inicio)ev.push({d:c.inicio,t:"▶️ Inicio de la ejecución",s:longDate(c.inicio)});
  if(tieneAdenda(c)&&c.firmaAdenda)ev.push({d:c.firmaAdenda,t:"📎 Adenda firmada — "+(c.tipoAdenda||"modificación"),s:longDate(c.firmaAdenda)+(montoAdenda(c)?" · +"+money(montoAdenda(c)):"")});
  CLM.log.filter(l=>l.ref===c.nro).forEach(l=>ev.push({d:l.ts.slice(0,10),t:l.icon+" "+l.txt,s:l.user+" · "+new Date(l.ts).toLocaleDateString("es-EC")}));
  if(!o.terminado&&!c.cerrado&&c.fin)ev.push({d:c.fin,t:"🏁 Fin de vigencia "+(diasRestantes(c)>=0?"(previsto)":"(vencido)"),s:longDate(c.fin)});
  return ev.sort((a,b)=>String(a.d).localeCompare(String(b.d)));
}
function modalNota(c){

}

/* ================= MODALES DEL CICLO (heredados del CRM, con bitácora) ================= */
function openModal(html){
  const o=document.createElement("div");o.className="overlay";o.innerHTML=`<div class="modal">${html}</div>`;
  document.body.appendChild(o);
  o.addEventListener("click",e=>{if(e.target===o)o.remove();});
  return o;
}
function closeModal(el){(el.closest&&el.closest(".overlay")||el).remove();}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3400);}

/* --- Motor de plantillas .docx reales (las mismas del CRM) --- */
function docxEngineReady(){return !!(window.PizZip&&(window.docxtemplater||window.Docxtemplater));}
const TPL_CACHE={};
async function loadTemplate(nombre){
  if(TPL_CACHE[nombre])return TPL_CACHE[nombre];
  const res=await fetch(TPL_PATH+nombre,{cache:"no-store"});
  if(!res.ok)throw new Error(`No se encontró la plantilla ${nombre} (HTTP ${res.status})`);
  const buf=await res.arrayBuffer();TPL_CACHE[nombre]=buf;return buf;
}
async function generarDocx(nombrePlantilla,data,nombreSalida){
  if(!docxEngineReady())throw new Error("El motor de documentos no cargó. Revisa tu conexión a internet e inténtalo de nuevo.");
  const buf=await loadTemplate(nombrePlantilla);
  const zip=new PizZip(buf.slice(0));
  const DT=window.docxtemplater||window.Docxtemplater;
  const doc=new DT(zip,{paragraphLoop:true,linebreaks:true,delimiters:{start:"{",end:"}"}});
  doc.render(data);
  const out=doc.getZip().generate({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
  const url=URL.createObjectURL(out);
  const a=document.createElement("a");a.href=url;a.download=nombreSalida+".docx";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function modalModificar(c){

    {v:"plazogen",t:"Ampliación de plazo general",d:"Extiende la vigencia total del contrato",informe:"adenda"}
  ];
  if(consult)opciones.push({v:"entrega",t:"Cambio de plazos de entrega",d:"Ajusta el cronograma de entregables (consultoría)",informe:"adenda"});
  const o=openModal(`
    <h2>Modificar contrato</h2>
    <p class="sub">${esc(c.nro)} · ${esc(c.detalle)}</p>
    <div class="frow"><label>Tipo de modificación</label>
      <div class="radios">${opciones.map((op,i)=>`<label class="radio ${i===0?"sel":""}"><input type="radio" name="mt" value="${op.v}" data-inf="${op.informe}" ${i===0?"checked":""}><span><span class="rt">${op.t}</span><span class="rd">${op.d}</span></span></label>`).join("")}</div>
      <div style="font-size:11.5px;color:var(--muted);margin-top:7px">Las modificaciones <b>no pueden ser del objeto</b> del contrato.</div>
    </div>
    <div id="montoRow">
      <div class="frow"><label>Valor del incremento (USD, incl. IVA)</label><input id="inc" type="number" min="0" step="0.01" placeholder="0.00">
        <div style="font-size:11.5px;color:var(--muted);margin-top:5px">Monto original: <b>${money(c.monto)}</b>${montoDe(c)!==c.monto?` · vigente con adendas: <b>${money(montoDe(c))}</b>`:""}</div></div>
      <div class="secdiv">Datos para el informe (FAP-2026-11)</div>
      <div class="frow2"><div class="frow"><label>RUC del proveedor</label><input id="rucM" placeholder="N.º de RUC"></div>
      <div class="frow"><label>Siglas del área</label><input id="siglas" placeholder="Ej.: PNC"></div></div>
      <div class="secdiv">Datos presupuestarios (reprogramación PAG)</div>
      <div class="frow2"><div class="frow"><label>Fecha reprogramación PAG</label><input id="fechaReprog" type="date"></div>
      <div class="frow"><label>Código de partida</label><input id="partida" placeholder="Ej.: 5.3.01"></div></div>
      <div class="frow"><label>Nombre de la línea presupuestaria</label><input id="lineaNombre" placeholder="Nombre de la partida en el PAG"></div>
      <div class="note" style="margin:2px 0 4px">Lo que dejes vacío queda marcado con «COMPLETAR» en el Word.</div>
    </div>
    <div class="frow" id="plazoRow" style="display:none"><label>Plazo adicional / nueva fecha</label><input id="plazoTxt" placeholder="Ej.: 60 días adicionales · nueva finalización 30 nov 2026"></div>
    <div class="frow"><label>Justificación (opcional para monto, obligatoria para plazo)</label><textarea id="just" placeholder="Motivo técnico y contractual…"></textarea></div>
    <div id="routebox"></div>
    <div class="modal-foot"><button class="btn line" id="cancel">Cancelar</button><button class="btn" id="gen">Generar borrador de informe</button></div>`);
  const radios=o.querySelectorAll("input[name=mt]");
  const montoRow=$("#montoRow",o),plazoRow=$("#plazoRow",o),inc=$("#inc",o),routebox=$("#routebox",o);
  function sel(){return [...radios].find(r=>r.checked);}
  function route(){
    const r=sel(),v=r.value,informe=r.dataset.inf;
    montoRow.style.display=v==="monto"?"":"none";
    plazoRow.style.display=v==="monto"?"none":"";
    const genBtn=$("#gen",o);
    let instrumento,pct=null,pctAcum=null,blocked=false;
    if(v==="monto"){
      const base=c.monto||0,totalActual=montoDe(c),val=parseFloat(inc.value)||0;
      pct=base?(val/base*100):0;
      pctAcum=base?(((totalActual+val)-base)/base*100):0;
      blocked=pctAcum>50;
      instrumento=pct>=25?"Adenda modificatoria":"Acta de aumento de valor";
    }else instrumento="Adenda modificatoria";
    const isAdenda=instrumento==="Adenda modificatoria";
    const infTxt=informe==="aumento"?"Informe de aumento de monto (FAP-2026-11)":"Informe de justificación de adenda";
    if(blocked){
      routebox.innerHTML=`<div class="routebox route-block"><b>Modificación no permitida.</b><br>Con este incremento, las modificaciones acumuladas llegarían al <b>${pctAcum.toFixed(1)}%</b> del monto original (límite: <b>50%</b>). Corresponde iniciar un <b>nuevo proceso de contratación</b> — consulta con Legal FAP.</div>`;
      genBtn.disabled=true;
    }else{
      routebox.innerHTML=`<div class="routebox ${isAdenda?"route-adenda":"route-acta"}">Se generará el <b>borrador del ${infTxt}</b>.<br>Instrumento que preparará Legal: <b>${instrumento}</b>.<br>${v==="monto"?`El incremento representa <b>${pct.toFixed(1)}%</b> del monto original ${pct>=25?"(≥ 25% → adenda)":"(< 25% → acta de aumento)"}. Acumulado: <b>${pctAcum.toFixed(1)}%</b> (límite 50%).`:"Todo cambio de plazo se formaliza mediante <b>adenda</b>, sin importar el monto."}</div>`;
      genBtn.disabled=false;
    }
    o._data={v,informe,instrumento,pct,pctAcum,blocked};
  }
  radios.forEach(r=>r.onchange=()=>{o.querySelectorAll(".radio").forEach(l=>l.classList.remove("sel"));r.closest(".radio").classList.add("sel");route();});
  inc.oninput=route;route();
  $("#cancel",o).onclick=()=>closeModal(o);
  $("#gen",o).onclick=async()=>{
    const just=$("#just",o).value.trim(),d=o._data;
    if(d.blocked)return;
    if(d.v==="monto"&&!(parseFloat(inc.value)>0)){alert("Ingresa el valor del incremento.");return;}
    if(d.v!=="monto"&&!$("#plazoTxt",o).value.trim()){alert("Indica el plazo adicional o la nueva fecha.");return;}
    let titulo;
    if(d.v==="monto"){
      const inc_v=parseFloat(inc.value)||0,montoOriginal=c.monto||0,montoTotal=montoOriginal+inc_v;
      const M=manualDocx;
      const data={contratoNro:c.nro,objeto:c.detalle||"",proveedor:c.proveedor||"",
        proveedorRuc:$("#rucM",o).value.trim()||M("RUC del proveedor"),
        ac:c.ac||"",area:c.area||"",siglas:$("#siglas",o).value.trim()||M("siglas del área"),
        fecha:longDate(todayISO()),fechaContrato:longDate(c.firma),
        fechaReprog:$("#fechaReprog",o).value?longDate($("#fechaReprog",o).value):M("fecha de reprogramación PAG"),
        partida:$("#partida",o).value.trim()||M("código de partida"),
        lineaNombre:$("#lineaNombre",o).value.trim()||M("nombre de la línea PAG"),
        montoOriginal:money(montoOriginal).replace("$",""),montoOriginalLetras:montoEnLetras(montoOriginal),
        montoAumento:money(inc_v).replace("$",""),montoAumentoLetras:montoEnLetras(inc_v),
        montoTotal:money(montoTotal).replace("$",""),montoTotalLetras:montoEnLetras(montoTotal)};
      titulo="Informe de aumento de monto (FAP-2026-11)";
      try{await generarDocx("14_Informe_adenda.docx",data,`BORRADOR_Informe_aumento_monto_${cleanNro(c.nro)}`);}
      catch(err){alert("No se pudo generar el documento: "+err.message);return;}
      logAdd("📄",`Borrador de ${titulo} generado (+${money(inc_v)}, ${d.pct.toFixed(1)}%)`,c.nro);
    }else{
      if(!just){alert("Ingresa la justificación.");return;}
      titulo="Informe de justificación de adenda (formato provisional)";
      const html=informeAdendaHTML(c,{plazoTxt:$("#plazoTxt",o).value.trim(),just,instrumento:d.instrumento});
      downloadHTMLDoc(`BORRADOR_Informe_adenda_${cleanNro(c.nro)}`,html);
      logAdd("📄",`Borrador de informe de adenda de plazo generado`,c.nro);
    }
    ov(c).pendienteEnvio={tipoEnvio:titulo,instrumento:d.instrumento};saveCLM();
    pasosSiguientes(o,c,titulo,d.instrumento);
    toast("Borrador generado · "+titulo);
  };
}

function downloadHTMLDoc(filename,htmlBody){
  const blob=new Blob(["\uFEFF",htmlBody],{type:"application/msword"});

/* --- Calificar proveedor (FO-AD-ABC-017) --- */
function modalCalificar(c){
  const GRUPOS=[
    {nombre:"Calidad del producto / servicio",w:0.40,items:[
      "Conformidad con las especificaciones técnicas del contrato o solicitud de cotización",
      "Ausencia de defectos, fallas o incumplimientos durante la ejecución",
      "Calidad uniforme a lo largo de toda la vigencia contractual",
      "Conducta del proveedor en las instalaciones del área protegida (si no aplica, asignar 3)"]},
    {nombre:"Cumplimiento de plazo",w:0.30,items:[
      "Cumplimiento de las fechas de entrega o prestación del bien/servicio",
      "Continuidad en la entrega o prestación sin interrupciones no justificadas",
      "Cumplimiento del plazo total del contrato sin extensiones atribuibles al proveedor"]},
    {nombre:"Atención y soporte",w:0.05,items:[
      "Respuesta ante requerimientos, consultas o incidencias del administrador/a",
      "Comunicación proactiva ante inconvenientes o cambios que afecten la entrega",
      "Atención y resolución de observaciones formuladas por el administrador/a"]},
    {nombre:"Cumplimiento contractual",w:0.25,items:[
      "Entrega oportuna y completa de documentación de respaldo (facturas, informes, actas, etc.)",
      "Vigencia de garantías técnicas, pólizas u obligaciones formales (si no aplica, asignar 3)",
      "Cumplimiento de obligaciones formales asociadas al contrato (tributos, IESS, permisos, etc.)"]}
  ];
  const vals=GRUPOS.map(g=>g.items.map(()=>3));
  const o=openModal(`
    <h2>Calificación del proveedor</h2>
    <p class="sub">${esc(c.proveedor||"—")} · ${esc(c.nro)} · FO-AD-ABC-017 · escala 0–3</p>
    <div class="note" style="margin:6px 0 4px">0 = no cumple · 1 = cumple parcialmente · 2 = cumple · 3 = cumple plenamente</div>
    ${GRUPOS.map((g,gi)=>`<div style="margin-top:13px">
      <div style="font-weight:700;color:var(--navy);font-size:13px;border-bottom:1px solid var(--line2);padding-bottom:5px;margin-bottom:8px">${esc(g.nombre)} — ${(g.w*100)}%</div>
      ${g.items.map((txt,ii)=>`<div class="crit">
        <div style="font-size:12px;line-height:1.45;margin-bottom:5px">${esc(txt)}</div>
        <div style="display:flex;gap:6px">${[0,1,2,3].map(v=>`<button class="chip scorebtn ${v===3?"on":""}" data-g="${gi}" data-i="${ii}" data-v="${v}" style="flex:1;text-align:center;padding:5px 4px;font-size:12px">${v}</button>`).join("")}</div>
      </div>`).join("")}
    </div>`).join("")}
    <div class="scorebox"><div><div class="lab">Calificación final</div><div class="big" id="score" style="color:var(--navy)">—</div></div><div id="semwrap"></div></div>
    <div id="conseq" style="font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:11px"></div>
    <div class="modal-foot"><button class="btn line" id="cancel">Cancelar</button><button class="btn" id="gen">Registrar y exportar</button></div>`);
  function tier(s){
    if(s>=90)return {sem:"Confiable (Preferente)",bg:"var(--greenbg)",fg:"var(--green)",elegible:true,cons:"Proveedor confiable. Elegible para procesos ágiles y futuras contrataciones sin observaciones."};
    if(s>=80)return {sem:"Satisfactorio",bg:"var(--greenbg)",fg:"var(--green)",elegible:true,cons:"Proveedor satisfactorio. Elegible para futuras contrataciones."};
    if(s>=70)return {sem:"Aceptable – Observado",bg:"var(--amberbg)",fg:"var(--amber)",elegible:true,cons:"Debe notificarse al proveedor respecto a las observaciones. En caso de repetición, actualizar la calificación de inmediato."};
    if(s>=60)return {sem:"Deficiente – Inaceptable",bg:"var(--redbg)",fg:"var(--red)",elegible:false,cons:"No se considerará en próximos procesos de contratación."};
    return {sem:"No recomendado",bg:"var(--redbg)",fg:"var(--red)",elegible:false,cons:"Se subirá al sistema de FIAS como un proveedor no recomendado."};
  }
  function calc(){
    let total=0;
    const aportes=GRUPOS.map((g,gi)=>{
      const suma=vals[gi].reduce((a,b)=>a+b,0),max=g.items.length*3;
      const aporte=suma/max*g.w*100;total+=aporte;
      return {nombre:g.nombre,aporte};
    });
    total=Math.round(total*100)/100;
    const t=tier(total);
    $("#score",o).textContent=total.toFixed(2);
    $("#semwrap",o).innerHTML=`<span class="semaforo" style="background:${t.bg};color:${t.fg}">${esc(t.sem)}</span>`;
    $("#conseq",o).innerHTML=`<b>Consecuencia:</b> ${esc(t.cons)}${total<70?" · <b>No elegible</b> (mínimo aprobatorio: 70/100).":""}`;
    o._score=total;o._t=t;o._aportes=aportes;
  }
  o.querySelectorAll(".scorebtn").forEach(b=>b.onclick=()=>{
    const g=+b.dataset.g,i=+b.dataset.i;vals[g][i]=+b.dataset.v;
    o.querySelectorAll(`.scorebtn[data-g="${g}"][data-i="${i}"]`).forEach(x=>x.classList.toggle("on",x===b));
    calc();
  });
  calc();
  $("#cancel",o).onclick=()=>closeModal(o);
  $("#gen",o).onclick=()=>{
    const O=ov(c);O.evaluado=true;O.score=o._score.toFixed(2);O.sem=o._t.sem;saveCLM();
    const BOM="\uFEFF",ap=o._aportes;
    const csv=BOM+[
      ["Nro. Contrato","Nombre Proveedor","Área Protegida","Categoría","Administrador/a AC","Fecha Evaluación","Calidad (40%)","Plazo (30%)","Atención (5%)","Cump. Contractual (25%)","PUNTAJE TOTAL","RESULTADO","Elegible Futuros Proc.","Observaciones"].join(";"),
      [c.nro,c.proveedor||"",c.area||"",c.cat||"",c.ac||"",todayISO(),
       ...ap.map(a=>String(a.aporte.toFixed(2)).replace(".",",")),
       String(o._score.toFixed(2)).replace(".",","),o._t.sem,o._t.elegible?"Sí":"No",""].join(";")
    ].join("\r\n");
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`Calificacion_${cleanNro(c.nro)}.csv`;a.click();URL.revokeObjectURL(a.href);
    logAdd("⭐",`Proveedor calificado: ${o._score.toFixed(2)}/100 · ${o._t.sem}`,c.nro);
    o.querySelector(".modal").innerHTML=`
      <h2>✅ Calificación registrada</h2>
      <p class="sub">${esc(c.proveedor||"—")} · ${o._score.toFixed(2)}/100 · ${esc(o._t.sem)}</p>
      <div class="steps"><h3>Próximos pasos</h3><ol>
        <li>Se descargó el <b>CSV</b> con la fila de calificación.</li>
        <li>Pégala en <b>"Registro de Calificaciones"</b> (banco acumulativo) y en la <b>Base de proveedores FAP</b>.</li>
        ${!o._t.elegible?"<li><b>Proveedor no elegible</b> — repórtalo también a la Unidad Operativa.</li>":""}
      </ol></div>
      <div class="modal-foot"><button class="btn" id="okpasos">Entendido</button></div>`;
    $("#okpasos",o).onclick=()=>{closeModal(o);render();};
    toast(`Proveedor calificado · ${o._score.toFixed(2)}/100`);
  };
}

function fileToB64(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>res(String(fr.result).split(",")[1]||"");
    fr.onerror=()=>rej(fr.error||new Error("lectura"));
    fr.readAsDataURL(file);
  });
}

      tipoProceso:ctx.tipoEnvio||"",nombreProceso:(c.nro||"")+" – "+(c.detalle||""),
      tipoEnvio:ctx.tipoEnvio||"",instrumento:ctx.instrumento||"",
      proveedor:val("uoProveedor"),monto:val("uoMonto"),objeto:val("uoObjeto"),observaciones:val("uoObs"),
      nombreCarpeta:String((c.nro||"contrato")+"_"+(ctx.tipoEnvio||"envio")).replace(/[\\/:*?"<>|\s]+/g,"_"),
      fecha:new Date().toISOString()};
    setS(`Preparando ${files.length} archivo(s)…`,"var(--navy)");
    try{
      const archivos=await Promise.all([...files].map(fl=>fileToB64(fl).then(b=>({nombre:fl.name,tipo:fl.type||"application/octet-stream",tamanio:fl.size,contenido:b}))));
      const payload=Object.assign({},meta,{archivos});
      if(!FLOW_DOCS_URL){setS("Envío preparado. Falta configurar la URL del flujo.","var(--amber)");return;}
      setS("Enviando a la Unidad Operativa…","var(--navy)");
      const r=await fetch(FLOW_DOCS_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      if(!r.ok)throw new Error("HTTP "+r.status);
      ov(c).pendienteEnvio=null;saveCLM();
      logAdd("📤",`Enviado a la Unidad Operativa: ${ctx.tipoEnvio} (${archivos.length} archivo/s)`,c.nro);
      setS(`✓ Enviado. Se subieron ${archivos.length} archivo(s).`);
      toast("Enviado a la Unidad Operativa.");
      setTimeout(()=>{closeModal(o);render();},900);
    }catch(e){setS("No se pudo enviar ("+((e&&e.message)||"error")+"). Revisa la conexión.","var(--red)");}
  };
}

/* ================= VISTA: SOLICITUDES (intake precontractual) ================= */
function estadoSolLabel(e){return {borrador:"Borrador",magica:"En La Mágica",uo:"En la Unidad Operativa",listo:"Formalizado"}[e]||e;}
function viaSolicitud(s){ /* regla de La Mágica: garantías o plazo > 30 días → contrato */
  return (s.garantias||Number(s.plazo)>30)?"contrato":"orden";
}
function vSolicitudes(){
  const sols=mySolicitudes();
  const grupos=[["borrador","Borradores","var(--muted2)"],["magica","En La Mágica","var(--navy)"],["uo","En la Unidad Operativa","var(--violet)"],["listo","Formalizados",'var(--green)']];
  $("#view").innerHTML=`<div class="up">
    <div class="toolbar">
      <div style="flex:1"><p class="psub" style="margin:0">La fase de <b>intake</b> del CLM: registra la necesidad, la regla oficial decide la vía (orden de compra/servicio u obligación de contrato) y desde aquí saltas a <b>La Mágica</b> para generar los documentos del proceso.</p></div>
      <button class="btn" id="nueva">+ Nueva solicitud</button>
    </div>
    ${sols.length?grupos.map(([k,label,col])=>{
      const items=sols.filter(s=>s.estado===k);
      if(!items.length)return "";
      return `<div class="panel" style="margin-bottom:13px">
        <p class="ptitle"><span style="color:${col}">●</span> ${label} <span style="color:var(--muted);font-weight:600">· ${items.length}</span></p>
        ${items.map(s=>`<div class="alert-row" style="margin-bottom:8px">
          <div class="aic" style="background:${s.via==="contrato"?"#EFE6FA":"var(--tint)"}">${s.via==="contrato"?"📑":"🧾"}</div>
          <div style="min-width:0;flex:1"><div class="at">${esc(s.objeto)}</div>
            <div class="ad">${esc(s.area)} · ${esc(s.tipoBS==="bien"?"Bien":"Servicio")} · ${money0(s.monto)} · plazo ${esc(s.plazo)}d ${s.garantias?"· con garantías":""} — vía <b>${s.via==="contrato"?"CONTRATO (Unidad Operativa)":"orden de compra/servicio"}</b></div></div>
          <div style="display:flex;gap:7px;flex:0 0 auto">
            ${k==="borrador"?`<button class="btn sm" data-mv="magica" data-id="${s.id}">Iniciar en La Mágica</button>`:""}
            ${k==="magica"&&s.via==="contrato"?`<button class="btn sm" data-mv="uo" data-id="${s.id}">Marcar enviado a UO</button>`:""}
            ${(k==="magica"&&s.via!=="contrato")||k==="uo"?`<button class="btn sm" data-mv="listo" data-id="${s.id}">Marcar formalizado</button>`:""}
            <button class="btn sm line" data-del="${s.id}" title="Eliminar">✕</button>
          </div>
        </div>`).join("")}
      </div>`;
    }).join(""):`<div class="empty"><div style="font-weight:700;color:var(--ink);font-size:15px">Sin solicitudes todavía</div><div style="font-size:13px;margin-top:4px">Registra la primera necesidad de contratación del área.</div></div>`}
  </div>`;
  $("#nueva").onclick=modalNuevaSolicitud;
  $("#view").querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{
    const s=CLM.solicitudes.find(x=>x.id===b.dataset.id);if(!s)return;
    s.estado=b.dataset.mv;saveCLM();
    logAdd(s.estado==="listo"?"✅":"➡️",`Solicitud «${s.objeto.slice(0,40)}» → ${estadoSolLabel(s.estado)}`);
    if(b.dataset.mv==="magica")go("magica");else vSolicitudes();
    toast("Solicitud actualizada");
  });
  $("#view").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    if(!confirm("¿Eliminar esta solicitud?"))return;
    CLM.solicitudes=CLM.solicitudes.filter(x=>x.id!==b.dataset.del);saveCLM();vSolicitudes();
  });
}
function modalNuevaSolicitud(){
  const areas=[...new Set(CONTRACTS.map(c=>c.area).filter(Boolean))].sort();
  const o=openModal(`
    <h2>Nueva solicitud de contratación</h2>
    <p class="sub">Fase de intake. Con plazo y garantías, la regla oficial decide la vía del proceso.</p>
    <div class="frow"><label>Área protegida</label><select id="sArea">${areas.map(a=>`<option ${SES.rol==="area"&&SES.user===a?"selected":""}>${esc(a)}</option>`).join("")}</select></div>
    <div class="frow"><label>Objeto de la contratación</label><input id="sObj" placeholder="Ej.: Servicio de mantenimiento de senderos 2026"></div>
    <div class="frow2">
      <div class="frow"><label>Tipo</label><select id="sTipo"><option value="servicio">Servicio</option><option value="bien">Bien</option></select></div>
      <div class="frow"><label>Presupuesto referencial (USD)</label><input id="sMonto" type="number" min="0" step="0.01" placeholder="0.00"></div>
    </div>
    <div class="frow2">
      <div class="frow"><label>Plazo estimado (días)</label><input id="sPlazo" type="number" min="1" value="30"></div>
      <div class="frow"><label>Garantías</label><select id="sGar"><option value="no">No requiere</option><option value="si">Anticipo / fiel cumplimiento</option></select></div>
    </div>
    <div id="sRoute"></div>
    <div class="modal-foot"><button class="btn line" id="cancel">Cancelar</button><button class="btn" id="okS">Registrar solicitud</button></div>`);
  function route(){
    const plazo=Number($("#sPlazo",o).value)||0,gar=$("#sGar",o).value==="si";
    const contrato=gar||plazo>30;
    $("#sRoute",o).innerHTML=`<div class="routebox ${contrato?"route-adenda":"route-acta"}">
      ${contrato?`<b>Vía: CONTRATO.</b> ${gar?"Requiere garantías":"El plazo supera los 30 días"} → el proceso no se resuelve con orden de compra/servicio. Se prepara el expediente en La Mágica y se envía a la <b>Unidad Operativa</b> para elaboración legal.`:
      `<b>Vía: orden de compra / orden de servicio.</b> Sin garantías y plazo ≤ 30 días → se resuelve directamente en <b>La Mágica</b> (momentos 1–4).`}</div>`;
  }
  $("#sPlazo",o).oninput=route;$("#sGar",o).onchange=route;route();
  $("#cancel",o).onclick=()=>closeModal(o);
  $("#okS",o).onclick=()=>{
    const s={id:"s"+Date.now(),fecha:todayISO(),area:$("#sArea",o).value,objeto:$("#sObj",o).value.trim(),
      tipoBS:$("#sTipo",o).value,monto:parseFloat($("#sMonto",o).value)||0,
      plazo:Number($("#sPlazo",o).value)||0,garantias:$("#sGar",o).value==="si",
      estado:"borrador",owner:SES.user,ac:SES.rol==="ac"?SES.user:""};
    if(!s.objeto){alert("Describe el objeto de la contratación.");return;}
    s.via=viaSolicitud(s);
    CLM.solicitudes.unshift(s);saveCLM();
    logAdd("🆕",`Solicitud registrada: «${s.objeto.slice(0,50)}» (vía ${s.via==="contrato"?"contrato":"orden"})`);
    closeModal(o);vSolicitudes();toast("Solicitud registrada");
  };
}

/* ================= VISTA: REPORTES ================= */
function vReportes(){
  const mine=myContracts();
  function agg(keyFn){
    const m={};
    mine.forEach(c=>{const k=keyFn(c)||"—";
      if(!m[k])m[k]={n:0,monto:0,ven:0};
      m[k].n++;m[k].monto+=montoDe(c);
      if(statusLive(c).key==="vencido")m[k].ven++;});
    return Object.entries(m).sort((a,b)=>b[1].monto-a[1].monto);
  }
  const total=mine.reduce((a,c)=>a+montoDe(c),0);
  const porCat=agg(c=>c.cat),porArea=agg(c=>c.area),porAC=agg(c=>c.ac);
  const tbl=(rows,label)=>`<div class="tablewrap"><table class="list" style="min-width:0">
    <thead><tr><th>${label}</th><th style="text-align:right">Contratos</th><th style="text-align:right">Monto</th><th style="text-align:right">% del total</th></tr></thead>
    <tbody>${rows.map(([k,v])=>`<tr style="cursor:default"><td style="font-weight:600">${esc(k)}</td><td style="text-align:right">${v.n}</td><td style="text-align:right;white-space:nowrap">${money(v.monto)}</td><td style="text-align:right">${total?(v.monto/total*100).toFixed(1):0}%</td></tr>`).join("")}</tbody></table></div>`;
  $("#view").innerHTML=`<div class="up">
    <div class="toolbar">
      <div style="flex:1"><p class="psub" style="margin:0">Analítica del portafolio ${SES.rol==="uo"?"completo":"asignado"} · ${mine.length} contratos · ${money(total)} en total.</p></div>
      <button class="btn line sm" id="expCsv">⬇ Exportar CSV del portafolio</button>
    </div>
    <div class="charts">
      <div class="panel"><p class="ptitle">Monto por categoría</p><p class="psub">valor total vigente por tipo de gasto</p>
        ${barChartH(porCat.slice(0,10).map(([label,v])=>({label,value:v.monto,tip:`<b>${esc(label)}</b><br>${v.n} contrato(s) · ${money(v.monto)}`})),v=>moneyShort(v))}</div>
      <div class="panel"><p class="ptitle">Monto por área protegida</p><p class="psub">top 10 de ${porArea.length} áreas</p>
        ${barChartH(porArea.slice(0,10).map(([label,v])=>({label,value:v.monto,tip:`<b>${esc(label)}</b><br>${v.n} contrato(s) · ${money(v.monto)}`})),v=>moneyShort(v))}</div>
    </div>
    <div class="charts" style="grid-template-columns:1fr 1fr">
      <div><p class="ptitle" style="margin:6px 0 8px">Resumen por categoría</p>${tbl(porCat,"Categoría")}</div>
      <div><p class="ptitle" style="margin:6px 0 8px">Resumen por AC</p>${tbl(porAC.slice(0,15),"Administradora")}</div>
    </div>
  </div>`;
  $("#expCsv").onclick=()=>{
    const BOM="\uFEFF";
    const head=["Nro","Objeto","Area","Categoria","Proveedor","AC","Monto original","Monto vigente","Inicio","Firma","Fin","Estado","Adenda","Calificacion"];
    const rows=mine.map(c=>{const o=ov(c);return [c.nro,c.detalle,c.area,c.cat,c.proveedor,c.ac,c.monto,montoDe(c),c.inicio,c.firma,c.fin,statusLive(c).label,tieneAdenda(c)?(c.tipoAdenda||"Sí"):"No",o.evaluado?o.score:""].map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(";");});
    const blob=new Blob([BOM+[head.join(";")].concat(rows).join("\r\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Portafolio_CLM_FAP_"+todayISO()+".csv";a.click();URL.revokeObjectURL(a.href);
    logAdd("⬇️","Exportación CSV del portafolio");
    toast("CSV del portafolio exportado");
  };
}

/* Variantes de escritura que aparecen en el Excel maestro y que designan la
   misma área (tildes, espacios dobles, sectores, «marina/marino costera»). */
const AREA_ALIAS={
  "parque nacional podocarpus sector bombuscaro":"Parque Nacional Podocarpus",
  "parque nacional rio negro sopladora":"Parque Nacional Río Negro Sopladora Tinajillas Río Gualaceño",
  "reserva de produccion de fauna marina costera puntilla santa elena":"Reserva de Producción de Fauna Marino Costera Puntilla Santa Elena",
  "reserva de produccion de fauna marino costera puntilla de santa elena":"Reserva de Producción de Fauna Marino Costera Puntilla Santa Elena",
  "refugio de vida silvestre manglares estuario rio esmeraldas":"Refugio de Vida Silvestre Estuario Río Esmeraldas",
  /* Recategorizadas de Reserva Ecológica a Parque Nacional; el Excel aún trae
     el nombre antiguo en registros de años anteriores. */
  "reserva ecologica cayambe coca":"Parque Nacional Cayambe Coca",
  "reserva ecologica cotacachi cayapas":"Parque Nacional Cotacachi Cayapas",
  "reserva ecologica antisana":"Parque Nacional Antisana"
};

/* Clave de comparación: sin tildes, sin mayúsculas, sin signos ni espacios
   repetidos. Así «El Condor», «El Cóndor» y «El  Cóndor » son la misma clave. */
function areaKey(s){
  return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
}
const GEO_IX=(()=>{
  const m={};
  AREAS_GEO.forEach(a=>{m[areaKey(a.n)]=a;});
  Object.keys(AREA_ALIAS).forEach(k=>{const t=m[areaKey(AREA_ALIAS[k])];if(t)m[k]=t;});
  return m;
})();
function geoDe(area){return GEO_IX[areaKey(area)]||null;}

/* Unifica la escritura del área en toda la base al entrar: el repositorio, los
   filtros, el buscador y los reportes pasan a hablar de una sola «Reserva
   Biológica El Cóndor» en vez de dos. Se conserva el texto original del Excel. */
function canonAreas(list){
  (list||[]).forEach(c=>{
    const g=geoDe(c.area);
    if(g&&c.area!==g.n){c.areaOriginal=c.area;c.area=g.n;}
  });
}

function prjXY(lat,lon){
  const V=MAP_VIEW;
  return [(lon-V.lon0)/(V.lon1-V.lon0)*V.w,(V.lat1-lat)/(V.lat1-V.lat0)*V.h];
}
/* Siglas oficiales que ya usa el equipo (PNC, REMACAM, RVS…) para las etiquetas. */
function apCorto(n){
  return String(n)
    .replace(/^Parque Nacional\s+/i,"PN ")
    .replace(/^Reserva Ecológica\s+/i,"RE ")
    .replace(/^Reserva Biológica\s+/i,"RB ")
    .replace(/^Reserva Marina\s+/i,"RM ")
    .replace(/^Reserva Geobotánica\s+/i,"RG ")
    .replace(/^Reserva de Producción de Fauna\s+/i,"RPF ")
    .replace(/^Refugio de Vida Silvestre\s+/i,"RVS ")
    .replace(/^Área Nacional de Recreación\s+/i,"ANR ")
    .replace(/^Dirección de Áreas Protegidas.*$/i,"DAPOFC (Quito)");
}

/* ================= VISTA: MAPA ================= */
let MAPST={metric:"monto",sel:null};

/* Agrupa los contratos del rol por área y les cuelga su punto en el mapa. */
function mapAgg(){
  const m=new Map();
  myContracts().forEach(c=>{
    const key=String(c.area||"").trim()||"—";
    if(!m.has(key))m.set(key,{n:key,g:geoDe(key),items:[],monto:0,ven:0,avi:0,act:0});
    const e=m.get(key);
    e.items.push(c);e.monto+=montoDe(c);
    const k=statusLive(c).key;
    if(k==="vencido")e.ven++;else if(k==="aviso")e.avi++;else if(k==="vigente")e.act++;
  });
  return [...m.values()].sort((a,b)=>mapVal(b)-mapVal(a)||b.monto-a.monto);
}
const mapVal=(e)=>MAPST.metric==="monto"?e.monto:e.items.length;
const mapFmt=(v)=>MAPST.metric==="monto"?moneyShort(v):v+(v===1?" contrato":" contratos");
function mapColor(e){
  if(e.ven)return "var(--red)";
  if(e.avi)return "var(--amber)";
  if(e.act)return "var(--navy2)";
  return "var(--muted2)";
}

function vMapa(){
  const grupos=mapAgg();
  const ubicados=grupos.filter(e=>e.g),sinUbicar=grupos.filter(e=>!e.g);
  const nSede=ubicados.filter(e=>e.g.sede).length,nAp=ubicados.length-nSede;
  const total=grupos.reduce((a,e)=>a+e.monto,0);
  const maxV=Math.max(1,...ubicados.map(mapVal));
  const R_MIN=11,R_MAX=52;

  // Símbolos proporcionales: el ÁREA del círculo crece con el valor (r ∝ √v),
  // que es como el ojo compara círculos. Los grandes se dibujan primero para
  // que los pequeños queden encima y sigan siendo clicables.
  const pts=ubicados.map(e=>{
    const [x,y]=prjXY(e.g.lat,e.g.lon),v=mapVal(e);
    return {e,x,y,v,r:e.g.sede?13:Math.max(R_MIN,R_MAX*Math.sqrt(v/maxV))};
  }).sort((a,b)=>b.r-a.r);

  // Con un área seleccionada el resto se atenúa y la elegida recibe un aro,
  // para que se vea de un golpe a qué punto corresponde el panel de al lado.
  const marcas=pts.map(p=>{
    const dim=MAPST.sel&&MAPST.sel!==p.e.n?" dim":"";
    const tip=`<b>${esc(p.e.n)}</b><br>${p.e.items.length} contrato(s) · ${money0(p.e.monto)}`
      +(p.e.ven?`<br>${p.e.ven} vencido(s)`:"")+(p.e.avi?`<br>${p.e.avi} por vencer`:"");
    if(p.e.g.sede)return `<rect class="map-sede${dim}" x="${(p.x-11).toFixed(1)}" y="${(p.y-11).toFixed(1)}" width="22" height="22" rx="6" fill="var(--violet)" data-ap="${esc(p.e.n)}" data-tip="${esc(tip)}"/>`;
    return `<circle class="map-pt${dim}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r.toFixed(1)}" fill="${mapColor(p.e)}" fill-opacity=".82" data-ap="${esc(p.e.n)}" data-tip="${esc(tip)}"/>`;
  }).join("");
  const elegido=pts.find(p=>p.e.n===MAPST.sel);
  const aro=elegido?`<circle class="map-halo" cx="${elegido.x.toFixed(1)}" cy="${elegido.y.toFixed(1)}" r="${(Math.max(elegido.r,13)+9).toFixed(1)}"/>`:"";

  // Etiquetas: se rotulan de mayor a menor las que caben sin pisar otra
  // etiqueta ni otro marcador. Las que no caben viven en la lista de al lado.
  // El área seleccionada se rotula siempre: va primera en la cola de etiquetas.
  const puestas=[],etiquetas=[];
  pts.slice().sort((a,b)=>(b.e.n===MAPST.sel)-(a.e.n===MAPST.sel)||b.v-a.v).forEach(p=>{
    if(etiquetas.length>=11)return;
    const t=apCorto(p.e.n),w=t.length*7.4,h=17;
    const cand=[[p.x+p.r+7,p.y+5,"start"],[p.x-p.r-7,p.y+5,"end"],
                [p.x,p.y-p.r-8,"middle"],[p.x,p.y+p.r+18,"middle"]];
    for(const [x,y,anc] of cand){
      const bx=anc==="start"?x:anc==="end"?x-w:x-w/2;
      const box={x0:bx-2,y0:y-h+3,x1:bx+w+2,y1:y+5};
      if(box.x0<4||box.x1>MAP_VIEW.w-4||box.y0<4||box.y1>MAP_VIEW.h-4)continue;
      if(puestas.some(o=>!(box.x1<o.x0||box.x0>o.x1||box.y1<o.y0||box.y0>o.y1)))continue;
      if(pts.some(q=>q!==p&&q.x+q.r>box.x0&&q.x-q.r<box.x1&&q.y+q.r>box.y0&&q.y-q.r<box.y1))continue;
      puestas.push(box);
      const dim=MAPST.sel&&MAPST.sel!==p.e.n?' opacity=".35"':"";
      etiquetas.push(`<text class="map-lbl" x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${anc}"${dim}>${esc(t)}</text>`);
      break;
    }
  });

  const leyenda=[["var(--navy2)","Al día"],["var(--amber)","Con contratos por vencer"],
                 ["var(--red)","Con contratos vencidos"],["var(--violet)","Oficina (no es área protegida)"]]
    .map(([c,t])=>`<span class="li"><span class="sw" style="background:${c};border-radius:50%">&nbsp;</span>${t}</span>`).join("");

  $("#view").innerHTML=`<div class="up">
    <div class="toolbar">
      <div style="flex:1"><p class="psub" style="margin:0">${nAp} área${nAp===1?"":"s"} protegida${nAp===1?"":"s"} en el mapa${nSede?" + la DAPOFC (Quito)":""} · ${grupos.reduce((a,e)=>a+e.items.length,0)} contratos · ${money(total)}. El tamaño del círculo es ${MAPST.metric==="monto"?"el monto vigente":"el número de contratos"}; el color, el estado más urgente del área.</p></div>
      <div class="viewtog">
        <button data-metric="monto" class="${MAPST.metric==="monto"?"on":""}">Monto</button>
        <button data-metric="n" class="${MAPST.metric==="n"?"on":""}">N.º de contratos</button>
      </div>
      <button class="btn line sm" id="expMapa">⬇ CSV por área</button>
    </div>

    <div class="maplayout">
      <div>
        <div class="mapbox">
          <svg class="map-svg" viewBox="0 0 ${MAP_VIEW.w} ${MAP_VIEW.h}" role="img"
               aria-label="Mapa del Ecuador con las áreas protegidas que tienen contratos del FAP">
            <rect width="${MAP_VIEW.w}" height="${MAP_VIEW.h}" fill="#DDE7F2" id="mapbg"/>
            <path class="map-nb" d="${MAP_PATHS.co}"/>
            <path class="map-nb" d="${MAP_PATHS.pe}"/>
            <path class="map-ec" d="${MAP_PATHS.ec}"/>
            ${marcas}${aro}${etiquetas.join("")}
          </svg>
          <div class="map-note">Puntos referenciales de cada área · Ecuador continental</div>
        </div>
        <div class="legend" style="margin-top:12px">${leyenda}</div>
        ${sinUbicar.length?`<p class="psub" style="margin-top:12px">Sin ubicación en el catálogo (${sinUbicar.length}): ${sinUbicar.map(e=>esc(e.n)+" · "+money0(e.monto)).join(" · ")}.</p>`:""}
      </div>
      <div class="panel" id="apPanel"></div>
    </div>
  </div>`;

  pintaPanelAP(grupos);
  $("#view").querySelectorAll("[data-metric]").forEach(b=>b.onclick=()=>{MAPST.metric=b.dataset.metric;vMapa();});
  $("#view").querySelectorAll("[data-ap]").forEach(el=>el.onclick=()=>{
    MAPST.sel=MAPST.sel===el.dataset.ap?null:el.dataset.ap;vMapa();
  });
  const bg=$("#mapbg");if(bg)bg.onclick=()=>{if(MAPST.sel){MAPST.sel=null;vMapa();}};
  $("#expMapa").onclick=()=>{
    const BOM="\uFEFF";
    const head=["Area","Contratos","Monto vigente","Vencidos","Por vencer","Latitud","Longitud"];
    const rows=grupos.map(e=>[e.n,e.items.length,e.monto.toFixed(2),e.ven,e.avi,
      e.g?e.g.lat:"",e.g?e.g.lon:""].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";"));
    const blob=new Blob([BOM+[head.join(";")].concat(rows).join("\r\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="Areas_protegidas_FAP_"+todayISO()+".csv";a.click();URL.revokeObjectURL(a.href);
    logAdd("🗺️","Exportación CSV por área protegida");
    toast("CSV por área exportado");
  };
}

/* Panel derecho: ranking de áreas, o el detalle del área seleccionada. */
function pintaPanelAP(grupos){
  const box=$("#apPanel");
  const sel=MAPST.sel?grupos.find(e=>e.n===MAPST.sel):null;

  if(!sel){
    const max=Math.max(1,...grupos.map(mapVal));
    box.innerHTML=`<p class="ptitle">Áreas por ${MAPST.metric==="monto"?"monto":"n.º de contratos"}</p>
      <p class="psub">Toca un área —aquí o en el mapa— para ver sus contratos.</p>
      <div class="aplist">${grupos.map((e,i)=>`
        <div class="aprow" data-sel="${esc(e.n)}">
          <div class="rk">${i+1}</div>
          <div class="nm">${esc(apCorto(e.n))}
            <small>${e.items.length} contrato${e.items.length===1?"":"s"}${e.ven?` · ${e.ven} vencido${e.ven===1?"":"s"}`:""}${e.g&&e.g.sede?" · oficina, no es área protegida":""}${!e.g?" · sin ubicación":""}</small>
            <div style="height:4px;border-radius:3px;background:var(--bg);margin-top:5px">
              <div style="height:100%;border-radius:3px;width:${Math.max(2,mapVal(e)/max*100).toFixed(0)}%;background:${mapColor(e)}"></div></div>
          </div>
          <div class="vl">${MAPST.metric==="monto"?moneyShort(e.monto):e.items.length}</div>
        </div>`).join("")}</div>`;
  }else{
    const lista=sel.items.slice().sort((a,b)=>montoDe(b)-montoDe(a));
    box.innerHTML=`<button class="chip" id="apBack" style="margin-bottom:12px">← Todas las áreas</button>
      <p class="ptitle">${esc(sel.n)}</p>
      <p class="psub">${sel.items.length} contrato${sel.items.length===1?"":"s"} · ${money(sel.monto)}${sel.g?` · ${sel.g.lat.toFixed(3)}, ${sel.g.lon.toFixed(3)}`:""}</p>
      <div class="aplist">${lista.map(c=>{
        const s=statusLive(c),i=CONTRACTS.indexOf(c);
        return `<button class="apc ${s.cls}" data-open="${i}">
          <div class="t">${esc(c.nro)}</div>
          <div class="o">${esc(trunc(c.detalle,110))}</div>
          <div class="m"><span>${esc(trunc(c.proveedor||"—",26))}</span><span>${money(montoDe(c))}</span></div>
          <div class="m" style="margin-top:3px"><span><span class="dot ${s.cls==="done"?"done":s.cls}"></span>${esc(vigenciaText(c))}</span><span>${esc(c.ac||"")}</span></div>
        </button>`;}).join("")}</div>`;
    $("#apBack").onclick=()=>{MAPST.sel=null;vMapa();};
    box.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>go("detalle",+b.dataset.open));
  }
  box.querySelectorAll("[data-sel]").forEach(r=>r.onclick=()=>{MAPST.sel=r.dataset.sel;vMapa();});
}

/* ================= VISTA: BITÁCORA ================= */
function vActividad(){
  $("#view").innerHTML=`<div class="up">
    <div class="toolbar">
      <div style="flex:1"><p class="psub" style="margin:0">Registro de auditoría del CLM: cada acción del equipo (documentos, terminaciones, calificaciones, envíos y notas) queda con autor y fecha. Se guarda en este navegador.</p></div>
      ${CLM.log.length?`<button class="btn line sm" id="expLog">⬇ Exportar bitácora</button>`:""}
    </div>
    <div class="panel">
      ${CLM.log.length?`<ul class="tl">${CLM.log.map(l=>`<li><div class="t">${esc(l.icon)} ${esc(l.txt)}${l.ref?` — <a href="#" data-ref="${esc(l.ref)}">${esc(l.ref)}</a>`:""}</div><div class="s">${esc(l.user)} · ${new Date(l.ts).toLocaleString("es-EC")}</div></li>`).join("")}</ul>`
      :`<div class="empty">Aún no hay actividad registrada.</div>`}
    </div>
  </div>`;
  $("#view").querySelectorAll("[data-ref]").forEach(a=>a.onclick=e=>{
    e.preventDefault();
    const i=CONTRACTS.findIndex(c=>c.nro===a.dataset.ref);
    if(i>=0)go("detalle",i);
  });
  const ex=$("#expLog");
  if(ex)ex.onclick=()=>{
    const BOM="\uFEFF";
    const rows=CLM.log.map(l=>[l.ts,l.user,l.txt,l.ref||""].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";"));
    const blob=new Blob([BOM+["Fecha;Usuario;Accion;Contrato"].concat(rows).join("\r\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Bitacora_CLM_"+todayISO()+".csv";a.click();URL.revokeObjectURL(a.href);
  };
}

/* ================= VISTA: HERRAMIENTAS EMBEBIDAS ================= */
function vFrame(src,notice){
  $("#view").innerHTML=`
    <div class="framebar"><span>🧩</span><span style="flex:1">${esc(notice)}</span><a class="btn sm line" href="${esc(src)}" target="_blank" rel="noopener">Abrir en pestaña propia ↗</a></div>
    <iframe class="toolframe" id="toolframe" src="${esc(src)}" title="Herramienta integrada"></iframe>`;
  /* Si la herramienta no carga (p. ej. el archivo del CLM se abrió suelto,
     fuera del sitio publicado), mostrar una explicación en vez de un recuadro roto.
     La Mágica pesa ~2 MB: mientras readyState sea "loading" hay que esperar, no juzgar. */
  let intentos=0;
  (function vigilarFrame(){
    const f=document.getElementById("toolframe");
    if(!f)return;
    let st=null,fallo=false;
    try{
      st=f.contentDocument?{rs:f.contentDocument.readyState,kids:f.contentDocument.body?f.contentDocument.body.children.length:0}:null;
    }catch(e){fallo=true;/* las herramientas son del mismo sitio: documento inaccesible = página de error del navegador */}
    if(st&&st.kids>0)return;                                   // cargó bien
    intentos++;
    /* documento nulo o inaccesible = página de error del navegador (las herramientas son del mismo sitio) */
    if(intentos>=4&&(fallo||!st||(st.rs!=="loading"&&st.kids===0))){
      f.outerHTML=`<div class="content"><div class="panel up" style="max-width:640px;margin:30px auto;text-align:center">
        <div style="font-size:38px;margin-bottom:10px">🔌</div>
        <p class="ptitle" style="font-size:16px">La herramienta no está disponible desde aquí</p>
        <p class="psub" style="max-width:460px;margin:0 auto 16px">Este archivo del CLM se abrió <b>fuera del sitio publicado</b>, y las herramientas integradas viven en carpetas vecinas del repositorio. En el sitio publicado en GitHub Pages este módulo carga completo, aquí mismo.</p>
        <a class="btn" href="${esc(src)}" target="_blank" rel="noopener">Intentar abrir en pestaña propia ↗</a>
      </div></div>`;
      return;
    }
    if(intentos<40)setTimeout(vigilarFrame,800);               // sigue cargando: paciencia
  })();
}

/* ================= ARRANQUE ================= */
loadCLM();
function aplicarHash(){
  const m=location.hash.match(/^#\/([a-z]+)(?:\/(\d+))?/);
  if(m&&VIEWS[m[1]]){ST.view=m[1];if(m[2]!=null)ST.cur=+m[2];}
}
async function entrarConSesion(){
  try{
    const d=await pedirMisContratos();
    CONTRACTS=d.contratos||[];
    canonAreas(CONTRACTS);
    dataSource={label:`En vivo · ${CONTRACTS.length} contratos`,live:true};
    setSes({rol:d.alcance==='todas'?'uo':d.alcance, user:msalCuenta.name||msalCuenta.username});
    YA_FILTRADO=true;
    logAdd("👤","Inicio de sesión (Microsoft)");
    aplicarHash();
    render();
  }catch(err){
    render();
    setTimeout(()=>alert(err.message||"No pude cargar tus contratos."),30);
  }
}
async function boot(){
  if(msalListo()){
    try{
      const cta=await msalIniciar();
      if(cta){ await entrarConSesion(); return; }
    }catch(e){ /* si algo falla, se cae a la pantalla de login normal */ }
  }
  if(!CONTRACTS.length)dataSource={label:"Sin datos disponibles",live:false};
  aplicarHash();
  render();
}
boot();
</script>

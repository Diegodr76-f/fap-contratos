<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planificador adaptativo · FAP</title>
<meta name="description" content="Planificación por rutas alternas: señales, disparadores y tiempos de preparación.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#00249C">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planificador">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- La tipografía se carga sin bloquear el pintado: si Google Fonts no responde
     —sin internet, en territorio o bloqueado por IT— la herramienta abre igual al
     instante, con la tipografía del sistema, en vez de quedarse en blanco. -->
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap"></noscript>
<style>
  :root{
    --ink:#0B153F; --texto:#252A3D; --tenue:#5A6072; --debil:#8B92A6;
    --azul:#00249C; --azul-claro:#EEF1FB; --papel:#F4F6FB; --tarjeta:#FFFFFF;
    --linea:#E2E6F2; --linea-fuerte:#C8CFE4;
    --ok:#1E7A4D; --ok-bg:#E4F2E9;
    --alerta:#B4690E; --alerta-bg:#FAF0DE;
    --critico:#B23B3B; --critico-bg:#FBEDED;
    --sombra:0 1px 2px rgba(11,21,63,.05), 0 8px 24px -12px rgba(11,21,63,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--papel); color:var(--texto);
    font-family:'Titillium Web',system-ui,-apple-system,'Segoe UI',sans-serif;
    font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .env{max-width:1180px; margin:0 auto; padding:0 22px}
  @media(max-width:820px){ .env{padding:0 14px} }
  main.env{padding-bottom:90px}
  [hidden]{display:none !important}

  /* ------------------------------------------------------------ cabecera */
  header{background:var(--tarjeta); border-bottom:1px solid var(--linea);
    position:sticky; top:0; z-index:40}
  header .env{padding-top:12px}
  .cab{display:flex; align-items:center; gap:13px; flex-wrap:wrap}
  .logo{width:36px; height:36px; border-radius:9px; background:var(--azul); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; flex:0 0 auto;
    font-size:13px; letter-spacing:.02em}
  .cab-tit{min-width:0}
  .cab-tit .eyebrow{font-size:10px; font-weight:700; letter-spacing:.13em;
    text-transform:uppercase; color:var(--azul)}
  .cab-tit b{display:block; font-size:15px; color:var(--ink); line-height:1.2;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46vw}
  .cab-acc{margin-left:auto; display:flex; align-items:center; gap:7px; flex-wrap:wrap}

  .riel{display:flex; gap:4px; margin-top:11px; overflow-x:auto; padding-bottom:2px}
  .paso{flex:1 1 0; min-width:104px; text-align:left; background:transparent; cursor:pointer;
    font-family:inherit; border:none; border-bottom:3px solid var(--linea);
    padding:7px 9px 8px; border-radius:7px 7px 0 0; position:relative;
    transition:background .16s, border-color .16s}
  .paso:hover{background:var(--azul-claro)}
  .paso:focus-visible{outline:2px solid var(--azul); outline-offset:-2px}
  .paso .pn{display:block; font-size:9.5px; font-weight:700; letter-spacing:.09em;
    color:var(--debil); text-transform:uppercase}
  .paso .pnom{display:block; font-size:13px; font-weight:700; color:var(--tenue); margin-top:2px;
    line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .paso[data-est="cerrada"]{border-bottom-color:var(--ok)}
  .paso[data-est="cerrada"] .pn{color:var(--ok)}
  .paso[data-est="curso"]{border-bottom-color:var(--azul)}
  .paso[data-est="curso"] .pn,.paso[data-est="curso"] .pnom{color:var(--azul)}
  .paso[aria-current="page"]{background:var(--azul-claro)}
  .paso[aria-current="page"] .pnom{color:var(--ink)}
  .paso .aguja{position:absolute; top:5px; right:6px; width:6px; height:6px; border-radius:50%;
    background:var(--critico)}

  .pulso{display:flex; border-top:1px solid var(--linea)}
  .pulso-i{flex:1 1 0; min-width:0; padding:8px 13px 9px; border-right:1px solid var(--linea);
    display:flex; align-items:baseline; gap:7px; min-height:42px}
  .pulso-i:first-child{padding-left:0}
  .pulso-i:last-child{border-right:none}
  .pulso-i b{font-size:18px; font-weight:700; color:var(--ink); line-height:1;
    font-variant-numeric:tabular-nums; letter-spacing:-.02em; white-space:nowrap}
  .pulso-i b.ok{color:var(--ok)} .pulso-i b.alerta{color:var(--alerta)}
  .pulso-i b.critico{color:var(--critico)}
  .pulso-i span{font-size:11px; color:var(--tenue); line-height:1.25; min-width:0;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  @media(max-width:820px){ .pulso{overflow-x:auto} .pulso-i{flex:0 0 auto} }

  /* ---------------------------------------------------------- tipografía */
  h1{font-size:clamp(23px,3.2vw,31px); line-height:1.11; font-weight:700; color:var(--ink);
    margin:0; letter-spacing:-.022em; text-wrap:balance}
  h2{font-size:19px; font-weight:700; color:var(--ink); margin:0; letter-spacing:-.012em}
  h3.grupo{font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:var(--debil); margin:22px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--linea)}
  h3.grupo:first-of-type{margin-top:0}
  section{padding-top:34px}
  .sec-cab{display:flex; align-items:baseline; gap:11px; flex-wrap:wrap; margin-bottom:5px}
  .cuenta{font-size:11.5px; font-weight:700; color:var(--debil); font-variant-numeric:tabular-nums}
  .sub{font-size:14.5px; color:var(--tenue); margin:0 0 17px; max-width:68ch; line-height:1.55}
  .lead{font-size:15.5px; color:var(--tenue); max-width:66ch; line-height:1.55; margin:11px 0 0}

  /* ------------------------------------------------------------- pantalla planes */
  .portada{padding:44px 0 0}
  .planes{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(290px,100%),1fr));
    gap:14px; margin-top:24px}
  .plan-c{background:var(--tarjeta); border:1px solid var(--linea); border-radius:13px;
    padding:18px 20px; box-shadow:var(--sombra); cursor:pointer; text-align:left;
    font-family:inherit; display:flex; flex-direction:column; gap:9px;
    transition:border-color .16s, transform .16s}
  .plan-c:hover{border-color:var(--azul); transform:translateY(-1px)}
  .plan-c:focus-visible{outline:2px solid var(--azul); outline-offset:2px}
  .plan-c .pt{font-size:16px; font-weight:700; color:var(--ink); line-height:1.28}
  .plan-c .pd{font-size:13px; color:var(--tenue); line-height:1.45}
  .plan-c .pm{display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-top:auto;
    padding-top:9px; border-top:1px solid var(--linea); font-size:11.5px; color:var(--debil)}
  .plan-c.nuevo{border-style:dashed; border-color:var(--linea-fuerte); box-shadow:none;
    align-items:center; justify-content:center; text-align:center; color:var(--azul);
    font-weight:700; min-height:132px}
  .plan-c.nuevo:hover{background:var(--azul-claro)}

  /* --------------------------------------------------------------- etapa */
  .et-cab{padding:28px 0 0}
  .et-eyebrow{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:6px}
  .et-num{font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
    color:var(--azul)}
  .et-acc{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; align-items:center}

  .estampa{font-size:10px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
    padding:3px 9px; border-radius:99px; white-space:nowrap}
  .estampa.cerrada{background:var(--ok-bg); color:var(--ok)}
  .estampa.curso{background:var(--azul-claro); color:var(--azul)}
  .estampa.pendiente{background:var(--linea); color:var(--tenue)}

  .narra{background:var(--tarjeta); border:1px solid var(--linea); border-radius:13px;
    padding:19px 22px; box-shadow:var(--sombra); margin-top:22px;
    display:grid; gap:16px; grid-template-columns:1fr 1fr}
  @media(max-width:800px){ .narra{grid-template-columns:1fr} }
  .rot{font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color:var(--debil); margin-bottom:5px}
  .narra p{margin:0; font-size:14.5px; line-height:1.6}
  .narra .dec p{font-size:14px}

  /* -------------------------------------------------------------- avisos */
  .avisos{display:grid; gap:8px; margin-top:20px}
  .aviso{border-radius:11px; padding:12px 16px; font-size:13.5px; line-height:1.5;
    display:flex; gap:10px; align-items:flex-start}
  .aviso.alerta{background:var(--alerta-bg); color:var(--alerta)}
  .aviso.critico{background:var(--critico-bg); color:var(--critico)}
  .aviso.ok{background:var(--ok-bg); color:var(--ok)}
  .aviso .ir{margin-left:auto; background:none; border:none; font-family:inherit; cursor:pointer;
    font-weight:700; font-size:12.5px; color:inherit; text-decoration:underline;
    white-space:nowrap; padding:0; flex:0 0 auto}
  .vacio{color:var(--debil); font-size:14px; background:var(--tarjeta);
    border:1px dashed var(--linea-fuerte); border-radius:12px; padding:24px 20px;
    text-align:center; line-height:1.5}

  /* ------------------------------------------------------------- señales */
  .senales{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));
    gap:13px}
  .sen{background:var(--tarjeta); border:1px solid var(--linea); border-radius:12px;
    padding:16px 18px; box-shadow:var(--sombra); border-left:4px solid var(--linea-fuerte);
    transition:border-left-color .25s}
  .sen.ok{border-left-color:var(--ok)}
  .sen.alerta{border-left-color:var(--alerta)}
  .sen.critico{border-left-color:var(--critico)}
  .sen.simulando{outline:2px dashed var(--azul); outline-offset:3px}
  .sen-cab{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .sen-nom{font-size:14.5px; font-weight:700; color:var(--ink); line-height:1.3}
  .chip{font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    padding:4px 9px; border-radius:99px; white-space:nowrap; flex:0 0 auto;
    background:var(--linea); color:var(--tenue); transition:background .2s,color .2s}
  .chip.ok{background:var(--ok-bg); color:var(--ok)}
  .chip.alerta{background:var(--alerta-bg); color:var(--alerta)}
  .chip.critico{background:var(--critico-bg); color:var(--critico)}
  .sen-cifras{display:flex; align-items:baseline; gap:8px; margin:12px 0 2px; flex-wrap:wrap}
  .sen-val{font-size:27px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;
    line-height:1; letter-spacing:-.022em}
  .sen.espera .sen-val{color:var(--tenue)}
  .sen-meta{font-size:12.5px; color:var(--tenue); font-variant-numeric:tabular-nums}
  .tend{font-size:11.5px; font-weight:700; font-variant-numeric:tabular-nums;
    padding:2px 7px; border-radius:99px; background:var(--papel); color:var(--tenue)}
  .tend.sube{color:var(--ok)} .tend.baja{color:var(--critico)}

  .escala{position:relative; height:8px; border-radius:99px; background:var(--linea);
    overflow:visible; margin:12px 0 7px}
  .escala i{display:block; height:100%; border-radius:99px; background:var(--linea-fuerte);
    transition:width .4s cubic-bezier(.22,.7,.3,1), background .25s}
  .escala i.ok{background:var(--ok)} .escala i.alerta{background:var(--alerta)}
  .escala i.critico{background:var(--critico)}
  .escala u{position:absolute; top:-3px; width:2px; height:14px; border-radius:2px}
  .escala u.disp{background:var(--alerta)}
  .escala u.nore{background:var(--critico)}
  .escala-pie{display:flex; justify-content:space-between; font-size:10.5px; color:var(--debil);
    font-variant-numeric:tabular-nums; margin-bottom:8px}

  .chispa{display:block; width:100%; height:34px; margin:6px 0 4px}
  .sen-nota{font-size:11.5px; color:var(--debil); line-height:1.42}
  .sen-pie{display:flex; align-items:center; gap:8px; margin-top:12px; padding-top:11px;
    border-top:1px solid var(--linea); flex-wrap:wrap}
  .sen-pie label{font-size:11.5px; font-weight:700; color:var(--tenue); white-space:nowrap}
  .cadencia{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:99px;
    background:var(--papel); color:var(--debil); margin-left:auto; white-space:nowrap}
  .cadencia.vencida{background:var(--alerta-bg); color:var(--alerta)}

  /* --------------------------------------------------------------- rutas */
  .rutas{display:flex; flex-direction:column; gap:12px}
  .ruta{background:var(--tarjeta); border:1px solid var(--linea); border-radius:12px;
    padding:17px 19px; box-shadow:var(--sombra); transition:border-color .25s}
  .ruta.armada{border-color:var(--alerta)}
  .ruta.activada{border-color:var(--critico); box-shadow:0 0 0 3px var(--critico-bg), var(--sombra)}
  .ruta.descartada{opacity:.55}
  .ruta-cab{display:flex; justify-content:space-between; gap:12px; align-items:flex-start;
    flex-wrap:wrap; margin-bottom:10px}
  .ruta-nom{font-size:14.5px; font-weight:700; color:var(--ink); flex:1; min-width:220px;
    line-height:1.35}
  .ruta-cuerpo{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  @media(max-width:720px){ .ruta-cuerpo{grid-template-columns:1fr} }
  .ruta-cuerpo p{margin:0; font-size:14px; line-height:1.5; color:var(--texto)}
  .ruta-cuerpo .si p{font-size:14px}

  .plazo{display:grid; grid-template-columns:auto 1fr; gap:5px 12px; margin-top:13px;
    padding:12px 14px; background:var(--papel); border-radius:10px; font-size:12.5px;
    align-items:center}
  .plazo dt{color:var(--tenue); font-weight:700; white-space:nowrap}
  .plazo dd{margin:0; color:var(--ink); font-variant-numeric:tabular-nums}
  .plazo dd.urge{color:var(--alerta); font-weight:700}
  .plazo dd.tarde{color:var(--critico); font-weight:700}
  .ruta-pie{display:flex; align-items:center; gap:9px; margin-top:12px; padding-top:11px;
    border-top:1px solid var(--linea); flex-wrap:wrap; font-size:12px; color:var(--debil)}
  .lector b{font-variant-numeric:tabular-nums; color:var(--ink)}

  /* --------------------------------------------------------------- hitos */
  .tabla-caja{overflow-x:auto; border:1px solid var(--linea); border-radius:12px;
    background:var(--tarjeta); box-shadow:var(--sombra)}
  table{border-collapse:collapse; width:100%; min-width:640px; font-size:14px}
  th{text-align:left; font-weight:700; font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--tenue); padding:11px 14px;
    border-bottom:1px solid var(--linea-fuerte); white-space:nowrap}
  td{padding:9px 14px; border-bottom:1px solid var(--linea); vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr.hecho td.h-nom{color:var(--tenue)}
  tbody tr.proximo{background:var(--azul-claro)}
  td.h-nom{font-weight:600; color:var(--ink); min-width:210px}
  td.h-nom .marcaprox{font-size:9.5px; font-weight:700; letter-spacing:.07em;
    text-transform:uppercase; color:var(--azul); display:block; margin-bottom:2px}
  .desvio{font-size:12px; font-variant-numeric:tabular-nums; font-weight:700}
  .desvio.ok{color:var(--ok)} .desvio.alerta{color:var(--alerta)}
  .desvio.critico{color:var(--critico)} .desvio.pend{color:var(--debil); font-weight:400}

  /* ------------------------------------------------------------ bitácora */
  .bitacora{background:var(--tarjeta); border:1px solid var(--linea); border-radius:12px;
    padding:18px 20px; box-shadow:var(--sombra)}
  .entrada{padding:12px 0; border-bottom:1px solid var(--linea); display:flex; gap:13px;
    align-items:flex-start}
  .entrada:last-child{border-bottom:none; padding-bottom:0}
  .entrada > div{flex:1; min-width:0}
  .entrada .cuando{font-size:10.5px; font-weight:700; letter-spacing:.05em;
    text-transform:uppercase; color:var(--debil); margin-bottom:3px}
  .entrada p{margin:0; font-size:14.5px; line-height:1.55}
  .entrada .auto{color:var(--azul)}

  /* ------------------------------------------------------------ panel */
  .panel-g{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr)); gap:13px}
  .pcol{background:var(--tarjeta); border:1px solid var(--linea); border-radius:12px;
    padding:16px 18px; box-shadow:var(--sombra)}
  .pcol h4{margin:0 0 11px; font-size:12px; font-weight:700; letter-spacing:.08em;
    text-transform:uppercase; color:var(--debil)}
  .plinea{display:flex; align-items:center; gap:9px; padding:7px 0;
    border-bottom:1px solid var(--linea); font-size:13.5px}
  .plinea:last-child{border-bottom:none}
  .plinea .pn2{flex:1; min-width:0; color:var(--ink); overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap}
  .plinea .pv{font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap}
  .pdot{width:8px; height:8px; border-radius:50%; flex:0 0 auto; background:var(--linea-fuerte)}
  .pdot.ok{background:var(--ok)} .pdot.alerta{background:var(--alerta)}
  .pdot.critico{background:var(--critico)}

  /* ------------------------------------------------------------ controles */
  input,select,textarea{font-family:inherit; font-size:14px; color:var(--ink);
    background:var(--tarjeta); border:1.5px solid var(--linea); border-radius:8px;
    padding:7px 10px; outline:none; max-width:100%}
  input:focus,select:focus,textarea:focus{border-color:var(--azul);
    box-shadow:0 0 0 3px var(--azul-claro)}
  input[type=number]{width:96px; font-variant-numeric:tabular-nums}
  input[type=date]{font-variant-numeric:tabular-nums}
  textarea{width:100%; resize:vertical; min-height:60px; line-height:1.5}
  .edit{background:var(--papel); border:1px dashed var(--linea-fuerte); border-radius:10px;
    padding:14px 15px; margin-top:13px; display:grid; gap:11px}
  .campo{display:grid; gap:5px}
  .campo label{font-size:11.5px; font-weight:700; color:var(--tenue)}
  .fila-campos{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px}
  .edit-pie{display:flex; justify-content:flex-end; gap:9px; padding-top:4px}

  .btn{border:none; cursor:pointer; font-family:inherit; font-weight:700; font-size:13.5px;
    padding:10px 17px; border-radius:9px; background:var(--azul); color:#fff}
  .btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
  .btn.sec{background:var(--azul-claro); color:var(--azul)}
  .btn.mini{font-size:12px; padding:6px 12px}
  .btn.borrar{background:transparent; color:var(--critico); padding:6px 9px}
  .btn.borrar:hover{background:var(--critico-bg)}
  .btn-add{width:100%; border:1.5px dashed var(--linea-fuerte); background:transparent;
    color:var(--azul); padding:13px; border-radius:11px; cursor:pointer; font-family:inherit;
    font-weight:700; font-size:13.5px; margin-top:13px}
  .btn-add:hover{background:var(--azul-claro); border-color:var(--azul)}
  .enlace{background:none; border:none; font-family:inherit; cursor:pointer; font-weight:700;
    font-size:12.5px; color:var(--azul); text-decoration:underline; padding:0}
  .interruptor{display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    background:var(--papel); border:1.5px solid var(--linea); border-radius:9px;
    padding:7px 11px; font-size:12.5px; font-weight:700; color:var(--tenue); white-space:nowrap}
  .interruptor[aria-pressed="true"]{background:var(--azul-claro); border-color:var(--azul);
    color:var(--azul)}
  .interruptor:focus-visible{outline:2px solid var(--azul); outline-offset:2px}
  .guardado{display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:11.5px;
    color:var(--debil); white-space:nowrap}
  .punto{width:7px; height:7px; border-radius:50%; background:var(--ok); flex:0 0 auto}

  /* --------------------------------------------------------------- modal */
  .velo{position:fixed; inset:0; background:rgba(11,21,63,.42); z-index:60; display:flex;
    align-items:center; justify-content:center; padding:22px}
  .modal{background:var(--tarjeta); border-radius:15px; padding:24px 26px; max-width:540px;
    width:100%; box-shadow:0 24px 60px -18px rgba(11,21,63,.42); max-height:88vh; overflow:auto}
  .modal h3{margin:0 0 6px; font-size:19px; color:var(--ink); letter-spacing:-.012em}
  .modal p.md{margin:0 0 17px; font-size:14px; color:var(--tenue); line-height:1.5}
  .modal .campo{margin-bottom:13px}
  .modal-pie{display:flex; gap:9px; justify-content:flex-end; margin-top:19px; flex-wrap:wrap}
  .opciones{display:grid; gap:9px; margin-bottom:6px}
  .opcion{border:1.5px solid var(--linea); border-radius:11px; padding:13px 15px; cursor:pointer;
    background:var(--tarjeta); text-align:left; font-family:inherit; display:block; width:100%}
  .opcion:hover{border-color:var(--azul); background:var(--azul-claro)}
  .opcion[aria-pressed="true"]{border-color:var(--azul); background:var(--azul-claro)}
  .opcion b{display:block; font-size:14.5px; color:var(--ink); margin-bottom:3px}
  .opcion span{display:block; font-size:12.5px; color:var(--tenue); line-height:1.45}

  .cinta{position:fixed; left:50%; transform:translateX(-50%); bottom:20px; z-index:70;
    background:var(--ink); color:#fff; border-radius:11px; padding:11px 15px;
    display:flex; align-items:center; gap:13px; font-size:13.5px; font-weight:600;
    box-shadow:0 14px 40px -12px rgba(11,21,63,.55); max-width:calc(100vw - 32px)}
  .cinta button{background:#fff; color:var(--ink); border:none; border-radius:7px;
    padding:6px 12px; font-family:inherit; font-weight:700; font-size:12.5px; cursor:pointer;
    white-space:nowrap}
  .cinta .x{background:transparent; color:#fff; opacity:.65; padding:6px 4px}
  @media(display-mode:standalone){ .solo-web{display:none !important} }

  .aparece{animation:sube .26s cubic-bezier(.22,.7,.3,1) both}
  @keyframes sube{from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
  /* ====================================================== NUEVO · pestañas
     Tres destinos, no tres interruptores sin nombre: dónde estoy hoy, el
     detalle por etapa, y el plan entero dibujado en el tiempo. */
  .pestanas{display:flex; gap:4px; margin-top:12px}
  .pest{flex:0 0 auto; background:transparent; border:none; cursor:pointer; font-family:inherit;
    font-size:13.5px; font-weight:700; color:var(--tenue); padding:8px 15px 9px;
    border-radius:9px 9px 0 0; border-bottom:3px solid transparent; display:flex;
    align-items:center; gap:7px; transition:background .16s, color .16s}
  .pest:hover{background:var(--azul-claro)}
  .pest:focus-visible{outline:2px solid var(--azul); outline-offset:-2px}
  .pest[aria-selected="true"]{color:var(--azul); border-bottom-color:var(--azul);
    background:var(--azul-claro)}
  .pest .cont{font-size:10.5px; font-weight:700; min-width:18px; height:18px; padding:0 5px;
    border-radius:99px; display:inline-flex; align-items:center; justify-content:center;
    background:var(--linea); color:var(--tenue); font-variant-numeric:tabular-nums}
  .pest .cont.alerta{background:var(--alerta-bg); color:var(--alerta)}
  .pest .cont.critico{background:var(--critico-bg); color:var(--critico)}
  @media(max-width:560px){ .pest{padding:8px 11px 9px; font-size:12.5px} }

  .pulso-i.pulsable{cursor:pointer; background:none; border:none; border-right:1px solid var(--linea);
    font-family:inherit; text-align:left; transition:background .16s}
  .pulso-i.pulsable:hover{background:var(--azul-claro)}
  .pulso-i.pulsable:focus-visible{outline:2px solid var(--azul); outline-offset:-2px}

  /* ================================================= NUEVO · glosario vivo
     El vocabulario del método se explica donde se usa, no en un manual
     aparte: cada término es un botón que se abre en el sitio. */
  .term{background:none; border:none; padding:0; font:inherit; color:inherit; cursor:help;
    border-bottom:1.5px dotted var(--azul); font-weight:600; text-align:left}
  .term:hover{background:var(--azul-claro)}
  .term:focus-visible{outline:2px solid var(--azul); outline-offset:2px}
  .glosa{position:fixed; z-index:75; max-width:330px; background:var(--ink); color:#fff;
    border-radius:11px; padding:13px 15px; font-size:12.5px; line-height:1.5;
    box-shadow:0 18px 44px -14px rgba(11,21,63,.6)}
  .glosa b{display:block; font-size:11px; letter-spacing:.09em; text-transform:uppercase;
    color:#9FB2F5; margin-bottom:5px}
  .glosa .ej{display:block; margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,.18);
    color:#C9D3F7; font-size:11.5px}

  /* ==================================================== NUEVO · vista Hoy */
  .hoy-cab{padding:28px 0 0}
  .hoy-fecha{font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
    color:var(--azul); margin-bottom:6px}
  .hoy-vacio{background:var(--ok-bg); color:var(--ok); border-radius:12px; padding:20px 22px;
    font-size:14.5px; line-height:1.5; margin-top:20px; font-weight:600}

  .dec-lista{display:grid; gap:12px; grid-template-columns:minmax(0,1fr)}
  .dec{background:var(--tarjeta); border:1px solid var(--linea); border-radius:13px;
    padding:17px 19px; box-shadow:var(--sombra); border-left:4px solid var(--linea-fuerte);
    transition:border-left-color .25s, box-shadow .25s; min-width:0; overflow-wrap:anywhere}
  .dec.tarde{border-left-color:var(--critico); box-shadow:0 0 0 3px var(--critico-bg), var(--sombra)}
  .dec.urge{border-left-color:var(--alerta)}
  .dec.calma{border-left-color:var(--ok)}
  .dec-cab{display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; margin-bottom:3px}
  .dec-dias{font-size:25px; font-weight:700; line-height:1; letter-spacing:-.022em;
    font-variant-numeric:tabular-nums; color:var(--ink); white-space:nowrap}
  .dec.tarde .dec-dias{color:var(--critico)} .dec.urge .dec-dias{color:var(--alerta)}
  .dec.calma .dec-dias{color:var(--ok)}
  .dec-que{font-size:12.5px; font-weight:700; color:var(--tenue); text-transform:uppercase;
    letter-spacing:.06em}
  .dec-nom{font-size:15px; font-weight:700; color:var(--ink); line-height:1.35; margin:4px 0 0}
  .dec-frase{font-size:13.5px; color:var(--tenue); line-height:1.5; margin:7px 0 0}
  .dec-pie{display:flex; align-items:center; gap:10px; margin-top:13px; padding-top:11px;
    border-top:1px solid var(--linea); flex-wrap:wrap; font-size:12px; color:var(--debil)}

  /* El carril: la idea central del método, dibujada. Se ve el bloque de
     preparación comiéndose el margen antes de la fecha de operación. */
  .carril{margin-top:14px}
  .carril-b{position:relative; height:26px; border-radius:7px; background:var(--linea);
    display:flex; overflow:hidden}
  .carril-b .margen{background:var(--ok-bg); height:100%; display:flex; align-items:center;
    justify-content:center; font-size:10.5px; font-weight:700; color:var(--ok);
    white-space:nowrap; overflow:hidden; min-width:0}
  .dec.urge .carril-b .margen{background:var(--alerta-bg); color:var(--alerta)}
  .dec.tarde .carril-b .margen{background:var(--critico-bg); color:var(--critico)}
  .carril-b .prep{height:100%; display:flex; align-items:center; justify-content:center;
    font-size:10.5px; font-weight:700; color:var(--tenue); white-space:nowrap; overflow:hidden;
    min-width:0; background:repeating-linear-gradient(-45deg,var(--linea) 0 5px,
      var(--linea-fuerte) 5px 10px)}
  .carril-pies{display:flex; justify-content:space-between; margin-top:5px; font-size:10.5px;
    color:var(--debil); font-variant-numeric:tabular-nums; gap:8px}
  .carril-pies span{min-width:0; flex:1 1 0}
  .carril-pies b{display:block; color:var(--tenue); font-size:10px; letter-spacing:.06em;
    text-transform:uppercase}
  .carril-pies span:nth-child(2){text-align:center}
  .carril-pies span:last-child{text-align:right}

  .lector-b{display:flex; align-items:center; gap:9px 10px; margin-top:12px; padding:10px 13px;
    background:var(--papel); border-radius:10px; font-size:12.5px; color:var(--tenue);
    flex-wrap:wrap}
  .lector-b .quien{flex:1 1 100%; min-width:0; overflow-wrap:anywhere}
  .lector-b .mini-esc{position:relative; flex:1 1 90px; min-width:70px; max-width:230px;
    height:6px; border-radius:99px; background:var(--linea)}
  .lector-b .mini-esc i{display:block; height:100%; border-radius:99px; background:var(--ok)}
  .lector-b .mini-esc i.alerta{background:var(--alerta)} .lector-b .mini-esc i.critico{background:var(--critico)}
  .lector-b .mini-esc u{position:absolute; top:-3px; width:2px; height:12px; border-radius:2px;
    background:var(--alerta)}
  .lector-b b{color:var(--ink); font-variant-numeric:tabular-nums}
  .lector-b .quien b{white-space:normal}

  /* Medir desde Hoy, sin ir a buscar la tarjeta */
  .medir{background:var(--tarjeta); border:1px solid var(--linea); border-radius:12px;
    box-shadow:var(--sombra); overflow:hidden}
  .medir-f{display:flex; align-items:center; gap:11px; padding:12px 16px;
    border-bottom:1px solid var(--linea); flex-wrap:wrap}
  .medir-f:last-child{border-bottom:none}
  .medir-f .mn{flex:1 1 220px; min-width:0; font-size:13.5px; font-weight:600; color:var(--ink)}
  .medir-f .mn small{display:block; font-weight:400; color:var(--debil); font-size:11px;
    margin-top:1px}
  .medir-f input{width:92px}

  /* ============================================ NUEVO · línea de tiempo */
  .lt-caja{background:var(--tarjeta); border:1px solid var(--linea); border-radius:13px;
    box-shadow:var(--sombra); overflow-x:auto; padding:16px 0 10px}
  .lt{position:relative; min-width:660px; --et:170px}
  @media(max-width:640px){ .lt{--et:118px} }
  .lt-capa{position:absolute; left:calc(var(--et) + 36px); right:18px; top:0; bottom:0;
    pointer-events:none}
  .lt-mes{position:absolute; top:0; bottom:0; width:1px; background:var(--linea)}
  .lt-mes span{position:absolute; top:0; left:5px; font-size:10px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; color:var(--debil); white-space:nowrap}
  .lt-hoy{position:absolute; top:0; bottom:0; width:2px; background:var(--azul); z-index:2}
  .lt-hoy span{position:absolute; top:0; left:4px; font-size:10px; font-weight:700;
    letter-spacing:.06em; text-transform:uppercase; color:var(--azul); background:var(--tarjeta);
    padding:0 3px; white-space:nowrap}
  .lt-filas{position:relative; z-index:1; padding-top:19px}
  .lt-tit{display:grid; grid-template-columns:var(--et) 1fr; gap:18px; padding:13px 18px 5px;
    font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    color:var(--debil)}
  .lt-f{display:grid; grid-template-columns:var(--et) 1fr; gap:18px; align-items:center;
    padding:5px 18px; min-height:32px}
  .lt-f:hover{background:var(--azul-claro)}
  .lt-et{font-size:12px; color:var(--ink); line-height:1.3; overflow:hidden;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; min-width:0}
  .lt-et button{background:none; border:none; padding:0; font:inherit; color:inherit;
    cursor:pointer; text-align:left}
  .lt-et button:hover{color:var(--azul); text-decoration:underline}
  .lt-p{position:relative; height:20px}
  .lt-barra{position:absolute; top:4px; height:12px; border-radius:4px;
    background:repeating-linear-gradient(-45deg,var(--linea) 0 5px,var(--linea-fuerte) 5px 10px);
    min-width:3px}
  .lt-barra.tarde{background:repeating-linear-gradient(-45deg,var(--critico-bg) 0 5px,#F0C9C9 5px 10px)}
  .lt-m{position:absolute; top:2px; width:11px; height:11px; margin:2px 0 0 -5.5px;
    transform:rotate(45deg); border-radius:2px; background:var(--azul); z-index:2}
  .lt-m.tarde{background:var(--critico)} .lt-m.urge{background:var(--alerta)}
  .lt-m.hecho{background:var(--ok)} .lt-m.punto{transform:none; border-radius:50%;
    width:9px; height:9px; margin-left:-4.5px; top:5px}
  .lt-m.hueco{background:var(--tarjeta); border:2px solid var(--linea-fuerte)}
  .lt-bandera{position:absolute; top:3px; width:3px; height:14px; margin-left:-1.5px;
    background:var(--ink); border-radius:2px; z-index:2}
  .lt-leyenda{display:flex; gap:16px; flex-wrap:wrap; padding:13px 18px 2px; font-size:11px;
    color:var(--tenue); align-items:center; min-width:660px; margin-top:9px;
    border-top:1px solid var(--linea)}
  .lt-leyenda i{display:inline-block; vertical-align:middle; margin-right:5px}
  .lt-leyenda .d{width:9px; height:9px; transform:rotate(45deg); border-radius:2px; background:var(--azul)}
  .lt-leyenda .h{width:22px; height:9px; border-radius:3px;
    background:repeating-linear-gradient(-45deg,var(--linea) 0 5px,var(--linea-fuerte) 5px 10px)}
  .lt-leyenda .b{width:3px; height:12px; background:var(--ink); border-radius:2px}
  .lt-leyenda .p{width:9px; height:9px; border-radius:50%; background:var(--ok)}

  /* ================================================== NUEVO · simulador
     Mover el valor y ver qué se enciende es la forma más rápida de que el
     mecanismo de umbrales se entienda. No guarda nada hasta registrar. */
  .sim{margin-top:11px; padding-top:11px; border-top:1px solid var(--linea)}
  .sim-l{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .sim-l label{font-size:11.5px; font-weight:700; color:var(--tenue); white-space:nowrap}
  .sim-r{flex:1 1 140px; min-width:110px; -webkit-appearance:none; appearance:none;
    height:20px; background:transparent; padding:0; border:none; cursor:pointer}
  .sim-r:focus{box-shadow:none}
  .sim-r::-webkit-slider-runnable-track{height:6px; border-radius:99px; background:var(--linea)}
  .sim-r::-moz-range-track{height:6px; border-radius:99px; background:var(--linea)}
  .sim-r::-webkit-slider-thumb{-webkit-appearance:none; width:18px; height:18px; margin-top:-6px;
    border-radius:50%; background:var(--tarjeta); border:2.5px solid var(--azul); cursor:grab;
    box-shadow:0 1px 4px rgba(11,21,63,.25)}
  .sim-r::-moz-range-thumb{width:15px; height:15px; border-radius:50%; background:var(--tarjeta);
    border:2.5px solid var(--azul); cursor:grab; box-shadow:0 1px 4px rgba(11,21,63,.25)}
  .sim-r:focus-visible::-webkit-slider-thumb{outline:2px solid var(--ink); outline-offset:2px}
  .sim-dice{font-size:12px; line-height:1.45; margin-top:9px; padding:9px 12px; border-radius:9px;
    background:var(--papel); color:var(--tenue)}
  .sim-dice.alerta{background:var(--alerta-bg); color:var(--alerta)}
  .sim-dice.critico{background:var(--critico-bg); color:var(--critico)}
  .sim-dice.ok{background:var(--ok-bg); color:var(--ok)}
  .sim-dice b{font-weight:700}
  .sim-dice .sim-nota{display:block; margin-top:4px; font-size:11px; opacity:.85; font-weight:600}

  /* La frase en voz alta: la señal dicha como se la diría a alguien. */
  .sen-dice{font-size:13px; line-height:1.5; color:var(--texto); margin:10px 0 2px}
  .sen-dice b{font-weight:700; color:var(--ink)}
  .sen-rutas{display:flex; gap:6px; flex-wrap:wrap; margin-top:9px}
  .sen-rutas .rlink{font-size:11px; font-weight:700; padding:4px 9px; border-radius:99px;
    background:var(--azul-claro); color:var(--azul); border:none; cursor:pointer;
    font-family:inherit; max-width:100%; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; text-align:left}
  .sen-rutas .rlink:hover{background:var(--azul); color:#fff}

  /* ==================================================== NUEVO · la guía */
  .modal.ancho{max-width:640px}
  .guia-paso{display:none}
  .guia-paso.viva{display:block; animation:sube .24s cubic-bezier(.22,.7,.3,1) both}
  .guia-svg{width:100%; height:auto; display:block; margin:4px 0 16px; border-radius:11px;
    background:var(--papel); padding:14px 10px}
  .guia-svg text{font-family:'Titillium Web',system-ui,sans-serif}
  .guia h4{margin:0 0 7px; font-size:17px; color:var(--ink); letter-spacing:-.012em}
  .guia p{margin:0 0 10px; font-size:14px; line-height:1.55; color:var(--texto)}
  .guia p.eco{font-size:13.5px; font-weight:600; color:var(--tenue);
    border-left:3px solid var(--linea-fuerte); padding-left:12px; margin-top:13px}
  .guia-nav{display:flex; align-items:center; gap:9px; margin-top:20px; flex-wrap:wrap}
  .guia-bolas{display:flex; gap:6px; margin-right:auto}
  .guia-bolas i{width:7px; height:7px; border-radius:50%; background:var(--linea-fuerte);
    cursor:pointer; transition:background .2s, transform .2s}
  .guia-bolas i.viva{background:var(--azul); transform:scale(1.35)}

  .atajos{display:grid; grid-template-columns:auto 1fr; gap:7px 14px; font-size:12.5px;
    color:var(--tenue); margin-top:4px}
  .atajos kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px;
    background:var(--papel); border:1px solid var(--linea-fuerte); border-bottom-width:2px;
    border-radius:5px; padding:2px 6px; color:var(--ink); white-space:nowrap}

  @media print{
    header{position:static}
    .cab-acc,.riel,.pestanas,.btn,.btn-add,.interruptor,.aviso .ir,.sen-pie,.sim,
    .velo,.glosa,.sen-rutas,.dec-pie{display:none !important}
    .term{border-bottom:none; font-weight:600}
    .lt-caja,.dec,.sen,.ruta,.medir{break-inside:avoid; box-shadow:none}
  }
</style>
</head>
<body>

<header hidden id="cab">
  <div class="env">
    <div class="cab">
      <div class="logo">FAP</div>
      <div class="cab-tit">
        <div class="eyebrow">Planificador adaptativo</div>
        <b id="cab-plan">—</b>
      </div>
      <div class="cab-acc">
        <span class="guardado"><i class="punto"></i><span id="estado">Guardado</span></span>
        <button class="interruptor" id="b-guia" title="Cómo funciona el método (tecla ?)">? Cómo funciona</button>
        <button class="interruptor" id="b-editar" aria-pressed="false" title="Tecla E">Editar</button>
        <button class="interruptor" id="b-instalar" hidden>⤓ Instalar</button>
        <button class="interruptor" id="b-menu">Plan ▾</button>
      </div>
    </div>
    <nav class="pestanas" id="pestanas" role="tablist" aria-label="Vistas"></nav>
    <nav class="riel" id="riel" aria-label="Etapas"></nav>
    <div class="pulso" id="pulso"></div>
  </div>
</header>

<main class="env" id="app"></main>
<div id="capa"></div>

<script>
"use strict";
/* =========================================================================
   Planificador adaptativo · FAP / FIAS
   ------------------------------------------------------------------------
   Herramienta de planificación por rutas adaptativas (Dynamic Adaptive
   Policy Pathways, el método formal detrás del ciclo de adaptación de la
   UICN). No tiene servidor: los planes viven en el navegador y se llevan
   de un lado a otro como archivos JSON.

   Vocabulario del método:
     SEÑAL       lo que se mide para saber si el plan sigue sirviendo.
     DISPARADOR  el valor en que hay que EMPEZAR a preparar la ruta alterna.
     NO RETORNO  el valor en que la estrategia actual ya dejó de servir.
     RUTA        a qué se cambia, y cuánto toma ponerla en marcha.
   La regla que ordena todo: una señal solo sirve si avisa con el tiempo
   suficiente para que la ruta alterna alcance a montarse.
   ========================================================================= */

var LLAVE = "fap_planificador_v1";
var HOY = new Date().toISOString().slice(0,10);
var MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

/* ------------------------------------------------------------- utilería */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function num(v){var n=parseFloat(v); return isFinite(n)?n:0;}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fechaCorta(iso){
  if(!iso) return "—";
  var p=String(iso).slice(0,10).split("-");
  if(p.length!==3) return esc(iso);
  return Number(p[2])+" "+MES[Number(p[1])-1]+" "+p[0];
}
function dias(a,b){
  if(!a||!b) return null;
  return Math.round((new Date(a+"T00:00:00Z")-new Date(b+"T00:00:00Z"))/-86400000);
}
function masDias(iso,d){
  var t=new Date(iso+"T00:00:00Z"); t.setUTCDate(t.getUTCDate()+Math.round(d));
  return t.toISOString().slice(0,10);
}
function plural(n,s,p){return n+" "+(n===1?s:p);}

/* ------------------------------------------------------- métodos base -- */
var METODOS = {
  adaptacion:{
    nombre:"Ciclo de planificación adaptativa",
    desc:"Seis etapas que no se recorren de corrido: se mide contra umbrales y se cambia de ruta cuando uno se cruza. Es el ciclo que usa la UICN para adaptación, formalizado como rutas adaptativas.",
    etapas:[
      {id:"delimitar",  n:"Etapa 1", nom:"Delimitar",   desc:"Qué entra en el ciclo, con qué datos y qué queda fuera."},

/* =============================================================== ALMACÉN */
var BD = {planes:{}, activo:null};

function cargar(){
  try{
    var t = localStorage.getItem(LLAVE);
    if(t){ BD = JSON.parse(t); }
  }catch(e){ BD = {planes:{}, activo:null}; }
  if(!BD.planes) BD.planes = {};
  if(!Object.keys(BD.planes).length){
    var p = planSemilla();
    BD.planes[p.id] = p;
  }
}
var guardaPendiente = null;
function guardar(){
  var e = document.getElementById("estado");
  if(e) e.textContent = "Guardando…";
  clearTimeout(guardaPendiente);
  guardaPendiente = setTimeout(function(){
    try{
      if(P) P.actualizado = new Date().toISOString();
      localStorage.setItem(LLAVE, JSON.stringify(BD));
      if(e) e.textContent = "Guardado";
    }catch(err){
      if(e) e.textContent = "No se pudo guardar";
    }
  }, 260);
}

var P = null;               /* plan activo */
var VISTA = null;           /* etapa que se está viendo */
var EDITANDO = false;
/* Tres destinos, no interruptores sueltos:
     hoy   · qué toca decidir y medir ahora — la pantalla de entrada
     etapa · el detalle de una etapa del ciclo
     mapa  · el plan entero: línea de tiempo y estado por etapa          */
var MODO = "hoy";

function etapasDe(p){
  return (p.etapas && p.etapas.length) ? p.etapas
       : (METODOS[p.metodo] || METODOS.libre).etapas;
}
function idxEtapa(p, eid){
  var r = -1;
  etapasDe(p).forEach(function(e,k){ if(e.id===eid) r=k; });
  return r;
}
function etapaObj(p, eid){ return etapasDe(p)[idxEtapa(p,eid)] || etapasDe(p)[0]; }
function estadoEtapa(p, eid){
  var a = idxEtapa(p, p.etapaActual), k = idxEtapa(p, eid);
  if(k < a) return "cerrada";
  if(k === a) return "curso";
  return "pendiente";
}
function vistaActual(){
  if(VISTA && idxEtapa(P, VISTA) >= 0) return VISTA;
  return P.etapaActual || etapasDe(P)[0].id;
}
function buscar(col, i){
  var r=null; (P[col]||[]).forEach(function(x){ if(x.id===i) r=x; }); return r;
}

function planNuevo(nombre, metodo){
  var m = METODOS[metodo] || METODOS.libre;
  var p = {
    id: id(), nombre: nombre || "Plan sin nombre", descripcion: "",
    metodo: metodo, etapas: JSON.parse(JSON.stringify(m.etapas)),
    etapaActual: m.etapas[0].id, textos: {},
    senales: [], rutas: [], hitos: [], bitacora: [],
    creado: new Date().toISOString(), actualizado: new Date().toISOString()
  };
  m.etapas.forEach(function(e){ p.textos[e.id] = {resumen:"", decision:""}; });
  p.bitacora.push({id:id(), fecha:HOY, auto:true,
    texto:"Se crea el plan con el método «"+m.nombre+"»."});
  return p;
}

/* ========================================================= CÁLCULOS DAPP */

/* Una señal atraviesa tres zonas: en rumbo, disparador cruzado (hay que
   empezar a preparar la ruta alterna) y punto de no retorno (la estrategia
   actual ya no sirve). "espera" es antes de que abra su ventana de medición. */
function estadoSenal(s){
  if(s.desde && HOY < s.desde) return "espera";
  var v = num(s.valor), disp = num(s.disparador), nore = num(s.noRetorno);
  if(s.direccion === "menor"){
    if(v < disp) return "ok";
    if(v < nore) return "alerta";
    return "critico";
  }
  if(v > disp) return "ok";
  if(v > nore) return "alerta";
  return "critico";
}
function nombreEstado(e){
  return e==="ok" ? "En rumbo"
       : e==="alerta" ? "Disparador cruzado"
       : e==="critico" ? "Punto de no retorno" : "Sin evaluar";
}
function unidadTxt(s){
  return s.unidad==="%" ? "%" : s.unidad==="d" ? " d"
       : s.unidad ? " "+s.unidad : "";
}
function valorTxt(s){ return num(s.valor) + unidadTxt(s); }

/* Posición de un valor en la escala meta ↔ no retorno, para pintar la barra
   y las marcas de los umbrales sobre la misma regla. */
function escalaSenal(s){
  var pts = [num(s.meta), num(s.noRetorno), num(s.disparador), num(s.valor)];
  (s.historial||[]).forEach(function(h){ pts.push(num(h.valor)); });
  var lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts);
  if(hi === lo) hi = lo + 1;
  var pad = (hi - lo) * 0.10;
  lo -= pad; hi += pad;
  /* Los extremos se ajustan al paso para que el deslizador caiga en valores
     redondos —55 %, no 55,3 %— y la escala se pueda leer de un vistazo. */
  var bruto = hi - lo;
  var paso = bruto > 60 ? 1 : bruto > 12 ? 0.5 : bruto > 3 ? 0.1 : 0.01;
  var dec = paso >= 1 ? 0 : paso >= 0.1 ? 1 : 2;
  lo = Number((Math.floor(lo / paso) * paso).toFixed(dec));
  hi = Number((Math.ceil(hi / paso) * paso).toFixed(dec));
  var span = hi - lo;
  var pos = function(x){ return Math.max(0, Math.min(100, Math.round((x - lo) / span * 100))); };
  return {pos:pos, lo:lo, hi:hi, paso:paso,
          valor:pos(num(s.valor)), disp:pos(num(s.disparador)),
          nore:pos(num(s.noRetorno)), meta:pos(num(s.meta))};
}

/* Tendencia entre las dos últimas mediciones. */
function tendencia(s){
  var h = s.historial || [];
  if(h.length < 2) return null;
  var a = h[h.length-2], b = h[h.length-1];
  var d = num(b.valor) - num(a.valor);
  if(!d) return {d:0, txt:"sin cambio", cls:""};
  var mejora = s.direccion === "menor" ? d < 0 : d > 0;
  return {d:d, cls: mejora ? "sube" : "baja",
          txt: (d > 0 ? "+" : "") + Math.round(d*100)/100 + unidadTxt(s)};
}

/* A este ritmo, ¿cuándo cruza el disparador? Es la pregunta que decide si
   la señal avisa a tiempo o no. Regresión simple sobre el historial. */
function proyeccion(s){
  var h = (s.historial||[]).slice(-8);
  if(h.length < 2) return null;
  var a = h[0], b = h[h.length-1];
  var dd = dias(a.fecha, b.fecha);
  if(!dd) return null;
  var pend = (num(b.valor) - num(a.valor)) / dd;
  if(Math.abs(pend) < 1e-9) return null;
  var faltan = (num(s.disparador) - num(b.valor)) / pend;
  if(faltan <= 0 || faltan > 900) return null;
  return {dias: Math.round(faltan), fecha: masDias(b.fecha, faltan)};
}

/* Cadencia: cada cuánto toca medir esta señal, y si ya está vencida. */
function cadencia(s){
  if(!s.cadencia) return null;
  var ult = s.ultimaMedicion || (s.historial && s.historial.length
            ? s.historial[s.historial.length-1].fecha : null);
  if(!ult) return {vencida:true, txt:"nunca medida"};
  var d = dias(ult, HOY);
  var v = d > num(s.cadencia);
  return {vencida:v, dias:d,
          txt: v ? "sin medir hace "+plural(d,"día","días") : "medida hace "+plural(d,"día","días")};
}

/* Estado de una ruta alterna. Se arma sola leyendo su señal. */
function estadoRuta(r){
  if(r.estado === "descartada") return {v:"descartada", auto:false, lectura:""};
  if(r.manual) return {v:r.estado||"latente", auto:false, lectura:""};
  var s = r.senal ? buscar("senales", r.senal) : null;
  if(!s) return {v:r.estado||"latente", auto:false, lectura:""};
  var e = estadoSenal(s);
  if(e === "espera")
    return {v:"latente", auto:true,
            lectura:"Lee <b>"+esc(s.nombre)+"</b>, que se empieza a evaluar el "+fechaCorta(s.desde)};
  var lect = "Lee <b>"+esc(s.nombre)+"</b>: "+esc(valorTxt(s))
           + " · disparador "+esc(s.disparador)+esc(unidadTxt(s))
           + ", no retorno "+esc(s.noRetorno)+esc(unidadTxt(s));
  return {v: e==="critico" ? "activada" : e==="alerta" ? "armada" : "latente",
          auto:true, lectura:lect};
}
function nombreRuta(v){
  return v==="latente" ? "Latente" : v==="armada" ? "Armada"
       : v==="activada" ? "Activada" : "Descartada";
}
function chipRuta(v){
  return v==="activada" ? "critico" : v==="armada" ? "alerta" : v==="descartada" ? "" : "ok";
}

/* El corazón del método: ¿queda tiempo para montar la ruta alterna?
   Fecha límite para decidir = fecha en que la ruta debe estar operando
   menos el tiempo que toma montarla. */
function plazoRuta(r){
  if(!r.fechaLimite) return null;
  var prep = num(r.preparacionDias);
  var limite = masDias(r.fechaLimite, -prep);
  var restan = dias(HOY, limite);
  var est = estadoRuta(r).v;
  return {
    limite: limite, restan: restan, prep: prep, operando: r.fechaLimite,
    tarde: restan < 0 && est !== "activada" && est !== "descartada",
    urge: restan >= 0 && restan <= 21 && est !== "activada" && est !== "descartada"
  };
}

/* ¿Avisa a tiempo? Compara el cruce proyectado del disparador contra la
   fecha límite para decidir. Si la señal cruza después, llega tarde. */
function avisaATiempo(r){
  var pl = plazoRuta(r);
  if(!pl) return null;
  var s = r.senal ? buscar("senales", r.senal) : null;
  if(!s) return null;
  var pr = proyeccion(s);
  if(!pr) return null;
  return {cruce: pr.fecha, limite: pl.limite, tarde: pr.fecha > pl.limite};
}

/* =========================================================== GLOSARIO VIVO
   El vocabulario del método no vive en un manual aparte: cada término es un
   botón que se explica donde aparece, con el ejemplo del propio plan. */
var GLOSARIO = {
  senal:{t:"Señal", d:"Lo que se mide para saber si el plan sigue sirviendo. No es un indicador de informe: es el número que, al cruzar cierto valor, obliga a mover el plan.",
    ej:"Ejemplo: «expedientes devueltos en la revisión administrativa»."},
  disparador:{t:"Disparador", d:"El valor en que hay que EMPEZAR A PREPARAR la ruta alterna. No es el valor en que el plan falla: es el aviso anticipado, puesto a propósito antes, para que la ruta alcance a montarse.",
    ej:"Si la ruta tarda 21 días en montarse, el disparador tiene que sonar más de 21 días antes."},
  noretorno:{t:"Punto de no retorno", d:"El valor en que la estrategia actual ya dejó de servir. Llegar aquí sin la ruta alterna montada es quedarse sin salida.",
    ej:"Entre el disparador y el no retorno está todo el margen de maniobra del plan."},
  ruta:{t:"Ruta alterna", d:"A qué se cambia cuando la estrategia actual deja de servir. Se escribe hoy, con calma y por escrito, para no tener que improvisarla cuando ya no hay tiempo.",
    ej:"Se arma sola: cuando su señal cruza el disparador pasa a «armada», y en el no retorno a «activada»."},
  preparacion:{t:"Tiempo de preparación", d:"Cuánto tarda la ruta alterna en estar operando desde que se decide activarla. Es el dato que convierte una fecha de operación en una fecha de decisión.",
    ej:"Conformar una comisión de calificación toma 45 días: eso adelanta la decisión mes y medio."},
  limite:{t:"Fecha límite para decidir", d:"La fecha en que la ruta debe estar operando MENOS su tiempo de preparación. Es la fecha que de verdad manda, y la que se pasa sin que nadie se dé cuenta.",
    ej:"Operar el 1 de diciembre con 45 días de preparación = decidir el 17 de octubre."},
  cadencia:{t:"Cadencia", d:"Cada cuánto toca medir la señal. Una señal medida tarde avisa tarde, y una señal que avisa tarde no sirve para nada.",
    ej:"La herramienta reclama sola las mediciones vencidas."},
  ventana:{t:"Ventana de aviso", d:"El tiempo entre que la señal cruza el disparador y la fecha límite para decidir. Si sale negativo, la señal avisaría cuando ya no hay nada que hacer.",
    ej:"Se arregla midiendo más seguido o adelantando el disparador."},
  etapa:{t:"Etapa", d:"Un tramo del ciclo. No se recorren de corrido: se avanza cuando la etapa cerró, y al terminar la última el ciclo vuelve a empezar con lo aprendido.",
    ej:"Cerrar una etapa deja su propia entrada en la bitácora."},
  hito:{t:"Hito", d:"Una fecha comprometida del plan. Se anota la fecha real en cuanto ocurre y el desvío se calcula solo.",
    ej:"El desvío acumulado es lo que mueve las fechas límite de decisión."}
};
function term(k, txt){
  var g = GLOSARIO[k];
  if(!g) return esc(txt||k);
  return '<button class="term" data-term="'+k+'">'+esc(txt||g.t.toLowerCase())+'</button>';
}

/* ------------------------------------------------- relaciones señal ↔ ruta */
function rutasDeSenal(sid){
  return (P.rutas||[]).filter(function(r){ return r.senal === sid; });
}

/* La señal dicha como se la diría en voz alta, sin vocabulario técnico.
   Es lo que hace que la tarjeta se entienda sin haber leído el método. */
function frasSenal(s){
  var est = estadoSenal(s), u = unidadTxt(s);
  var sube = s.direccion === "menor";      /* empeora subiendo */
  var haciaMal = sube ? "sube a" : "baja a";
  var rs = rutasDeSenal(s.id);
  var quien = rs.length ? "«"+esc(rs[0].nombre)+"»"
            : "la "+term("ruta","ruta alterna")+" que se le enganche";
  if(est === "espera")
    return "Todavía no se evalúa: entra en medición el <b>"+fechaCorta(s.desde)+"</b>. "
      + "Desde ahí, si "+haciaMal+" <b>"+esc(s.disparador)+esc(u)+"</b> habrá que empezar a preparar "+quien+".";
  if(est === "ok")
    return "Hoy va en <b>"+esc(valorTxt(s))+"</b>, en rumbo. Si "+haciaMal+" <b>"
      + esc(s.disparador)+esc(u)+"</b> hay que empezar a preparar "+quien+"; en <b>"
      + esc(s.noRetorno)+esc(u)+"</b> la estrategia actual ya no sirve.";
  if(est === "alerta")
    return "Ya cruzó el "+term("disparador")+" (<b>"+esc(s.disparador)+esc(u)+"</b>): toca empezar "
      + "a preparar "+quien+" desde ahora. El "+term("noretorno","punto de no retorno")+" está en <b>"
      + esc(s.noRetorno)+esc(u)+"</b>.";
  return "Pasó el "+term("noretorno","punto de no retorno")+" (<b>"+esc(s.noRetorno)+esc(u)
    + "</b>): la estrategia actual ya no sirve y hay que cambiar a "+quien+".";
}

/* ---------------------------------------------------------- simulación
   Mover el valor sin registrarlo y ver qué se enciende. Es la vía más corta
   para que el mecanismo de umbrales se entienda: se toca, no se lee. */
function copiaSenal(s, v){
  var c = {}; for(var k in s){ if(Object.prototype.hasOwnProperty.call(s,k)) c[k]=s[k]; }
  c.valor = v; return c;
}
function consecuencia(s, v){
  var antes = estadoSenal(s), ahora = estadoSenal(copiaSenal(s, v));
  var u = unidadTxt(s);
  var desde = "";
  if(ahora === "espera"){
    /* Aún no entra en medición, pero enseñar qué pasaría es justamente el
       punto: los umbrales se entienden antes de que hagan falta. */
    ahora = estadoSenal(copiaSenal({ nombre:s.nombre, direccion:s.direccion,
      disparador:s.disparador, noRetorno:s.noRetorno, id:s.id }, v));
    desde = "Desde el " + fechaCorta(s.desde) + ", ";
  }
  var rs = rutasDeSenal(s.id).filter(function(r){ return !r.manual; });
  var destino = ahora==="critico" ? "activada" : ahora==="alerta" ? "armada" : "latente";
  var cab = desde + "con <b>"+esc(v)+esc(u)+"</b>: "+nombreEstado(ahora).toLowerCase()+".";
  cab = cab.charAt(0).toUpperCase() + cab.slice(1);
  var cuerpo;
  if(!rs.length){
    cuerpo = ahora==="ok" ? " Ninguna ruta alterna lee esta señal todavía."
      : " Ninguna ruta alterna lee esta señal, así que nadie se enteraría. Engancha una en Editar.";
  }else{
    cuerpo = " " + rs.map(function(r){
      var pl = plazoRuta(r);
      var t = "«"+esc(r.nombre)+"» pasa a <b>"+nombreRuta(destino).toLowerCase()+"</b>";
      if(destino!=="latente" && pl)
        t += " y montarla toma "+plural(pl.prep,"día","días")+", así que la decisión vence el "
          + fechaCorta(pl.limite);
      return t + ".";
    }).join(" ");
  }
  var nota = (antes !== ahora && !desde)
    ? '<span class="sim-nota">Es un cambio respecto de hoy ('+nombreEstado(antes).toLowerCase()
      +'). Pulsa «Registrar» para dejarlo asentado con la fecha de hoy.</span>'
    : '<span class="sim-nota">Mueve el control para ver en qué valor cambia el estado. '
      + 'Nada se guarda hasta pulsar «Registrar».</span>';
  return {cls:ahora, html:cab + cuerpo + nota};
}

/* ------------------------------------------------------- agenda de decisiones
   Todas las rutas con plazo, ordenadas por lo que se vence primero. Es la
   única pregunta que hay que poder responder al abrir la herramienta. */
function decisiones(){
  var out = [];
  (P.rutas||[]).forEach(function(r){
    var e = estadoRuta(r);
    if(e.v === "descartada") return;
    var pl = plazoRuta(r);
    if(!pl || pl.restan === null) return;
    out.push({r:r, pl:pl, est:e.v, senal: r.senal ? buscar("senales", r.senal) : null});
  });
  out.sort(function(a,b){ return a.pl.restan - b.pl.restan; });
  return out;
}
function porMedir(){
  return (P.senales||[]).filter(function(s){
    if(estadoSenal(s) === "espera") return false;
    var c = cadencia(s);
    return c && c.vencida;
  });
}
function fueraDeRumbo(){
  return (P.senales||[]).filter(function(s){
    var e = estadoSenal(s); return e === "alerta" || e === "critico";
  });
}

/* ------------------------------------------------- rango y escala temporal */
function rangoFechas(){
  var f = [HOY];
  (P.hitos||[]).forEach(function(h){
    if(h.fechaPlan) f.push(h.fechaPlan);
    if(h.fechaReal) f.push(h.fechaReal);
  });
  (P.rutas||[]).forEach(function(r){
    if(!r.fechaLimite) return;
    f.push(r.fechaLimite);
    f.push(masDias(r.fechaLimite, -num(r.preparacionDias)));
  });
  (P.senales||[]).forEach(function(s){ if(s.desde) f.push(s.desde); });
  f.sort();
  var a = f[0], b = f[f.length-1];
  if(dias(a,b) < 30) b = masDias(a, 30);
  var margen = Math.max(6, Math.round(dias(a,b) * 0.05));
  return {ini: masDias(a, -margen), fin: masDias(b, margen)};
}
function mesesEntre(ini, fin){
  var out = [], y = Number(ini.slice(0,4)), m = Number(ini.slice(5,7));
  for(var i=0; i<80; i++){
    var iso = y + "-" + (m<10?"0":"") + m + "-01";
    if(iso > fin) break;
    if(iso >= ini) out.push({iso:iso, txt: MES[m-1] + (m===1 ? " " + y : "")});
    m++; if(m>12){ m=1; y++; }
  }
  return out;
}

function proximoHito(){
  var p = null;
  (P.hitos||[]).forEach(function(h){
    if(h.fechaReal || !h.fechaPlan) return;
    if(!p || h.fechaPlan < p.fechaPlan) p = h;
  });
  return p;
}
function ordenar(){
  (P.senales||[]).sort(function(a,b){ return num(a.orden)-num(b.orden); });
  (P.rutas||[]).sort(function(a,b){ return num(a.orden)-num(b.orden); });
  (P.hitos||[]).sort(function(a,b){
    return String(a.fechaPlan||"").localeCompare(String(b.fechaPlan||"")); });
}
</script>
<script>
/* =========================================================== PLAN SEMILLA
   Renovaciones FAP 2027, con las cifras agregadas del plan. El detalle
   contrato por contrato no está aquí: el repositorio es público y esa
   información se maneja por fuera, igual que en el resto del proyecto.  */
function planSemilla(){
  var m = METODOS.adaptacion;
  var p = {

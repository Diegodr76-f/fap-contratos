<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bienes FAP · Registro de activos fijos y bienes de control · FIAS</title>
<meta name="description" content="Registro de activos fijos y bienes de control del FAP/FIAS: la AC llena un formulario corto, la fila cae en la matriz nacional y la administradora de bienes revisa y da seguimiento.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700&display=swap" rel="stylesheet">
<!-- Lector de Excel: PizZip ya vive en el repositorio (no en un CDN externo), igual
     que en el CLM y el Calificador. Sirve para abrir la matriz .xlsx sin internet. -->
<script src="../clm/vendor/pizzip.min.js"></script>
<!-- Login con la cuenta de Microsoft de FIAS: MSAL.js, vendorizado por la misma
     razón que PizZip (nada de CDNs externos que las redes institucionales bloqueen).
     Una sola copia canónica en clm/vendor/, compartida por CLM, CRM y bienes. -->
<script src="../clm/vendor/msal-browser.min.js"></script>
<!-- Código QR de la etiqueta de cada bien: se genera aquí mismo, en el navegador.
     La fórmula del Excel (=IMAGE(...)) nunca funcionó -depende de una versión de
     Excel que no todos tienen y de un servicio externo casi siempre bloqueado en
     la red de la institución (ver MATRIZ.md, sección 6). Esta librería no llama
     a ningún servicio: dibuja el QR con matemática pura, así que funciona sin
     internet y sin que importe qué Excel tenga cada quien. -->
<script src="../clm/vendor/qrcode.js"></script>
<style>
  :root{
    --navy:#00249C; --navy2:#2547C9; --ink:#0B153F; --bg:#F4F6FB; --card:#fff;
    --line:#E3E6F0; --line2:#EAEDF5; --muted:#6B7180; --muted2:#9AA0B2;
    --green:#1E9E5A; --greenbg:#E7F6EE; --amber:#C98A08; --amberbg:#FCF3DD;
    --red:#D23A3A; --redbg:#FBE7E7; --tint:#EEF1FB; --violet:#6A44C9; --teal:#0E9AA7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}

  ::placeholder{color:var(--muted2)}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ===== shell ===== */
  .shell{display:flex;min-height:100vh}
  aside.side{width:232px;flex:0 0 232px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}

  .btn.line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .btn.line:hover{background:var(--bg);filter:none}
  .btn.danger{background:var(--red)}
  .btn.sm{padding:8px 13px;font-size:12.5px}

  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;display:inline-block}
  .b-g{background:var(--greenbg);color:var(--green)} .b-a{background:var(--amberbg);color:var(--amber)}

  .chip{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);padding:7px 13px;border:1.5px solid var(--line);border-radius:99px;background:#fff}

  table.list td{font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
  table.list tbody tr:hover{background:#FAFBFE}
  table.list td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ===== formulario ===== */

  .secline{display:flex;align-items:center;gap:10px;margin:22px 0 14px}

  .autogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:11px}
  .ai .k{font-size:10.5px;font-weight:700;color:var(--muted2);text-transform:uppercase;letter-spacing:.4px}
  .ai .v{font-size:14px;font-weight:700;margin-top:2px;word-break:break-word}

  .ai .v.mut{color:var(--muted2);font-weight:600}

  .note{border-left:3px solid var(--navy);background:var(--tint);border-radius:0 10px 10px 0;padding:11px 14px;font-size:12.5px;line-height:1.55;margin:12px 0}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;font-weight:600;box-shadow:0 14px 34px rgba(11,21,63,.24);z-index:9999;max-width:92vw;text-align:center}

  .gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#F4F6FB,#E4EAFA);padding:22px;overflow:auto}
  .gate .card{background:#fff;border:1px solid #E3E8F5;border-radius:19px;padding:30px 30px 26px;max-width:452px;width:100%;box-shadow:0 18px 50px rgba(11,21,63,.12)}
  .gate .glogo{width:48px;height:48px;border-radius:13px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;margin-bottom:14px}
  .gate h1{font-size:21px;font-weight:700;margin:0 0 6px;letter-spacing:-.3px}

  .gate .or{display:flex;align-items:center;gap:10px;margin:18px 0 14px;color:var(--muted2);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
  .gate .or:before,.gate .or:after{content:"";flex:1;height:1px;background:var(--line2)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.6px}
  .copyrow{display:flex;align-items:center;gap:8px}
  .print-only{display:none}

<body>

<div id="app"></div>
<div id="modal"></div>

<script>
/* =====================================================================
   BIENES FAP — registro de activos fijos y bienes de control (FIAS)
   ---------------------------------------------------------------------
   Problema que resuelve: la matriz nacional de bienes se llenaba a mano.
   Cada administradora de área (AC) mandaba su matriz por correo y la
   administradora de bienes copiaba fila por fila, 44 columnas cada una.

   Cómo lo resuelve: la AC llena un formulario de 12 campos; la
   herramienta calcula sola las otras 32 columnas (código, hoja destino,
   vida útil, depreciación, estado de garantía, datos de póliza) y manda
   la fila al Excel matriz por Power Automate. La administradora de
   bienes recibe el aviso, revisa lo que entró y le da seguimiento.

   Quién ve qué (la herramienta es un archivo estático y público, así que
   la separación es criptográfica, no de interfaz):
     · sin frase        → SOLO el formulario. No se descarga ningún dato.
     · frase de área    → el formulario + los bienes de ESA área.
     · frase maestra    → todo: panel, revisión, alertas y exportación.
   Cada área tiene su propia frase, derivada de la maestra; el panel las
   muestra para que la administradora de bienes las reparta.
   ===================================================================== */

/* ================= CONFIG ================= */
// URL del flujo de Power Automate que agrega la fila a la Lista de SharePoint
// y avisa a la administradora de bienes. El paso a paso está en CONECTAR.md.
// Si se deja vacía (''), la herramienta funciona igual: calcula todo y
// permite descargar la fila, pero no la envía. No necesita frase ni login:
// solo escribe, nunca devuelve datos de nadie.
var FLOW_BIENES_URL = '';

/* Inicio de sesión con la cuenta de Microsoft (Entra ID) de FIAS. Reemplaza
   al sistema de frases: quien entra aquí demuestra ser un empleado real, y
   el flujo protegido de abajo decide QUÉ puede ver según un cruce con la
   lista de accesos — este archivo nunca decide solo, por diseño, para que
   nadie pueda verse a sí mismo el área de otro con solo tocar el código.
   Los tres valores los llena quien registre la app en Entra ID (ver
   CONECTAR.md, parte 3). Mientras estén vacíos, el botón de login no
   aparece y la herramienta sigue sirviendo para registrar bienes y para
   que la administradora abra su .xlsx a mano. */
var MSAL_CONFIG = {
  clientId: 'f92458ed-0ad6-4f2a-882e-4c897b2ce53a',
  authority: 'https://login.microsoftonline.com/5e23e4af-237d-4d97-bf6e-dca808015787',
  redirectUri: window.location.origin + window.location.pathname
};
// Recurso para el que se pide el token que llega al flujo protegido.
// Ver CONECTAR.md parte 3.4: es la misma app registrada, expuesta como API.
var MSAL_API_SCOPE = 'api://f92458ed-0ad6-4f2a-882e-4c897b2ce53a/Bienes.Leer';

// Flujo protegido con Azure AD: recibe el token, mira quién llama (nunca lo
// que el navegador diga de sí mismo) y devuelve solo lo que le toca ver.
var API_MIS_BIENES_URL = '';

// Enlace directo a la Lista de SharePoint donde se administra quién ve qué
// (correo → área). Solo es un atajo para el botón de «Accesos»; si se deja
// vacío, ese botón no aparece pero todo lo demás funciona igual.
var SP_ACCESOS_URL = '';

// Umbral contable que separa activo fijo de bien de control.
// Verificado contra la matriz 2026: los 504 registros de la hoja "Activos"
// valen $500 o más; los de "Bienes control", menos.
var UMBRAL_ACTIVO = 500;

// Póliza vigente: se precarga en cada bien nuevo para no volver a teclearla.
// Cuando el FAP renueve la póliza, se cambia aquí (una línea) y todos los
// registros nuevos salen con los datos correctos.
var POLIZA = {
  aseguradora: 'ASEGURADORA DEL SUR',
  nro: '201752',
  inicio: '2026-01-01',
  fin: '2027-01-01'
};

/* ================= CATÁLOGOS =================
   Salen de la propia matriz 2026 (1.260 bienes), ya normalizados: donde
   el Excel tiene 49 formas de escribir el tipo de bien, aquí hay 8.
   Ver bienes/MATRIZ.md para el detalle de cada decisión. */

// Áreas protegidas y siglas del código. La sigla es el segundo bloque del
// código del bien (02-«SIGLA»-###-XX) y define de quién es cada registro.
var AREAS = [
  {s:'PNA',      n:'Parque Nacional Antisana'},
  {s:'PNCC',     n:'Parque Nacional Cayambe Coca'},
  {s:'PNCCa',    n:'Parque Nacional Cotacachi Cayapas'},
  {s:'PNC',      n:'Parque Nacional Cotopaxi'},
  {s:'PNLL',     n:'Parque Nacional Llanganates'},
  {s:'PNM',      n:'Parque Nacional Machalilla'},
  {s:'PNP',      n:'Parque Nacional Podocarpus'},
  {s:'PNRNS',    n:'Parque Nacional Río Negro Sopladora'},
  {s:'PNS',      n:'Parque Nacional Sangay'},
  {s:'PNSNG',    n:'Parque Nacional Sumaco Napo Galeras'},
  {s:'PNYCI',    n:'Parque Nacional Yacuri'},
  {s:'PNY',      n:'Parque Nacional Yasuní'},
  {s:'REAR',     n:'Reserva Ecológica Arenillas'},
  {s:'RECB',     n:'Reserva Ecológica Cofán Bermejo'},
  {s:'REEA',     n:'Reserva Ecológica El Ángel'},
  {s:'REI',      n:'Reserva Ecológica Los Ilinizas'},
  {s:'REMACH',   n:'Reserva Ecológica Mache Chindul'},
  {s:'RCM',      n:'Reserva Ecológica Manglares Cayapas Mataje'},
  {s:'REMCH',    n:'Reserva Ecológica Manglares Churute'},
  {s:'RBCP',     n:'Reserva Biológica Cerro Plateado'},
  {s:'RBCC',     n:'Reserva Biológica Colonso Chalupas'},
  {s:'RBEC',     n:'Reserva Biológica El Cóndor'},
  {s:'RBEQ',     n:'Reserva Biológica El Quimi'},
  {s:'RBL',      n:'Reserva Biológica Limoncocha'},
  {s:'RGP',      n:'Reserva Geobotánica Pululahua'},
  {s:'RMEP',     n:'Reserva Marina El Pelado'},
  {s:'RMGSF',    n:'Reserva Marina Galera San Francisco'},
  {s:'RMISC',    n:'Reserva Marina Isla Santa Clara'},
  {s:'RPFCH',    n:'Reserva de Producción de Fauna Chimborazo'},
  {s:'RPFC',     n:'Reserva de Producción de Fauna Cuyabeno'},

/* ================= SESIÓN (MSAL / Entra ID) =================
   Quién ve qué ya no lo decide este archivo ni una frase: lo decide el
   flujo protegido, cruzando el correo de quien inició sesión contra la
   lista de accesos. Aquí solo se pide el login y se llama al flujo. */
var msalApp = null, msalCuenta = null;
function msalListo(){ return !!(MSAL_CONFIG.clientId && MSAL_CONFIG.authority && window.msal); }
async function msalIniciar(){
  if(!msalListo()) return null;
  if(!msalApp){
    msalApp = new msal.PublicClientApplication({
      auth: { clientId: MSAL_CONFIG.clientId, authority: MSAL_CONFIG.authority, redirectUri: MSAL_CONFIG.redirectUri },
      cache: { cacheLocation: 'localStorage' }   // sobrevive a cerrar la pestaña, como cualquier sesión de Office
    });
    await msalApp.initialize();
  }
  var ctas = msalApp.getAllAccounts();
  msalCuenta = ctas.length ? ctas[0] : null;
  return msalCuenta;
}
async function msalEntrar(){
  await msalIniciar();
  var r = await msalApp.loginPopup({ scopes: ['User.Read'] });
  msalCuenta = r.account;
  return msalCuenta;
}
function msalSalir(){
  if(msalApp && msalCuenta) msalApp.logoutRedirect({ account: msalCuenta });
}
// Token para llamar al flujo protegido. Silencioso si la sesión sigue viva
// (no vuelve a pedir contraseña); solo abre ventana si de verdad hace falta.
async function msalToken(){
  var req = { scopes: [MSAL_API_SCOPE], account: msalCuenta };
  try{ return (await msalApp.acquireTokenSilent(req)).accessToken; }
  catch(e){ return (await msalApp.acquireTokenPopup(req)).accessToken; }
}
// Pide al flujo protegido los bienes que le tocan a quien inició sesión.
// El servidor devuelve YA decidido el rol y el área: este archivo no
// vuelve a decidirlo, solo pinta lo que le llega.
async function pedirMisBienes(){
  var token = await msalToken();
  var r = await fetch(API_MIS_BIENES_URL, { headers: { Authorization: 'Bearer '+token } });
  if(r.status===403) throw new Error('Tu cuenta inició sesión, pero no está en la lista de accesos. Pídele a la administradora de bienes que te agregue.');
  if(!r.ok) throw new Error('No pude consultar tus bienes (HTTP '+r.status+').');
  var d = await r.json();
  return { rol: d.rol==='cata'?'cata':'area', sigla: d.sigla||null, bienes: (d.bienes||[]).map(normalizaBien) };
}

/* ================= REGLAS DEL NEGOCIO =================
   Las cuatro cuentas que la matriz llama "campo automático" y que hoy se
   escriben a mano (y por eso están calculadas a fechas distintas en la
   misma matriz: unas a febrero, otras a marzo, otras en cero). */

// Meses completos transcurridos entre dos fechas.
function mesesEntre(desdeISO, hastaISO){
  if(!desdeISO) return 0;
  var a=new Date(String(desdeISO).slice(0,10)+'T00:00:00');
  var b=new Date(String(hastaISO||todayISO()).slice(0,10)+'T00:00:00');
  if(isNaN(a.getTime())||isNaN(b.getTime())) return 0;
  var m=(b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
  if(b.getDate() < a.getDate()) m--;
  return Math.max(0,m);
}
// Depreciación lineal a valor residual cero, topada al valor del bien.
function depreciacion(valor, vida, fechaCompra, hastaISO){
  valor=Number(valor)||0; vida=Number(vida)||0;
  if(!valor || !vida) return {anual:0, mensual:0, acumulada:0, residual:valor, meses:0, agotada:false};
  var anual=valor/vida, mensual=anual/12, meses=mesesEntre(fechaCompra,hastaISO);
  var acumulada=Math.min(mensual*meses, valor);
  return {anual:anual, mensual:mensual, acumulada:acumulada, residual:valor-acumulada,
          meses:meses, agotada:acumulada>=valor-0.005};
}
// Un bien de $500 o más es activo fijo; por debajo, bien de control.
function hojaDe(valor){ return (Number(valor)||0) >= UMBRAL_ACTIVO ? 'Activos' : 'Bienes control'; }
function estadoGarantia(tiene, finISO){
  if(!tiene || tiene==='NO' || tiene==='N/A') return 'N/A';
  if(!finISO) return 'N/A';
  var d=dias(finISO); if(d==null) return 'N/A';
  return d<0 ? 'Caducado' : 'Vigente';
}
// Código del bien: 02-SIGLA-###-SUFIJO, con el secuencial siguiente del área.
function proximoCodigo(sigla, suf, bienes){
  var max=0;
  (bienes||[]).forEach(function(b){
    if(b.sigla!==sigla) return;
    var partes=String(b.codigo||'').replace(/\s+/g,'-').split('-');
    partes.forEach(function(p){ var n=parseInt(p,10); if(!isNaN(n) && String(p).length<=4 && n>max) max=n; });
  });
  return '02-'+sigla+'-'+String(max+1).padStart(3,'0')+'-'+suf;
}

  var s=partes.length>1 ? partes[1] : '';
  // Las filas viejas escritas «02 RPFMS-026-001-EO» dejan la sigla en el bloque 1.
  if(/^\d+$/.test(s) && partes.length>2) s=partes[0].replace(/^\d+/,'')||partes[2];
  s=SIGLA_ALIAS[s]||s;
  // RVSP se usó a la vez para Pasochoa y para El Pambilar: la ubicación desempata.
  if(s==='RVSP' && /pambilar/i.test(String(ubicacion||''))) s='RVSEP';
  return AREA_IX[s] ? s : (s||'—');
}

/* Un código repetido son dos problemas muy distintos, con dos arreglos distintos:
   · la MISMA fila copiada en las dos hojas (mismo bien, mismo valor) → sobra una,
     y mientras tanto el bien se cuenta dos veces en el patrimonio;
   · dos bienes DISTINTOS con el mismo código → hay que recodificar uno.
   Mezclarlos deja a quien revisa sin saber qué hacer, así que se marcan aparte. */
function marcaDuplicados(lista){
  var grupos={};
  lista.forEach(function(b){ (grupos[b.codigo]=grupos[b.codigo]||[]).push(b); });
  lista.forEach(function(b){
    var g=grupos[b.codigo];
    b.dupCodigo=false; b.dupFila=false;
    if(!g || g.length<2) return;
    var firma=function(x){ return norm(x.descripcion)+'|'+Number(x.valor).toFixed(2); };
    var iguales=g.every(function(x){ return firma(x)===firma(g[0]); });
    if(iguales) b.dupFila=true; else b.dupCodigo=true;
  });
  return lista;
}

function colLetra(ref){ return String(ref||'').replace(/[0-9]/g,''); }
function colIndice(letras){
  var n=0; for(var i=0;i<letras.length;i++){ n=n*26+(letras.charCodeAt(i)-64); } return n-1;
}
function serialAFecha(n){
  n=Number(n); if(!n || n<1) return '';
  var ms=Math.round((n-25569)*86400000);
  var d=new Date(ms); if(isNaN(d.getTime())) return '';
  return d.toISOString().slice(0,10);
}
function aFechaISO(v){
  if(v==null||v==='') return '';
  if(typeof v==='number') return serialAFecha(v);
  var s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  var m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);   // dd/mm/aaaa
  if(m) return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  if(/^\d+(\.\d+)?$/.test(s)) return serialAFecha(parseFloat(s));
  return '';
}

        if(t==='s'){ v = vn ? (shared[parseInt(vn.textContent,10)]||'') : ''; }
        else if(t==='inlineStr'){ var isn=c.getElementsByTagName('t')[0]; v = isn?isn.textContent:''; }
        else if(vn){ var raw=vn.textContent; v = (raw!=='' && !isNaN(raw)) ? parseFloat(raw) : raw; }
        if(idx>=0) fila[idx]=v;
      }
      out.push(fila);
    }
    return out;
  }

  var bienes=[];
  hojas.forEach(function(h){
    var esControl=/control/i.test(h.nombre);
    var esActivo=/activo/i.test(h.nombre);
    if(!esControl && !esActivo) return;
    var filas=filasDe(h.path);
    filas.slice(1).forEach(function(f){
      if(!f || f[0]==null || String(f[0]).trim()==='') return;
      var g=function(i){ var v=f[i]; return v==null?'':v; };
      var gf=function(i){ return COLS_FECHA[i] ? aFechaISO(f[i]) : ''; };
      bienes.push(normalizaBien({
        codigo:g(0), descripcion:g(1), detalle:g(2), cantidad:g(3),
        tipoSeguros:g(4), tipoContable:g(5), proyecto:g(6), fechaCompra:gf(7),
        donante:g(8), proveedor:g(9), ruc:g(10), factura:g(11), facturaLink:g(12),
        valor:g(13), marca:g(14), modelo:g(15), serie:g(16), cedula:g(17),
        custodio:g(18), institucion:g(19), ubicacion:g(20), acta:g(21),
        asegurado:g(22), inicioSeguro:gf(23), finSeguro:gf(24), aseguradora:g(25), poliza:g(26),
        garantia:g(27), inicioGarantia:gf(28), finGarantia:gf(29),
        estadoFisico:g(31), vida:g(32),
        fechaBaja:gf(39), motivoBaja:g(40), observaciones:g(41), foto:g(42),
        hoja: esControl ? 'Bienes control' : 'Activos'
      }));
    });
  });
  return marcaDuplicados(bienes);
}

/* ================= FORMULARIO ================= */
function nuevoFormulario(){
  S.form = {
    sigla: S.sigla || '',
    descripcion:'', detalle:'', tipoContable:'', valor:'', fechaCompra: todayISO(),
    donante:'KFW', proveedor:'', ruc:'', factura:'', facturaLink:'',
    marca:'', modelo:'', serie:'', cantidad:1,
    cedula:'', custodio:'', institucion:'MAE', ubicacion:'',
    acta:'', foto:'', estadoFisico:'NUEVO',
    garantia:'NO', inicioGarantia:'', finGarantia:'',
    asegurado:'SI', observaciones:'', codigoManual:''
  };
  S.errores={};
}
// Todo lo que la herramienta calcula sola a partir de los 12 campos.
function calculado(){
  var f=S.form, t=TIPO_IX[f.tipoContable]||null, valor=Number(f.valor)||0;
  var sigla=f.sigla||'';
  var hoja=hojaDe(valor), vida=t?t.vida:null;
  var dep = (t && valor) ? depreciacion(valor, vida, f.fechaCompra) : null;
  var puedeCodigo = !!(sigla && t && (S.rol!=='form'));
  var codigo = f.codigoManual ? f.codigoManual
             : (puedeCodigo ? proximoCodigo(sigla, t.suf, S.bienes) : '');
  return {
    codigo: codigo, sigla: sigla, area: areaNombre(sigla),
    tipo: t, vida: vida, hoja: hoja, valor: valor, dep: dep,
    tipoSeguros: t?t.seg:'', estadoGarantia: estadoGarantia(f.garantia, f.finGarantia),
    codigoAutomatico: puedeCodigo && !f.codigoManual
  };
}
function validar(){
  var f=S.form, e={};
  if(!f.sigla) e.sigla='Elige el área.';
  if(!f.descripcion.trim()) e.descripcion='Escribe qué es el bien.';
  if(!f.tipoContable) e.tipoContable='Elige el tipo de bien.';
  if(!(Number(f.valor)>0)) e.valor='Escribe el valor con IVA.';
  if(!f.fechaCompra) e.fechaCompra='Falta la fecha de compra.';
  else if(dias(f.fechaCompra)>0) e.fechaCompra='La fecha de compra no puede ser futura.';
  if(!f.proveedor.trim()) e.proveedor='Falta el proveedor.';
  if(!f.factura.trim()) e.factura='Falta el número de factura.';
  if(!f.custodio.trim()) e.custodio='Falta el custodio.';
  if(!f.ubicacion.trim()) e.ubicacion='Falta la ubicación.';
  if(f.ruc && !/^\d{10,13}$/.test(f.ruc.replace(/\D/g,''))) e.ruc='El RUC debe tener entre 10 y 13 dígitos.';
  if(f.cedula && !/^\d{10}$/.test(f.cedula.replace(/\D/g,''))) e.cedula='La cédula debe tener 10 dígitos.';
  if(f.garantia==='SI'){
    if(!f.finGarantia) e.finGarantia='Si hay garantía, pon hasta cuándo va.';
    else if(f.inicioGarantia && f.finGarantia < f.inicioGarantia) e.finGarantia='El fin de garantía es anterior al inicio.';
  }
  S.errores=e;
  return Object.keys(e).length===0;
}
// La fila tal como cae en la matriz: las 44 columnas, en orden.
function filaMatriz(){
  var f=S.form, c=calculado();
  return {
    codigo: c.codigo, descripcion: f.descripcion.trim().toUpperCase(), detalle: f.detalle.trim(),
    cantidad: Number(f.cantidad)||1, tipoSeguros: c.tipoSeguros, tipoContable: f.tipoContable,
    proyecto:'FAP', fechaCompra: f.fechaCompra, donante: f.donante,
    proveedor: f.proveedor.trim(), ruc: f.ruc.trim(), factura: f.factura.trim(),
    facturaLink: f.facturaLink.trim(), valor: Number(f.valor)||0,
    marca: f.marca.trim(), modelo: f.modelo.trim(), serie: f.serie.trim(),
    cedula: f.cedula.trim(), custodio: f.custodio.trim().toUpperCase(),
    institucion: f.institucion, ubicacion: f.ubicacion.trim(), acta: f.acta.trim(),
    asegurado: f.asegurado,
    inicioSeguro: f.asegurado==='SI'?POLIZA.inicio:'', finSeguro: f.asegurado==='SI'?POLIZA.fin:'',
    aseguradora: f.asegurado==='SI'?POLIZA.aseguradora:'N/A',
    poliza: f.asegurado==='SI'?POLIZA.nro:'N/A',
    garantia: f.garantia, inicioGarantia: f.inicioGarantia, finGarantia: f.finGarantia,
    estadoGarantia: c.estadoGarantia, estadoFisico: f.estadoFisico,
    vida: c.vida,
    depAnual: c.dep?+c.dep.anual.toFixed(2):0,
    depAcumulada: c.dep?+c.dep.acumulada.toFixed(2):0,
    depMensual: c.dep?+c.dep.mensual.toFixed(2):0,
    residual: c.dep?+c.dep.residual.toFixed(2):0,
    fechaBaja:'', motivoBaja:'', observaciones: f.observaciones.trim(),
    foto: f.foto.trim(),
    // Metadatos del envío (no son columnas de la matriz; sirven al flujo).
    _hoja: c.hoja, _sigla: c.sigla, _area: c.area,
    _enviado: new Date().toISOString(),
    _id: (c.codigo||'sin-codigo')+'|'+Date.now()
  };
}

async function enviar(){
  if(!validar()){ render(); toast('Faltan datos. Mira los campos en rojo.'); return; }
  var fila=filaMatriz();
  S.enviados.unshift(fila); if(S.enviados.length>200) S.enviados.length=200;
  lsSet(LS_ENVIADOS, S.enviados);

  if(!FLOW_BIENES_URL){
    download(JSON.stringify(fila,null,2), 'BIEN_'+(fila.codigo||'nuevo').replace(/[^\w-]+/g,'_')+'.json', 'application/json');
    toast('Registro guardado y descargado. Falta configurar el flujo para que llegue solo a la matriz.', 5200);
  }else{
    try{
      var r = await fetch(FLOW_BIENES_URL, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(fila)});
      if(!r.ok) throw new Error('HTTP '+r.status);
      toast('Listo. El bien '+(fila.codigo||'')+' entró a la matriz y ya le avisamos a la administradora.', 5000);
    }catch(e){
      var cola=lsGet(LS_COLA,[]); cola.push(fila); lsSet(LS_COLA,cola);
      toast('Guardado sin conexión. Se enviará solo la próxima vez que abras la herramienta.', 5000);
    }
  }
  var sigla=S.form.sigla;
  nuevoFormulario(); S.form.sigla=sigla;
  S.vista='registrar';
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}
// Reintento silencioso de lo que quedó sin enviar por falta de internet.
async function vaciarCola(){
  if(!FLOW_BIENES_URL) return;
  var cola=lsGet(LS_COLA,[]); if(!cola.length) return;
  var fallan=[];
  for(var i=0;i<cola.length;i++){
    try{
      var r=await fetch(FLOW_BIENES_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(cola[i])});
      if(!r.ok) throw new Error();
    }catch(e){ fallan.push(cola[i]); }
  }
  lsSet(LS_COLA, fallan);
  if(cola.length>fallan.length) toast('Se enviaron '+(cola.length-fallan.length)+' registro(s) que estaban pendientes.');
}

function campo(id,label,html,req,hint){

function datalist(id, valores){
  var vistos={}, out=[];
  valores.forEach(function(v){ v=String(v||'').trim(); if(v && !vistos[norm(v)]){ vistos[norm(v)]=1; out.push(v); } });
  out.sort(function(a,b){ return a.localeCompare(b,'es'); });
  return '<datalist id="'+id+'">'+out.slice(0,400).map(function(v){return '<option value="'+esc(v)+'">';}).join('')+'</datalist>';
}

function tarjetaAutomatica(c){
  var d=c.dep, f=S.form;
  var it=function(k,v,cls){ return '<div class="ai"><div class="k">'+esc(k)+'</div><div class="v '+(cls||'')+'">'+v+'</div></div>'; };
  var codigoHtml = c.codigo
    ? '<span class="mono">'+esc(c.codigo)+'</span>'
    : (S.rol==='form'
        ? '<span class="v mut" style="font-size:12.5px">lo asigna la administradora</span>'
        : '<span class="v mut" style="font-size:12.5px">falta área o tipo</span>');
  return '<div class="auto" style="margin-top:20px">'+
    '<h4>Lo que la herramienta llena por ti</h4>'+
    '<p class="s">Estas 32 columnas de la matriz no se escriben: se calculan con lo de arriba. '+
      'La depreciación queda con corte de <b>hoy ('+fdate(todayISO())+')</b> y el panel la vuelve a calcular cada vez que se abre, '+
      'así que nunca más quedan filas cerradas a fechas distintas.</p>'+
    '<div class="autogrid">'+
      it('Código del bien', codigoHtml, 'big')+
      // Sin valor no se puede decir la hoja: $0 caería en «Bienes control» y
      // parecería una respuesta cuando en realidad todavía no hay dato.
      it('Hoja de la matriz', c.valor>0 ? esc(c.hoja) : '<span class="mut">—</span>')+
      it('Tipo para el seguro', c.tipoSeguros?esc(c.tipoSeguros):'<span class="mut">—</span>')+
      it('Vida útil', c.vida?c.vida+' años':'<span class="mut">—</span>')+
      it('Proyecto','FAP')+
      it('Depreciación anual', d?money(d.anual):'<span class="mut">—</span>')+
      it('Depreciación mensual', d?money(d.mensual):'<span class="mut">—</span>')+
      it('Depreciación acumulada', d?money(d.acumulada):'<span class="mut">—</span>')+
      it('Valor en libros hoy', d?money(d.residual):'<span class="mut">—</span>')+
      it('Estado de la garantía', esc(c.estadoGarantia))+
      it('Aseguradora', f.asegurado==='SI'?esc(POLIZA.aseguradora):'N/A')+
      it('Póliza', f.asegurado==='SI'?esc(POLIZA.nro)+' · hasta '+fdate(POLIZA.fin):'N/A')+
    '</div>'+
    (c.codigoAutomatico
      ? '<div style="margin-top:12px;font-size:11.5px;color:var(--muted)">El código es el siguiente libre de tu área. '+
        '<a href="#" id="codman">Poner otro a mano</a>.</div>'
      : (f.codigoManual
        ? '<div style="margin-top:12px;font-size:11.5px;color:var(--muted)">Código escrito a mano. <a href="#" id="codauto">Volver al automático</a>.</div>'
        : ''))+
  '</div>';
}

/* ---------- vista: listado de bienes ---------- */
function bienesFiltrados(){
  var f=S.filtro, q=norm(f.q);
  return S.bienes.filter(function(b){
    if(f.area && b.sigla!==f.area) return false;
    if(f.hoja && b.hoja!==f.hoja) return false;
    if(f.alerta && !alertasDe(b).some(function(a){return a.k===f.alerta;})) return false;
    if(!q) return true;
    return (norm(b.codigo)+' '+norm(b.descripcion)+' '+norm(b.detalle)+' '+norm(b.serie)+' '+
            norm(b.custodio)+' '+norm(b.ubicacion)+' '+norm(b.marca)+' '+norm(b.proveedor)).indexOf(q)>=0;
  });
}
function filaBien(b){
  var al=alertasDe(b).filter(function(a){return a.k!=='agotada';});
  return '<tr data-cod="'+esc(b.codigo)+'">'+
    '<td><div style="font-weight:700" class="mono">'+esc(b.codigo||'—')+'</div>'+
      '<div style="font-size:11.5px;color:var(--muted)">'+esc(trunc(b.descripcion,44))+'</div></td>'+
    (S.rol==='cata'?'<td>'+esc(b.sigla)+'</td>':'')+
    '<td>'+esc(trunc(b.custodio||'—',26))+'<div style="font-size:11.5px;color:var(--muted)">'+esc(trunc(b.ubicacion||'',30))+'</div></td>'+
    '<td class="num">'+money(b.valor)+'</td>'+
    '<td class="num">'+money(b.dep.residual)+'</td>'+
    '<td>'+fdate(b.fechaCompra)+'</td>'+
    '<td><span class="badge '+(b.hoja==='Activos'?'b-n':'b-d')+'">'+(b.hoja==='Activos'?'Activo':'Control')+'</span></td>'+
    '<td>'+(al.length? al.slice(0,2).map(function(a){return '<span class="badge '+a.cls+'">'+esc(a.t)+'</span>';}).join(' ')+
      (al.length>2?' <span class="badge b-d">+'+(al.length-2)+'</span>':'') : '<span class="badge b-g">Al día</span>')+'</td>'+
  '</tr>';
}
// El vacío tiene dos causas muy distintas —no hay nada, o hay un filtro puesto—
// y decir cuál es evita que alguien crea que su área no tiene bienes.
function filaVacia(){
  var f=S.filtro, puestos=[];
  if(f.q) puestos.push('la búsqueda «'+esc(f.q)+'»');
  if(f.alerta) puestos.push('el filtro «'+esc(nombreAlerta(f.alerta))+'»');
  if(f.area) puestos.push('el área '+esc(f.area));
  if(f.hoja) puestos.push('«'+esc(f.hoja)+'»');
  return '<tr><td colspan="8" class="empty">'+
    (puestos.length ? 'Ningún bien cumple '+puestos.join(' y ')+'.' : 'Todavía no hay bienes registrados.')+
    '</td></tr>';
}
// Nombre legible de cada filtro de alerta, para poder mostrarlo y quitarlo.
function nombreAlerta(k){
  var g=GRUPOS_ALERTA.filter(function(x){return x.k===k;})[0];
  return g?g.t:k;
}
function vistaBienes(){
  var lista=bienesFiltrados();
  if(!S.bienes.length) return sinDatos();
  var areasConBienes={}; S.bienes.forEach(function(b){ areasConBienes[b.sigla]=1; });
  // Los filtros activos se ven y se quitan de a uno: si no, uno se queda puesto
  // sin que se note y la lista aparece vacía sin explicación.
  var chips=[];
  if(S.filtro.alerta) chips.push('<button class="chip on" data-quita="alerta">'+esc(nombreAlerta(S.filtro.alerta))+' ✕</button>');
  if(S.filtro.area)   chips.push('<button class="chip on" data-quita="area">'+esc(S.filtro.area)+' ✕</button>');
  if(S.filtro.hoja)   chips.push('<button class="chip on" data-quita="hoja">'+esc(S.filtro.hoja)+' ✕</button>');
  return ''+
  (chips.length?'<div class="chips" style="margin-bottom:13px">'+chips.join('')+'</div>':'')+
  '<div class="toolbar">'+
    '<div class="search"><input id="q" placeholder="Buscar por código, descripción, serie, custodio, ubicación…" value="'+esc(S.filtro.q)+'"></div>'+
    (S.rol==='cata'
      ? '<select class="f" id="fArea"><option value="">Todas las áreas</option>'+
        AREAS.filter(function(a){return areasConBienes[a.s];}).map(function(a){return opt(a.s,S.filtro.area,a.s+' · '+trunc(a.n,34));}).join('')+'</select>'
      : '')+
    '<select class="f" id="fHoja">'+opt('',S.filtro.hoja,'Activos y bienes de control')+opt('Activos',S.filtro.hoja,'Solo activos fijos')+opt('Bienes control',S.filtro.hoja,'Solo bienes de control')+'</select>'+
    '<button class="btn line sm" id="csv">Exportar CSV</button>'+
  '</div>'+
  '<div class="tablewrap">'+
    '<table class="list"><thead><tr>'+
      '<th>Código y bien</th>'+(S.rol==='cata'?'<th>Área</th>':'')+'<th>Custodio y ubicación</th>'+
      '<th style="text-align:right">Valor</th><th style="text-align:right">En libros hoy</th>'+
      '<th>Compra</th><th>Clase</th><th>Estado</th>'+
    '</tr></thead><tbody>'+
      (lista.length? lista.slice(0,400).map(filaBien).join('')
        : filaVacia())+
    '</tbody></table>'+
  '</div>'+
  (lista.length>400?'<p class="psub" style="margin-top:10px">Se muestran los primeros 400 de '+lista.length+'. Afina la búsqueda o exporta el CSV.</p>':
   '<p class="psub" style="margin-top:10px">'+lista.length+' bien(es). Toca una fila para ver la ficha completa.</p>');
}
function sinDatos(){
  return '<div class="panel"><div class="ptitle">No hay bienes para mostrar</div>'+
    '<p class="psub">Si acabas de iniciar sesión y esto no cambia, probablemente tu cuenta todavía no está en la '+
    'lista de accesos — pídele a la administradora de bienes que te agregue. Mientras tanto, el formulario '+
    'funciona igual.</p>'+
    (S.rol==='cata'?botonExcel():'')+'</div>';
}
function botonExcel(){
  return '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
    '<button class="btn line" id="abrirXlsx">Abrir la matriz (.xlsx)</button>'+
    '<span style="font-size:12px;color:var(--muted)">Se lee en tu navegador: el archivo no sale de tu computador.</span>'+

/* ---------- vista: panel ---------- */
function vistaPanel(){
  if(!S.bienes.length) return sinDatos();
  var b=S.bienes;
  var total=b.reduce(function(a,x){return a+x.valor;},0);
  var libros=b.reduce(function(a,x){return a+x.dep.residual;},0);
  var activos=b.filter(function(x){return x.hoja==='Activos';}).length;
  var nuevos=b.filter(esNuevo).length;
  var conAlerta=b.filter(function(x){return alertasDe(x).some(function(a){return a.cls==='b-r'||a.cls==='b-a';});}).length;

  // Concentración por área, de mayor a menor valor.
  var porArea={};
  b.forEach(function(x){
    var k=x.sigla; porArea[k]=porArea[k]||{n:0,v:0,alert:0};
    porArea[k].n++; porArea[k].v+=x.valor;
    if(alertasDe(x).some(function(a){return a.cls==='b-r';})) porArea[k].alert++;
  });
  var filas=Object.keys(porArea).map(function(k){ return {s:k, d:porArea[k]}; })
    .sort(function(a,b2){ return b2.d.v-a.d.v; });
  var maxV=filas.length?filas[0].d.v:1;

  return ''+
  '<div class="kpis">'+
    '<div class="kpi"><div class="kpi-n">'+b.length+'</div><div class="kpi-l">Bienes registrados</div></div>'+
    '<div class="kpi"><div class="kpi-n">'+moneyShort(total)+'</div><div class="kpi-l">Valor de compra</div></div>'+
    '<div class="kpi"><div class="kpi-n">'+moneyShort(libros)+'</div><div class="kpi-l">Valor en libros hoy</div></div>'+
    '<div class="kpi"><div class="kpi-n" style="color:'+(nuevos?'var(--navy)':'inherit')+'">'+nuevos+'</div><div class="kpi-l">Nuevos por revisar</div></div>'+
    '<div class="kpi"><div class="kpi-n" style="color:'+(conAlerta?'var(--amber)':'inherit')+'">'+conAlerta+'</div><div class="kpi-l">Con algo pendiente</div></div>'+
  '</div>'+

  '<div class="panel">'+
    '<div class="ptitle">Cómo se reparte el patrimonio</div>'+
    '<p class="psub">'+activos+' activos fijos y '+(b.length-activos)+' bienes de control, en '+filas.length+' áreas. '+
      'El valor en libros se recalcula al abrir esta página, no queda congelado en el Excel.</p>'+
    '<div class="tablewrap"><table class="list"><thead><tr>'+
      '<th>Área</th><th style="text-align:right">Bienes</th><th style="text-align:right">Valor</th><th>Peso</th><th style="text-align:right">Urgentes</th>'+
    '</tr></thead><tbody>'+
    filas.map(function(r){
      var pct=Math.max(2, Math.round(r.d.v/maxV*100));
      return '<tr data-area="'+esc(r.s)+'">'+
        '<td><b class="mono">'+esc(r.s)+'</b><div style="font-size:11.5px;color:var(--muted)">'+esc(trunc(areaNombre(r.s),46))+'</div></td>'+
        '<td class="num">'+r.d.n+'</td>'+
        '<td class="num">'+money0(r.d.v)+'</td>'+
        '<td style="min-width:130px"><div style="height:7px;background:var(--line2);border-radius:9px;overflow:hidden">'+
          '<div style="height:100%;width:'+pct+'%;background:var(--navy2);border-radius:9px"></div></div></td>'+
        '<td class="num">'+(r.d.alert?'<span class="badge b-r">'+r.d.alert+'</span>':'—')+'</td>'+
      '</tr>';
    }).join('')+
    '</tbody></table></div>'+
  '</div>'+

  '<div class="panel">'+
    '<div class="ptitle">Datos</div>'+
    '<p class="psub">'+(S.fuente==='excel'
      ? 'Estás viendo la matriz que abriste en este navegador. No se guardó en ningún lado.'
      : 'Consultado en vivo a la Lista de SharePoint al iniciar sesión — no es una copia guardada en ningún lado.')+'</p>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
      '<button class="btn line sm" id="csvTodo">Exportar toda la matriz (CSV)</button>'+
      '<button class="btn line sm" id="abrirXlsx">Abrir otra matriz (.xlsx)</button>'+
      '<input type="file" id="fileXlsx" accept=".xlsx" style="display:none">'+
    '</div>'+
  '</div>';
}

    return '<div class="panel"><div class="ptitle">Nada pendiente</div>'+

    nuevos.map(function(b){
      var faltan=alertasDe(b).filter(function(a){return a.k!=='nuevo'&&a.k!=='agotada';});
      return '<tr>'+
        '<td data-cod="'+esc(b.codigo)+'" style="cursor:pointer"><b class="mono">'+esc(b.codigo)+'</b>'+
          '<div style="font-size:11.5px;color:var(--muted)">'+esc(trunc(b.descripcion,40))+'</div></td>'+
        '<td>'+esc(b.sigla)+'</td>'+
        '<td>'+esc(trunc(b.custodio||'—',24))+'</td>'+

}

/* ---------- ficha de un bien ---------- */
// QR real del bien, dibujado en el navegador (ver nota en el <head> sobre por
// qué reemplaza a la fórmula =IMAGE(...) del Excel, que nunca funcionó).
// Codifica solo el código: un QR más corto escanea mejor en una etiqueta chica
// que uno con todos los datos encima, y el código alcanza para buscar el resto
// aquí mismo. 'M' tolera que la etiqueta se manche o se raye un poco.
function qrSvg(texto, cellSize){
  var qr = qrcode(0, 'M');
  qr.addData(texto);
  qr.make();
  return qr.createSvgTag({cellSize: cellSize||4, margin:2});
}

    '</div>'+

      '<div class="desc">'+esc(b.descripcion)+(b.marca?' · '+esc(b.marca):'')+(b.modelo?' '+esc(b.modelo):'')+'</div>'+

      '<dt>Valor de compra</dt><dd>'+money(b.valor)+' · '+fdate(b.fechaCompra)+'</dd>'+
      '<dt>Depreciación</dt><dd>'+money(b.dep.anual)+'/año · '+money(b.dep.mensual)+'/mes · '+
        b.dep.meses+' meses corridos<br><b>Acumulada '+money(b.dep.acumulada)+' · en libros '+money(b.dep.residual)+'</b>'+
        (b.dep.agotada?' <span class="badge b-d">vida útil cumplida</span>':'')+'</dd>'+
      '<dt>Custodio</dt><dd>'+esc(b.custodio||'—')+(b.cedula?' · '+esc(b.cedula):'')+'</dd>'+
      '<dt>Ubicación</dt><dd>'+esc(b.ubicacion||'—')+' · '+esc(b.institucion||'')+'</dd>'+

      '<dt>Donante / proyecto</dt><dd>'+esc(b.donante||'—')+' · '+esc(b.proyecto||'FAP')+'</dd>'+

      '<dt>Garantía</dt><dd>'+esc(b.garantia||'—')+(b.finGarantia?' · hasta '+fdate(b.finGarantia)+' ('+esc(b.estadoGarantia)+')':'')+'</dd>'+
      '<dt>Respaldos</dt><dd>'+link(b.acta,'Acta de entrega')+' · '+link(b.facturaLink,'Factura')+' · '+link(b.foto,'Fotografía')+'</dd>'+
      (b.observaciones?'<dt>Observaciones</dt><dd>'+esc(b.observaciones)+'</dd>':'')+
      (b.fechaBaja?'<dt>Baja</dt><dd>'+fdate(b.fechaBaja)+' · '+esc(b.motivoBaja||'')+'</dd>':'')+

function cerrarModal(){ $('#modal').innerHTML=''; }
// El QR se dibuja como SVG (nítido a cualquier tamaño); para descargarlo como
// archivo se pasa una vez por un <canvas> y se exporta a PNG, que es el formato
// que cualquier editor de etiquetas sabe abrir.
function descargarQR(codigo){
  var svg = qrSvg(codigo, 10);
  var img = new Image();
  var blob = new Blob([svg], {type:'image/svg+xml'});
  var url = URL.createObjectURL(blob);
  img.onload = function(){
    var cv = document.createElement('canvas');
    cv.width = img.width; cv.height = img.height;
    cv.getContext('2d').drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    cv.toBlob(function(pngBlob){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(pngBlob);
      a.download = 'QR_' + codigo.replace(/[^\w-]+/g,'_') + '.png';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
    });
  };
  img.src = url;
}

/* ---------- CSV ---------- */
var CSV_COLS=[
  ['codigo','CODIGO'],['descripcion','DESCRIPCIÓN'],['detalle','DESCRIPCIÓN(ADICIONAL)'],['cantidad','CANTIDAD'],
  ['tipoSeguros','TIPO DE BIEN SEGUROS'],['tipoContable','TIPO DE BIEN SISTEMA CONTABLE'],['proyecto','PROYECTO'],
  ['fechaCompra','FECHA DE COMPRA'],['donante','DONANTE'],['proveedor','PROVEEDOR'],['ruc','RUC DE PROVEEDOR'],
  ['factura','N° FACTURA'],['facturaLink','FACTURA DIGITAL'],['valor','VALOR DEL BIEN(INC.IMP)'],
  ['marca','MARCA'],['modelo','MODELO'],['serie','NUMERO DE SERIE'],['cedula','CEDULA CUSTODIO'],
  ['custodio','NOMBRES Y APELLIDOS CUSTODIO'],['institucion','INSTITUCIÓN'],['ubicacion','UBICACIÓN'],
  ['acta','ACTA ENTREGA'],['asegurado','ASEGURADO (SI/NO)'],['inicioSeguro','INICIO SEGURO'],['finSeguro','FIN SEGURO'],
  ['aseguradora','ASEGURADORA'],['poliza','NRO DE POLIZA'],['garantia','GARANTIA TECNICA'],
  ['inicioGarantia','INICIO GARANTIA'],['finGarantia','FIN DE GARANTIA'],['estadoGarantia','ESTADO DE GARANTIA'],
  ['estadoFisico','ESTADO FÍSICO'],['vida','VIDA ÚTIL (AÑOS)']
];
function csvDe(lista, nombre){
  var head=CSV_COLS.map(function(c){return c[1];})
    .concat(['DEPRECIACIÓN ANUAL','DEPRECIACIÓN MENSUAL','DEPRECIACIÓN ACUMULADA','VALOR EN LIBROS',
             'HOJA','ÁREA','FECHA DE BAJA','MOTIVO DE BAJA','OBSERVACIONES','FOTOGRAFÍA']);
  var filas=lista.map(function(b){
    return CSV_COLS.map(function(c){ return csvCell(b[c[0]]); })
      .concat([b.dep.anual.toFixed(2), b.dep.mensual.toFixed(2), b.dep.acumulada.toFixed(2), b.dep.residual.toFixed(2),
               csvCell(b.hoja), csvCell(b.area), csvCell(b.fechaBaja), csvCell(b.motivoBaja),
               csvCell(b.observaciones), csvCell(b.foto)]).join(';');
  });
  // BOM para que Excel en español abra las tildes bien.
  download('﻿'+head.join(';')+'\n'+filas.join('\n'), nombre, 'text/csv;charset=utf-8');
  toast(lista.length+' fila(s) exportadas. La depreciación va calculada a hoy.');
}

/* ================= EVENTOS ================= */
function bind(sel, ev, fn){ var el=$(sel); if(el) el.addEventListener(ev, fn); }
function enlazar(){
  document.querySelectorAll('.navitem').forEach(function(b){
    b.addEventListener('click', function(){ S.vista=b.dataset.v; render(); });
  });
  bind('#salir','click', function(){
    if(msalCuenta) msalSalir(); else location.reload();
  });

  /* ---- formulario ---- */
  Object.keys(S.form).forEach(function(k){
    var el=$('#f-'+k); if(!el) return;
    var ev = (el.tagName==='SELECT') ? 'change' : 'input';
    el.addEventListener(ev, function(){
      S.form[k] = (el.type==='number') ? el.value : el.value;
      if(k==='cedula' && /^\d{10}$/.test(el.value.trim())) autocompletarCustodio(el.value.trim());
      if(k==='garantia' && el.value==='SI' && !S.form.inicioGarantia) S.form.inicioGarantia=S.form.fechaCompra;
      // Solo se vuelve a dibujar cuando el cambio mueve los cálculos.
      if(['sigla','tipoContable','valor','fechaCompra','garantia','finGarantia','asegurado','inicioGarantia'].indexOf(k)>=0){
        var pos=document.activeElement && document.activeElement.id;
        render();
        var again=pos?$('#'+pos):null; if(again && again.focus) again.focus();
      }
    });
  });
  bind('#btn-enviar','click', enviar);
  bind('#btn-limpiar','click', function(){ var s=S.form.sigla; nuevoFormulario(); S.form.sigla=s; render(); });
  bind('#codman','click', function(e){
    e.preventDefault();
    var c=calculado();
    var v=prompt('Código del bien (formato 02-SIGLA-###-XX):', c.codigo||'');
    if(v!=null){ S.form.codigoManual=v.trim(); render(); }
  });
  bind('#codauto','click', function(e){ e.preventDefault(); S.form.codigoManual=''; render(); });

  /* ---- listado ---- */
  bind('#q','input', function(e){
    S.filtro.q=e.target.value;
    var tb=$('.tablewrap tbody'); if(!tb) return;
    var l=bienesFiltrados();
    tb.innerHTML = l.length? l.slice(0,400).map(filaBien).join('')
      : filaVacia();
    filasClicables();
  });
  bind('#fArea','change', function(e){ S.filtro.area=e.target.value; render(); });
  bind('#fHoja','change', function(e){ S.filtro.hoja=e.target.value; render(); });
  bind('#csv','click', function(){ csvDe(bienesFiltrados(), 'bienes_FAP_'+todayISO()+'.csv'); });
  bind('#csvTodo','click', function(){ csvDe(S.bienes, 'matriz_bienes_FAP_'+todayISO()+'.csv'); });
  bind('#csvNuevos','click', function(){ csvDe(S.bienes.filter(esNuevo), 'bienes_nuevos_'+todayISO()+'.csv'); });
  filasClicables();

  // Saltar al listado desde el panel o desde una alerta parte de cero: si se
  // acumulara con lo que ya estaba filtrado, la lista saldría vacía sin motivo.
  document.querySelectorAll('[data-area]').forEach(function(tr){
    tr.style.cursor='pointer';
    tr.addEventListener('click', function(){
      S.filtro={q:'', area:tr.dataset.area, hoja:'', alerta:''}; S.vista='bienes'; render();
    });
  });
  document.querySelectorAll('[data-verk]').forEach(function(b){
    b.addEventListener('click', function(){
      S.filtro={q:'', area:'', hoja:'', alerta:b.dataset.verk}; S.vista='bienes'; render();
    });
  });
  document.querySelectorAll('[data-quita]').forEach(function(b){
    b.addEventListener('click', function(){ S.filtro[b.dataset.quita]=''; render(); });
  });

  /* ---- revisión ---- */
  document.querySelectorAll('[data-rev]').forEach(function(b){
    b.addEventListener('click', function(){ marcarRevisado(b.dataset.rev); render(); });
  });
  bind('#revTodo','click', function(){
    marcarTodoVisto(S.bienes.map(function(b){return b.codigo;}));
    lsSet(LS_REVISADOS,{}); render(); toast('Todo marcado como revisado.');
  });
  bind('#resetVistos','click', function(){
    if(confirm('¿Volver a marcar todos los bienes como nuevos? Sirve para hacer una revisión completa desde cero.')){
      localStorage.removeItem(LS_VISTOS); localStorage.removeItem(LS_REVISADOS); render();
    }
  });

  /* ---- enviados ---- */
  document.querySelectorAll('[data-dl]').forEach(function(b){
    b.addEventListener('click', function(){
      var e=S.enviados[+b.dataset.dl];
      download(JSON.stringify(e,null,2), 'BIEN_'+String(e.codigo||'nuevo').replace(/[^\w-]+/g,'_')+'.json','application/json');
    });
  });

  /* ---- abrir matriz .xlsx ---- */
  bind('#abrirXlsx','click', function(){ var i=$('#fileXlsx'); if(i) i.click(); });
  bind('#fileXlsx','change', function(e){
    var file=e.target.files[0]; if(!file) return;
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var lista=leerXlsx(fr.result);
        if(!lista.length) throw new Error('No encontré filas en las hojas «Activos» y «Bienes control».');
        S.bienes=lista; S.fuente='excel';
        if(!vistosSet()) marcarTodoVisto(lista.map(function(b){return b.codigo;}));
        S.vista='panel'; render();
        toast(lista.length+' bienes leídos de la matriz.');
      }catch(err){
        toast('No pude leer el archivo: '+(err.message||'formato inesperado.'), 5200);
      }
    };
    fr.readAsArrayBuffer(file);
  });
}
function filasClicables(){
  document.querySelectorAll('tr[data-cod],td[data-cod]').forEach(function(el){
    el.style.cursor='pointer';
    el.addEventListener('click', function(){ abrirFicha(el.dataset.cod); });
  });
}
// Con la cédula ya escrita, el nombre del custodio sale del catálogo.
function autocompletarCustodio(ced){
  var b=S.bienes.filter(function(x){ return String(x.cedula||'').replace(/\D/g,'')===ced.replace(/\D/g,''); })[0];
  if(b && b.custodio && !S.form.custodio){
    S.form.custodio=b.custodio;
    var el=$('#f-custodio'); if(el) el.value=b.custodio;
  }
}
